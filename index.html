en tu Palabra como tú creías. Amén.", "rq": [["¿Cómo pudo Jonás vivir adentro de un pez?", "La Biblia lo presenta como algo que hizo Dios: Jehová “tenía preparado” el pez (Jonás 1:17). Es un milagro, y ahí vale lo que vieron en la semana 20."], ["¿Entonces todo se lee al pie de la letra?", "No todo. “Jehová es mi pastor” es una imagen, y el hijo pródigo es una parábola. Hay que mirar qué tipo de texto es. Lo siguen viendo en las semanas 22 y 23."], ["¿Y el diluvio y los seis días de Génesis?", "Las iglesias evangélicas leen algunos detalles de forma distinta. Todas coinciden en que Dios creó todo y en que Noé fue real. Podés decirle que hay cristianos que piensan distinto."]], "seg": "¿Qué historia del Antiguo Testamento te cuesta más creer? ¿Por qué?", "det": "Las vio en dibujitos, con una ballena simpática y animales en fila. Ahora que crece, teme que sean como los cuentos de hadas. Si te lo pregunta, está separando lo infantil de lo real, y eso es sano. Ayudalo a ver cómo las leía Jesús.", "evi": "“Son cuentos lindos con una enseñanza.” Le enseña a soltar justo lo que Jesús tomó en serio. Mejor mostrale dónde Jesús los nombra.", "xt": "Para hacerlo divertido", "x": "Jueguen a “historia, poesía o parábola”. Lean Jonás 1:1-3, Salmo 23:1 y Lucas 15:11-13, y que tu hijo adivine cuál es cuál y por qué. Así ve que leer bien es fijarse en cómo está escrito.", "leer": "Génesis 6 a 8 · Jonás 1 y 2 · Mateo 12:38-42 · Romanos 15:4-6"}, {"n": 22, "e": 2, "q": "¿La Biblia se contradice?", "rep": false, "ch": "Si vos y tu amigo cuentan el mismo partido, no van a contar lo mismo, y ninguno está mintiendo. Cada uno se fijó en algo distinto. En la Biblia a veces pasa eso. Y cuando algo no lo entendemos, lo leemos otra vez y preguntamos.", "gr": "Hay cosas que parecen chocar, y te lo digo de frente. Mateo nombra un ángel en la tumba y Juan dos. Si había dos, había uno: Mateo se enfoca en el que habló. Muchas dudas se aclaran así, mirando bien el contexto. Y si alguna no la resolvemos, la buscamos juntos.", "pi": [["Cuatro testigos cuentan la misma historia desde distintos ángulos, como cuatro fotos", "Lucas 1:1-3", "Lucas cuenta que investigó con cuidado lo que transmitieron los testigos. Los cuatro evangelios son como cuatro fotos de una misma fiesta: cada una muestra algo. Si fueran iguales palabra por palabra, sospecharíamos."], ["Hay que leer cada parte en su contexto", "2 Timoteo 2:15", "Pablo pide usar bien la Palabra. Mirá el Salmo 14:1: si cortás la frase queda “No hay Dios”, pero entera dice “Dice el necio en su corazón: No hay Dios”. Una frase suelta puede decir lo contrario."], ["Dios no miente", "Números 23:19", "Detrás de la Biblia está un Dios que no miente y que cumple lo que dice. Por eso, cuando algo no cierra, lo más sano es buscar con paciencia antes de decir que está equivocada."]], "cita": "Números 23:19", "vers": "Dios no es hombre, para que mienta, Ni hijo de hombre para que se arrepienta. El dijo, ¿y no hará? Habló, ¿y no lo ejecutará?", "or": "Señor, cuando algo me cueste entender, ayúdame a buscar con paciencia. Amén.", "rq": [["Encontré una lista de contradicciones en internet.", "Buenísimo, mírenla juntos y elijan una sola. Lean el pasaje completo, con lo de antes y lo de después. Muchas veces la frase quedó cortada o fuera de lugar."], ["¿Y si hay una que nadie puede explicar?", "Hay pasajes difíciles, y no entender algo todavía no significa que esté mal. Pueden preguntarle a tu pastor. Buscar sin apuro también es parte de la fe."], ["¿Por qué no hay una sola historia de Jesús?", "Cuatro relatos dicen más que uno: en la ley de Israel, una acusación se sostenía con dos o tres testigos (Deuteronomio 19:15). Cada evangelio resalta algo de Jesús."]], "seg": "¿Hay algo de la Biblia que leíste y no te cerró? ¿Qué fue?", "det": "En internet abundan las listas de “contradicciones de la Biblia”, y a esta edad es muy probable que le aparezca alguna. Le puede dar miedo que sea cierto. Si te muestra una, no te asustes: anotala y miren juntos qué dice el texto.", "evi": "“La Biblia no tiene ningún problema, no leas esas cosas.” Le enseña que hay algo que esconder. Si tiene una duda, que la traiga a casa.", "xt": "Para hacerlo divertido", "x": "Que cada uno cuente por separado lo que pasó en la última cena familiar. Comparen: cada uno se acordó de cosas distintas y nadie mintió. Después miren Mateo 28:2 y Juan 20:12 con esa idea.", "leer": "Lucas 1:1-4 · Salmo 14 · Mateo 28:1-8 · Juan 20:1-18"}, {"n": 23, "e": 2, "q": "¿Cómo entiendo lo que leo en la Biblia?", "rep": false, "ch": "Antes de leer, le pedimos a Dios que nos ayude. Después leemos un pedacito, y vos me contás qué entendiste. Si hay una palabra rara, la buscamos. Si no sale, le preguntamos a alguien que sepa. No hace falta entender todo de una.", "gr": "No necesitás entender todo de entrada. Pedile ayuda a Dios, leé despacio y fijate quién habla, a quién y qué pasa antes y después. Si algo no te cierra, anotalo y traelo. Hasta Pedro reconoce que Pablo escribe cosas difíciles.", "pi": [["El Espíritu Santo me enseña", "Juan 14:26", "Jesús se lo prometió a sus discípulos, y ese mismo Espíritu acompaña hoy a los que creen. Su ayuda nos lleva a entender y recordar lo que Jesús enseñó."], ["Puedo preguntarle a alguien que sepa, como el hombre de Etiopía", "Hechos 8:30-31", "Un funcionario de Etiopía iba leyendo Isaías sin entender. Felipe le preguntó y él contestó: “¿Y cómo podré, si alguno no me enseñare?”. Preguntar no es flojera. Dios también enseña a través de otras personas."], ["Le pido a Dios que abra mis ojos", "Salmo 119:18", "El salmista ya conocía la Palabra, y aun así pide que Dios le abra los ojos. Una idea simple: antes de leer, oren esta frase. Tu hijo aprende que leer la Biblia también es hablar con Dios."]], "cita": "Salmo 119:18", "vers": "Abre mis ojos, y miraré Las maravillas de tu ley.", "or": "Espíritu Santo, abre mis ojos para entender lo que leo. Amén.", "rq": [["¿Cada uno puede entender lo que quiere?", "No. El autor quiso decir algo, y buscamos eso. Pedro avisa que algunos tuercen las Escrituras (2 Pedro 3:16). Por eso ayuda leer en contexto y charlarlo con otros."], ["¿Por dónde empiezo?", "Un evangelio como Marcos o Juan es un buen comienzo, porque se centra en Jesús. Un pedacito por día alcanza. Las partes más difíciles pueden esperar."], ["¿Por qué otros entienden y yo no?", "Cada uno va a su ritmo, y todos aprendemos de a poco. Al etíope nadie lo retó por no entender: Felipe se sentó con él y le explicó (Hechos 8:31-35)."]], "seg": "¿Qué parte de la Biblia te gustaría que leamos juntos esta semana?", "det": "La Biblia tiene palabras viejas, nombres raros y partes difíciles, y tu hijo puede sentir que no es para él. Si te lo pregunta, ya quiere leerla por su cuenta. Es un muy buen momento. No hace falta que sepas mucho: alcanza con acompañarlo.", "evi": "“Eso es para cuando seas más grande.” Le dice que la Biblia no es para él. Mejor leé con él lo que puedan y decile qué no sabés.", "xt": "Si se traba", "x": "Usen tres preguntas con cualquier pasaje: ¿quién habla?, ¿a quién?, ¿qué me muestra de Dios? Si el lenguaje le cuesta, lean el mismo pasaje en una versión más simple y comparen.", "leer": "Hechos 8:26-39 · Juan 14:25-27 · Salmo 119:17-24 · 2 Pedro 3:15-16"}, {"n": 24, "e": 2, "q": "¿Se cumplieron las profecías de la Biblia?", "rep": false, "ch": "Mucho antes de que Jesús naciera, Dios les contó a unos profetas cómo iba a ser. Dijeron que iba a nacer en Belén, y nació en Belén. Dijeron que iba a sufrir por nosotros, y pasó. Cuando Dios promete algo, lo cumple.", "gr": "Hay cosas que nadie puede arreglar desde afuera. Jesús no eligió nacer en Belén, y los soldados no sabían que estaban cumpliendo un salmo. Eso se escribió cientos de años antes, y hay copias de Isaías anteriores a Jesús. Para mí, muestra que Dios conduce la historia.", "pi": [["Dijeron que el Mesías nacería en Belén", "Miqueas 5:2", "Miqueas nombra un pueblo chico, y siglos después Jesús nace ahí (Mateo 2:1). Nadie elige dónde nacer. Hasta los sacerdotes de Jerusalén sabían que el Cristo iba a nacer en Belén (Mateo 2:4-6)."], ["Dijeron que iba a sufrir por nuestros pecados", "Isaías 53:5", "Isaías describe a alguien herido por las rebeliones de otros. Cuando el etíope de Hechos 8 leía ese pasaje, Felipe le anunció a Jesús (Hechos 8:35). Pedro también lo aplica a la cruz (1 Pedro 2:24)."], ["Dijeron que sortearían su ropa", "Salmo 22:18", "El Salmo 22 habla de repartir la ropa y echar suertes. Al pie de la cruz, unos soldados romanos hicieron justo eso (Juan 19:23-24). Ellos no estaban tratando de cumplir ninguna profecía."]], "cita": "Isaías 53:5", "vers": "Mas él herido fue por nuestras rebeliones, molido por nuestros pecados; el castigo de nuestra paz fue sobre él, y por su llaga fuimos nosotros curados.", "or": "Jesús, gracias porque todo lo que se dijo de ti se cumplió. Amén.", "rq": [["¿No es como el horóscopo?", "El horóscopo dice cosas generales que le calzan a cualquiera. Estas profecías nombran un pueblo y hechos concretos. Y la Biblia prohíbe la adivinación (Deuteronomio 18:10)."], ["¿Y si Jesús las cumplió a propósito?", "Algunas las podía elegir, como entrar en un asno (Zacarías 9:9). Pero no dónde nacer, ni lo que los soldados hicieron con su ropa."], ["¿Quedan profecías por cumplirse?", "Sí, como la vuelta de Jesús, que van a ver en la semana 38. Los cristianos difieren en los detalles del orden, y todos esperan que Él vuelva."]], "seg": "¿Qué promesa de Dios te gustaría recordar cuando tengas miedo?", "det": "Quizás nunca escuchó la palabra profecía, o la asocia con adivinos. Una profecía es un mensaje de Dios, y a veces anuncia lo que va a pasar. A tu hijo le puede sorprender que la Biblia haya dicho cosas de Jesús mucho antes de que naciera.", "evi": "“Las chances de que pasara eran una en mil billones.” Esas cuentas circulan sin base firme, y si las revisa va a desconfiar. Con los textos alcanza.", "xt": "Para hacerlo más real", "x": "Hagan dos columnas. A la izquierda, la profecía: Miqueas 5:2 y Salmo 22:18. A la derecha, el cumplimiento: Mateo 2:1 y Juan 19:23-24. Que tu hijo las busque y las marque en su Biblia.", "leer": "Isaías 53 · Salmo 22 · Mateo 2:1-6 · Juan 19:23-24"}, {"n": 25, "e": 2, "q": "¿Quién decidió qué libros van en la Biblia?", "rep": false, "ch": "Nadie se sentó a inventar la Biblia. Los libros que venían de los apóstoles ya se leían en las iglesias. Después hicieron la lista. Es como cuando juntan tus dibujos en una carpeta: ya eran tuyos antes de que los juntaran.", "gr": "Se dice que un concilio eligió los libros, y no fue así. Las iglesias ya los usaban desde hacía mucho, y los concilios de fines del siglo IV confirmaron lo que se reconocía. Se fijaban en que vinieran de los apóstoles y coincidieran con lo que Jesús enseñó.", "pi": [["Jesús confirmó el Antiguo Testamento", "Lucas 24:44", "Jesús nombró la ley de Moisés, los profetas y los salmos, una forma de nombrar las Escrituras de su pueblo. Esos son los libros que leía y citaba Él, y con eso nos alcanza para confiar en el Antiguo Testamento."], ["El Nuevo Testamento lo escribieron los apóstoles y personas cercanas a ellos", "Efesios 2:20", "Pablo dice que la iglesia se edifica sobre apóstoles y profetas. Por eso los primeros creyentes buscaban escritos con ese origen. Pedro ya ponía las cartas de Pablo junto a “las otras Escrituras” (2 Pedro 3:16)."], ["Las iglesias reconocieron esos libros, no los inventaron", "Historia", "Las iglesias se fijaban si un libro venía de los apóstoles, si coincidía con el resto y si se leía en todas partes. Escritos como el evangelio de Tomás son posteriores a los apóstoles y no pasaron esa prueba."]], "cita": "Efesios 2:20", "vers": "edificados sobre el fundamento de los apóstoles y profetas, siendo la principal piedra del ángulo Jesucristo mismo,", "or": "Gracias, Dios, por darnos tu Palabra completa. Amén.", "rq": [["¿Y los evangelios que quedaron afuera?", "Existen, como los de Tomás o Judas. Se escribieron después de los apóstoles, y muchos enseñan ideas que chocan con el resto de la Biblia. Por eso las iglesias no los reconocieron."], ["¿Por qué la Biblia católica tiene más libros?", "Suma escritos que no estaban en la Biblia hebrea. Las Biblias evangélicas siguen esa lista de 39 libros en el Antiguo Testamento. Contalo con respeto por quienes tienen otra Biblia."], ["¿Dios podría agregar más libros?", "La fe evangélica entiende que la Biblia está completa. Jesús es lo más grande que Dios nos dijo (Hebreos 1:1-2). Por eso no esperamos otro libro."]], "seg": "¿Cuál de los 66 libros te gustaría conocer mejor este año?", "det": "Seguramente escuchó, por un video o una serie, que unos hombres importantes eligieron los libros en una reunión secreta. Suena a película y queda pegado. También puede preguntar por los evangelios que “quedaron afuera”. Ayudalo a pedir fechas y fuentes.", "evi": "“Esos libros son del diablo.” Cierra la charla y despierta más intriga. Mejor explicale cuándo se escribieron y por qué las iglesias no los reconocieron.", "xt": "Si se traba", "x": "Usen esta imagen: cuando le dan un premio al mejor jugador, reconocen cómo jugó, y el premio no lo hace jugar mejor. Las iglesias reconocieron los libros. Después cuenten juntos los 66 del índice.", "leer": "Lucas 24:44-49 · 2 Pedro 3:15-16 · Efesios 2:19-22"}, {"n": 26, "e": 2, "q": "¿Por qué confío en la Biblia?", "rep": true, "ch": "Confío en la Biblia porque la cuidaron durante miles de años y no cambió. Habla de lugares de verdad, que se encontraron. Y dijo cosas de Jesús antes de que pasaran, y pasaron. Dios no miente. Por eso le creo.", "gr": "Confío en la Biblia porque tengo razones. Las copias antiguas muestran que se conservó. La arqueología muestra que habla de personas y lugares reales. Las profecías se cumplieron en Jesús. Y Él mismo, orando al Padre, dijo: tu palabra es verdad.", "pi": [["No cambió con el tiempo (semana 16)", "Isaías 40:8", "Repasen la semana 16: el teléfono descompuesto y los rollos de Isaías. La idea que tiene que quedar: hay miles de copias antiguas, se pueden comparar y muestran que el texto se conservó."], ["Habla de hechos reales (semana 17)", "Lucas 1:4", "Repasen la semana 17: la piedra de Tel Dan, la de Pilato y el estanque de Siloé. La idea: la Biblia nombra personas y lugares reales. Lucas escribió para que conozcamos bien la verdad de lo que se nos enseñó."], ["Sus profecías se cumplieron (semana 24)", "Isaías 53:5", "Repasen la semana 24: Belén, la cruz y la ropa sorteada. La idea: se anunció cientos de años antes y pasó. Eso apunta a un Dios que conoce la historia, y da confianza en lo que dice."]], "cita": "Juan 17:17", "vers": "Santifícalos en tu verdad; tu palabra es verdad.", "or": "Señor, tu Palabra es verdad. Quiero construir mi vida sobre ella. Amén.", "rq": [["¿Y si me dicen que es un libro viejo?", "Viejo no significa falso. Le puede contestar lo que vio: sus copias se conservaron y habla de hechos reales. Y sigue sirviendo hoy, como vieron en la semana 19."], ["¿Y si me muestran algo que parece un error?", "Que no se asuste. Lean el contexto, como en la semana 22. Decir “no lo sé, lo voy a buscar” es una respuesta honesta."], ["¿Y si a veces me cuesta confiar igual?", "Le pasa a muchos creyentes, y la semana 43 habla de eso. Decile que las razones ayudan, y que la confianza también crece caminando con Dios."]], "seg": "Si tuvieras que decir en una frase por qué confiás en la Biblia, ¿qué dirías?", "det": "Llegó el momento de juntar todo. Ya vio que la Biblia no cambió, que habla de hechos reales y que sus profecías se cumplieron. Ahora toca que lo diga con sus palabras. No busques una respuesta perfecta: alcanza con que la sienta suya.", "evi": "“Ya te lo expliqué todo, ahora no dudes más.” Las dudas pueden volver, y necesita saber que las puede traer a casa. Este repaso es un punto de partida.", "xt": "Para hacerlo más real", "x": "Que tu hijo le explique a un abuelo o a un tío por qué confía en la Biblia, con sus palabras y en un minuto. Si se traba, repasen juntos las semanas 16, 17 y 24, y prueben de nuevo.", "leer": "Salmo 119:89-96 · Lucas 1:1-4 · Isaías 53 · Juan 17:13-19"}, {"n": 27, "e": 3, "q": "¿Jesús existió de verdad?", "rep": false, "ch": "¿Viste que de tu bisabuelo sabés cosas porque alguien las contó y las escribió? Con Jesús pasa igual. Escribieron sobre Él sus amigos y también gente que no creía. Vivió en un lugar real, en un tiempo real, como vos y como yo.", "gr": "Hasta los historiadores que no creen aceptan que Jesús existió. Tácito, un romano nada amigo de los cristianos, escribió que lo ejecutaron bajo Pilato. Josefo, un judío, también lo nombra. Y los Evangelios se escribieron con testigos aún vivos. La pregunta es quién era.", "pi": [["Historiadores no cristianos como Tácito y Josefo escribieron sobre él", "Historia", "Tácito, un romano que miraba mal a los cristianos, cuenta en sus Anales que Cristo fue ejecutado bajo Pilato. Flavio Josefo, historiador judío, lo nombra en sus Antigüedades al hablar de Santiago, su hermano."], ["Cuatro libros cuentan su vida con lugares y personas reales", "Lucas 1:1-4", "Un cuento empieza con “había una vez”. Lucas dice que investigó todo con cuidado y da nombres que cualquiera podía chequear: Tiberio, Pilato, Herodes (Lucas 3:1)."], ["Hasta el calendario se cuenta desde su nacimiento", "Historia", "Esto solo no prueba que existió, pero muestra la huella que dejó. El cálculo se hizo siglos después y tiene un error de pocos años. Igual, medio mundo cuenta el tiempo desde ese nacimiento."]], "cita": "Gálatas 4:4", "vers": "Pero cuando vino el cumplimiento del tiempo, Dios envió a su Hijo, nacido de mujer y nacido bajo la ley,", "or": "Jesús, gracias por venir a este mundo de verdad, por mí. Amén.", "rq": [["¿Y si los Evangelios exageran porque eran sus amigos?", "Es lógico preguntarlo, y por eso sirven los de afuera: Tácito no tenía nada que ganar. Además, los Evangelios cuentan cosas que no los dejan bien parados. Lo vieron en la semana 15."], ["En internet dicen que a Josefo lo modificaron.", "En parte es cierto. Muchos especialistas creen que un copista le agregó frases a un pasaje sobre Jesús. La mención de Santiago casi nadie la discute. Admitirlo enseña a no exagerar."], ["¿Por qué no hay nada escrito por Él?", "De la gente común de esa época casi no quedan objetos ni escritos. Jesús dejó testigos, y ellos contaron lo que vieron (Hechos 4:20)."]], "seg": "¿Cómo le mostrarías a alguien que una persona de hace 2.000 años vivió de verdad?", "det": "Lo escuchó en un video o de un compañero: que Jesús es un personaje inventado, como un superhéroe. Lo dicen con mucha seguridad, y por eso asusta. Es una buena ocasión para mostrarle que esta pregunta se contesta con historia.", "evi": "“Yo sé que existió porque lo siento en mi corazón.” Es lindo, pero no contesta lo que te preguntó. Justo acá hay datos: usalos.", "xt": "Para hacerlo más real", "x": "Lean Lucas 3:1 y anoten cada nombre que aparece. Después busquen en internet “piedra de Pilato”: es una inscripción hallada en Cesarea en 1961. Tu hijo va a ver ese nombre grabado en piedra.", "leer": "Lucas 1:1-4 · Lucas 3:1-2 · Gálatas 4:4-5"}, {"n": 28, "e": 3, "q": "¿Jesús era solo un buen maestro?", "rep": false, "ch": "Jesús enseñaba cosas lindas, y además hacía algo que nadie más podía. Le perdonó los pecados a un hombre. Si me rompés algo, yo te puedo perdonar lo que me hiciste a mí. Jesús perdona lo que le hacemos a Dios, porque Él es Dios.", "gr": "Un buen maestro no dice que es uno con el Padre, ni perdona pecados, ni deja que le digan Dios. Si Jesús dijo eso y era mentira, no sería un buen maestro. Si se lo creía sin serlo, tampoco. Quedarse en el medio no cierra. O es quien dijo ser, o no fue tan buen maestro.", "pi": [["Jesús dijo que él y el Padre son uno", "Juan 10:30", "Apenas lo dijo, quisieron apedrearlo, y le explicaron por qué: “tú, siendo hombre, te haces Dios” (Juan 10:33). Los que lo escuchaban en vivo entendieron muy bien lo que estaba diciendo."], ["Perdonó pecados, algo que solo Dios puede hacer", "Marcos 2:5-7", "Si alguien te lastima, vos podés perdonarlo. Jesús le perdonó los pecados a un hombre que no le había hecho nada a Él. Los escribas pensaron enseguida: “¿Quién puede perdonar pecados, sino sólo Dios?”."], ["Aceptó que lo adoraran", "Juan 20:28", "Tomás le dijo “¡Señor mío, y Dios mío!” y Jesús no lo corrigió. En Mateo 14:33 los discípulos lo adoraron, y tampoco los frenó. Compará con Pedro: cuando Cornelio se arrodilló ante él, lo levantó enseguida, porque era un hombre (Hechos 10:25-26)."]], "cita": "Juan 10:30", "vers": "Yo y el Padre uno somos.", "or": "Jesús, tú eres Dios. Te adoro como Tomás: ¡Señor mío y Dios mío! Amén.", "rq": [["¿Jesús dijo alguna vez “soy Dios”?", "Con esas palabras, no. Pero dijo cosas que en su época significaban eso, y por eso tomaron piedras para tirarle: “antes que Abraham fuese, yo soy” (Juan 8:58-59)."], ["Si era Dios, ¿por qué oraba?", "Porque también era hombre, y vivía unido al Padre. Lo van a ver mejor en la semana 29. Podés decirle que vos tampoco lo entendés entero."], ["Otras religiones dicen que fue un profeta.", "Es cierto, y conviene decirlo con respeto. Un profeta habla de parte de Dios. Jesús hablaba y perdonaba como Dios. En la semana 36 retoman cómo charlar esto con quien piensa distinto."]], "seg": "¿Qué frase de Jesús te sorprende más? ¿Qué dirías si la escucharas en vivo?", "det": "Mucha gente que no cree habla bien de Jesús: buen hombre, gran maestro, ejemplo de amor. Suena respetuoso. La pregunta aparece cuando tu hijo nota que lo admiran pero no lo adoran. Ayudalo a mirar qué dijo Jesús de sí mismo.", "evi": "“Jesús fue la mejor persona que existió.” Suena bien, pero se queda corto: deja a tu hijo justo donde estaba, con un maestro admirable y nada más.", "xt": "Si se traba", "x": "Preguntale: “Si un compañero dijera ‘yo perdono tus pecados’, ¿dirías que es un gran maestro?”. Dejá que piense. Después miren juntos Marcos 2:5-7 y vean cómo reaccionaron los escribas.", "leer": "Marcos 2:1-12 · Juan 10:22-33 · Juan 20:24-29"}, {"n": 29, "e": 3, "q": "¿Cómo puede Jesús ser Dios y hombre?", "rep": false, "ch": "Jesús tenía hambre, se cansaba y lloraba, igual que vos. Y también calmó una tormenta con solo hablarle. Las dos cosas son verdad. Como fue hombre, sabe lo que sentís. Como es Dios, te puede ayudar. A mí también me cuesta entenderlo.", "gr": "Jesús no es mitad Dios y mitad hombre, ni un Dios disfrazado. Es Dios de verdad y hombre de verdad, las dos cosas completas. Cómo funciona eso por dentro, no lo sabemos, y ninguna comparación alcanza. Pero importa: un hombre murió por nosotros, y como es Dios, pudo salvarnos.", "pi": [["Dios se hizo persona", "Juan 1:14", "Juan 1:1 dice que el Verbo era Dios, y Juan 1:14 que se hizo carne. No dejó de ser Dios para hacerse hombre: fue las dos cosas. Por eso nos muestra cómo es Dios y entiende desde adentro lo que vivimos."], ["Tuvo hambre, se cansó y lloró como nosotros", "Juan 11:35", "Jesús lloró camino a la tumba de su amigo Lázaro. También tuvo hambre (Mateo 4:2) y se cansó de caminar (Juan 4:6). Su cuerpo y sus emociones eran de verdad."], ["Calmó una tormenta con su palabra", "Marcos 4:39", "Un rato antes dormía en la barca. Después dijo “Calla, enmudece” y el viento paró. Los discípulos se preguntaron quién era, que hasta el viento y el mar lo obedecían (Marcos 4:41)."]], "cita": "Juan 1:14", "vers": "Y aquel Verbo fue hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad.", "or": "Jesús, gracias porque me entiendes: viviste como yo y eres Dios. Amén.", "rq": [["Si era Dios, ¿cómo pudo morir?", "Murió de verdad, como hombre. La Biblia no explica todo lo que pasó ahí, y podés decir que no lo sabés. Sí afirma que el que murió por nosotros es el Hijo de Dios (Romanos 5:10)."], ["¿Cuando era bebé también era Dios?", "Sí. Lucas 2:40 dice que el niño crecía y se llenaba de sabiduría. Cómo era eso siendo bebé, la Biblia no lo detalla. Mejor decir “no sabemos” que inventar."], ["Si era Dios, ¿no le costaba portarse bien?", "Hebreos 4:15 dice que fue tentado en todo como nosotros, pero sin pecado. La tentación fue real. Por eso entiende cuando a tu hijo le cuesta."]], "seg": "¿Qué te gusta más saber: que Jesús te entiende o que Jesús te puede ayudar?", "det": "A esta edad les encanta la lógica, y esto no les cierra: o sos una cosa o sos otra. Es normal. Muestra que está pensando en serio quién es Jesús. No hace falta que le resuelvas el misterio. Alcanza con mostrarle lo que dice la Biblia.", "evi": "“Jesús es como un actor que se disfraza de hombre.” Esa comparación rompe la verdad: Jesús fue hombre de verdad. Mejor decir que ninguna alcanza.", "xt": "Para hacerlo más real", "x": "Hagan dos columnas en un papel: “Como nosotros” y “Como solo Dios”. Lean Marcos 4:35-41 y anoten. Jesús duerme en la barca y un momento después calma el mar. Las dos columnas hablan de la misma persona.", "leer": "Juan 1:1-14 · Marcos 4:35-41 · Juan 11:32-44 · Filipenses 2:5-8"}, {"n": 30, "e": 3, "q": "¿Qué es el pecado?", "rep": false, "ch": "Pecado es cuando hacemos lo que Dios dijo que no: mentir, pelear, lastimar a otro. A veces nadie se entera, pero Dios sí. A mí también me pasa. Lo lindo es que, si se lo contamos a Dios, nos perdona y nos sigue queriendo igual.", "gr": "Pecar es dejar a Dios afuera y hacer lo que yo quiero. Va más allá de las cosas feas que se ven: incluye el orgullo, la envidia, lo que pensás y nadie sabe. Todos lo hacemos, yo también. Ninguno puede arreglarlo solo, y por eso vino Jesús. A Dios se lo podés contar todo.", "pi": [["Es desobedecer a Dios", "1 Juan 3:4", "Juan lo dice simple: el pecado es infracción de la ley. Dios nos mostró cómo vivir y elegimos otra cosa. Incluye lo que hacemos y también lo que llevamos adentro: Jesús habló del enojo en Mateo 5:21-22."], ["Todos pecamos, no solo algunos", "Romanos 3:23", "Nadie queda afuera: ni tu hijo, ni vos, ni el pastor. “Destituidos de la gloria” significa que no llegamos a lo que Dios espera. Le va a hacer bien escucharte decir: “yo también le fallo a Dios”."], ["El pecado nos separa de Dios", "Isaías 59:2", "Isaías dice que nuestros pecados hacen división entre nosotros y Dios. Se parece a lo que pasa cuando le mentís a un amigo: algo se enfría. Y Dios mismo quiso arreglar esa distancia (Romanos 5:8)."]], "cita": "Romanos 3:23", "vers": "por cuanto todos pecaron, y están destituidos de la gloria de Dios,", "or": "Señor, perdóname por las veces que te desobedecí. Gracias porque me perdonas. Amén.", "rq": [["¿Hay pecados más grandes que otros?", "Algunos hacen más daño que otros: una mentira no es lo mismo que golpear a alguien. Pero todos nos alejan de Dios, y todos necesitamos el perdón de Jesús."], ["Yo soy chico. ¿Yo también peco?", "Los chicos también mienten, se enojan y quieren salirse con la suya. La Biblia dice que todos pecaron (Romanos 3:23). Decíselo sin dramatismo: Dios perdona también a los chicos."], ["Si vuelvo a hacerlo, ¿Dios se cansa de perdonarme?", "No. 1 Juan 1:9 promete que Dios es fiel para perdonar al que confiesa. Lo importante es volver a Él cada vez, y pedirle ayuda para cambiar."]], "seg": "¿Cómo te sentís por dentro cuando hacés algo que sabés que está mal?", "det": "Para un chico, pecado suele ser una lista de cosas prohibidas o una palabra que usan los grandes para retar. A esta edad empieza a notar que hace cosas que no quiere hacer, y siente culpa. Cuidá el tono: que entienda el problema sin sentir que Dios lo rechaza.", "evi": "“Si hacés eso, Diosito se va a poner triste con vos.” Usar a Dios para retar le enseña a esconderse de Él. Mostrale que puede correr hacia Dios cuando falla.", "xt": "Si se siente culpable", "x": "No le pidas que confiese delante tuyo. Si algo le pesa, puede contárselo a Dios en voz baja, o escribirlo en un papel y romperlo después de orar. Cerrá con 1 Juan 1:9: Dios perdona al que confiesa.", "leer": "Génesis 3 · Salmo 51 · Romanos 3:21-24 · 1 Juan 1:8-9"}, {"n": 31, "e": 3, "q": "¿Por qué Jesús tuvo que morir?", "rep": false, "ch": "Imaginate que rompés algo carísimo y no lo podés pagar. Y alguien que te quiere mucho te dice: yo lo pago por vos. Nosotros le fallamos a Dios y no podíamos arreglarlo. Jesús murió en la cruz para pagar eso, porque nos ama. Y después resucitó.", "gr": "Dios es justo, y el mal no puede quedar sin respuesta. También es amor, y no quiere perdernos. En la cruz se juntan las dos cosas: Jesús tomó lo que nos tocaba, para que pudiéramos estar cerca de Dios. El que pagó fue Dios mismo, hecho hombre. Nadie te amó tanto.", "pi": [["El pecado tiene un precio", "Romanos 6:23", "La paga del pecado es muerte: quedar separados de Dios. Un juez que deja pasar todo no es un buen juez, y Dios es justo. El mismo versículo termina con la buena noticia: la dádiva de Dios es vida eterna."], ["Jesús tomó mi lugar", "2 Corintios 5:21", "Jesús no tenía pecado y cargó con el nuestro. Pablo lo dice así: “Al que no conoció pecado, por nosotros lo hizo pecado”. Isaías 53:5 ya lo había anunciado. La deuda era nuestra y la pagó Él."], ["Lo hizo por amor", "Juan 15:13", "Jesús lo dijo antes de ir a la cruz: nadie tiene mayor amor que dar la vida por sus amigos. La cruz no fue un accidente. Jesús fue por amor, y el Padre nos amó al enviarlo (Juan 3:16)."]], "cita": "Juan 3:16", "vers": "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.", "or": "Jesús, gracias por morir en mi lugar. Nunca nadie me amó tanto. Amén.", "rq": [["¿Por qué Dios no perdonó y listo?", "Porque perdonar de verdad cuesta. Si alguien te rompe algo y lo perdonás, el daño lo pagás vos. Dios perdona así: Él mismo cargó con el costo, en Jesús."], ["¿Es justo que pague uno que no hizo nada?", "Sería injusto si lo obligaran. Pero Jesús lo eligió: “yo de mí mismo la pongo” (Juan 10:18). Y el que paga es Dios hecho hombre, no alguien de afuera."], ["¿Murió también por mí, que hago cosas mal?", "Sí. Romanos 5:8 dice que Cristo murió por nosotros “siendo aún pecadores”. No esperó a que nos portáramos bien."]], "seg": "¿Qué sentís cuando pensás que Jesús dio la vida por vos?", "det": "Si Dios puede todo, ¿por qué no perdonó y listo? Para un chico, que maten a alguien bueno es injusto, y hasta puede parecerle cruel. Detrás suele estar esta duda: ¿qué clase de Padre deja que pase eso? Tomala en serio.", "evi": "“Jesús murió por tu culpa.” Lo aplasta y lo aleja. Decile lo mismo desde el amor: “Jesús murió por vos”, y por mí también.", "xt": "Si le impresiona", "x": "La cruz impresiona, sobre todo a los más chicos. No hace falta entrar en detalles del dolor. Contale el porqué: Jesús lo hizo por amor. Y cerrá siempre con el final de la historia: al tercer día resucitó.", "leer": "Isaías 53 · Lucas 23:26-49 · Romanos 5:6-8 · Juan 15:12-13"}, {"n": 32, "e": 3, "q": "¿Jesús resucitó de verdad?", "rep": false, "ch": "Los amigos de Jesús estaban muertos de miedo. El domingo fueron a la tumba y estaba vacía. Después lo vieron vivo, comieron con Él, lo tocaron. Muchísima gente lo vio. Por eso dejaron de tener miedo y lo contaron por todos lados.", "gr": "Hay tres datos difíciles de explicar si no resucitó: la tumba vacía en la misma ciudad donde lo mataron, cientos de testigos que Pablo nombra cuando todavía se les podía preguntar, y unos amigos asustados que pasaron a jugarse la vida por contarlo. Nadie se deja matar por algo que sabe que inventó.", "pi": [["La tumba estaba vacía", "Lucas 24:2-3", "Jerusalén era la ciudad donde lo habían matado. Si el cuerpo seguía ahí, bastaba con mostrarlo para terminar con todo. Un detalle: las primeras testigos fueron mujeres, y en esa época su palabra valía poco en un juicio. Nadie que inventara la historia las habría elegido."], ["Más de 500 personas lo vieron vivo", "1 Corintios 15:6", "Pablo lo escribe cuando muchos de esos testigos todavía vivían, como diciendo: vayan y pregúntenles. Una persona puede imaginarse algo. Quinientas juntas, no."], ["Sus amigos pasaron de tener miedo a ser valientes", "Hechos 4:13", "Cuando lo arrestaron, huyeron (Mateo 26:56), y el domingo seguían encerrados por miedo (Juan 20:19). Pedro había negado conocerlo. Poco después predicaban frente a los que lo mataron, aunque les costara la cárcel. Algo muy grande tuvo que pasar en el medio."]], "cita": "Mateo 28:6", "vers": "No está aquí, pues ha resucitado, como dijo. Venid, ved el lugar donde fue puesto el Señor.", "or": "Jesús, ¡estás vivo! Gracias porque venciste a la muerte. Amén.", "rq": [["¿Y si robaron el cuerpo?", "La semana 33 está dedicada a eso. Había guardias y una piedra sellada (Mateo 27:65-66). Y los discípulos no habrían dado la vida por una mentira propia."], ["¿Y si no murió, y solo se desmayó?", "Lo crucificaron soldados romanos que sabían hacer su trabajo, y uno le atravesó el costado con una lanza (Juan 19:34). Nadie sale de ahí y convence a los demás de que venció a la muerte."], ["¿Y si se lo imaginaron?", "Una alucinación le pasa a una persona, no a quinientas al mismo tiempo. Además comió con ellos y se dejó tocar (Lucas 24:39-43)."]], "seg": "Si hubieras sido uno de los amigos de Jesús ese domingo, ¿qué habrías hecho?", "det": "Las historias que más les costó creer a los adultos son las que primero cuestionan los chicos. En internet van a encontrar que es un cuento. Lo importante es que vea que la fe cristiana no se apoya en un sentimiento: se apoya en algo que pasó, con testigos y con fecha. Pablo lo dice directo: si Cristo no resucitó, nuestra fe es vana (1 Corintios 15:14).", "evi": "“Eso se cree y no se discute.” Justo acá tenés datos. Mostrale que puede investigar sin miedo: la verdad aguanta las preguntas.", "xt": "Para hacerlo más real", "x": "Léanlo como detectives. Hagan una lista: quién estuvo, qué vio, qué día fue. Lucas dice que investigó todo con cuidado (Lucas 1:3), así que tu hijo está haciendo lo mismo que él.", "leer": "Lucas 24 · Juan 20 y 21 · 1 Corintios 15:1-20"}, {"n": 33, "e": 3, "q": "¿Y si robaron el cuerpo de Jesús?", "rep": false, "ch": "Había soldados cuidando la tumba y una piedra enorme con un sello. Los amigos de Jesús estaban escondidos de miedo. ¿Te los imaginás pasando a los guardias? Además, después Jesús comió con ellos. Un cuerpo robado no se sienta a comer pescado.", "gr": "Pensalo como un caso. Unos discípulos asustados tenían que pasar a los guardias. Y sostener la mentira aunque los mataran, como a Jacobo. Y eso no explica por qué tantos lo vieron vivo. Uno puede morir por algo falso que cree. Nadie muere por lo que sabe que inventó.", "pi": [["Había guardias y una piedra sellada", "Mateo 27:65-66", "Los jefes religiosos le pidieron a Pilato asegurar el sepulcro, justamente por miedo a un robo (Mateo 27:64). Sellaron la piedra y pusieron guardia. Los discípulos, mientras tanto, se encerraban por miedo (Juan 20:19)."], ["Nadie da la vida por una mentira que inventó", "Hechos 12:2", "Herodes mató a espada a Jacobo, uno de los doce. Mucha gente murió por algo falso creyendo que era cierto. Los apóstoles habrían sabido que era un invento, y aun así no se echaron atrás."], ["Jesús comió con ellos y se dejó tocar", "Lucas 24:39", "Un cuerpo robado no explica a Jesús diciendo “palpad, y ved”, ni comiendo pescado delante de ellos (Lucas 24:42-43). Los discípulos tampoco lo esperaban: al verlo, se asustaron (Lucas 24:37)."]], "cita": "Lucas 24:39", "vers": "Mirad mis manos y mis pies, que yo mismo soy; palpad, y ved; porque un espíritu no tiene carne ni huesos, como veis que yo tengo.", "or": "Señor, gracias por darnos tantas pruebas de que estás vivo. Amén.", "rq": [["¿Y si los guardias se durmieron?", "Eso fue lo que les pagaron para decir (Mateo 28:13). Si estaban dormidos, ¿cómo sabían quién se llevó el cuerpo? Sirve para aprender a mirar si una frase se sostiene."], ["¿Y si se lo llevaron los romanos o los jefes?", "Eran los que querían terminar con todo. Cuando Pedro empezó a predicar, les alcanzaba con mostrar el cuerpo. Pero los Hechos muestran otra cosa: lo mandaron a callar (Hechos 4:18)."], ["¿Todos los apóstoles murieron por esto?", "La muerte de Jacobo está en la Biblia. De los otros sabemos por tradiciones antiguas, menos seguras. Lo que sí está escrito es que los azotaron y siguieron predicando (Hechos 5:40-42)."]], "seg": "Si fueras detective, ¿qué le preguntarías a quien dice que robaron el cuerpo?", "det": "Esta explicación es viejísima: ya circulaba cuando se escribió Mateo (Mateo 28:15). Tu hijo la escucha como si fuera nueva. Y trae un dato a favor: los que la contaban no negaban que la tumba estuviera vacía.", "evi": "“Eso lo dicen los que odian a Dios.” No es cierto, y tu hijo se queda sin respuesta. Tomá la objeción en serio y mírenla juntos de cerca.", "xt": "Para hacerlo divertido", "x": "Jueguen al “caso del cuerpo robado”. Tu hijo es el detective: que pregunte quién lo robó, cómo pasó a los guardias y qué ganaba. Después lean Mateo 28:11-15, donde los soldados cobran por contar esa versión.", "leer": "Mateo 27:62-66 · Mateo 28:11-15 · Lucas 24:36-43 · Hechos 12:1-2"}, {"n": 34, "e": 3, "q": "¿Qué cambia que Jesús haya resucitado?", "rep": false, "ch": "Como Jesús está vivo, podés hablar con Él ahora, en tu cama o en la escuela. Te escucha y está con vos. Y cuando alguien que ama a Jesús se muere, ese no es el final, porque Jesús venció a la muerte. Un día vamos a estar con Él.", "gr": "Si Jesús resucitó, todo lo que dijo es cierto, y la muerte perdió. No te promete una vida sin problemas. Te promete que no vas solo, que alguien vivo ora por vos y que lo peor que pase no es lo último que va a pasar. Por eso Pablo dice que servir al Señor no es en vano.", "pi": [["Venció a la muerte", "1 Corintios 15:55", "Pablo casi se burla de la muerte: “¿Dónde está, oh muerte, tu aguijón?”. Seguimos muriendo, y duele. Pero la muerte perdió la última palabra: Jesús entró ahí y salió vivo."], ["Está vivo y me ayuda hoy", "Hebreos 7:25", "Dice que Jesús vive “siempre para interceder”. O sea, ahora mismo ora por los suyos delante del Padre. Tu hijo sigue a alguien vivo, que está de su lado."], ["Yo también voy a vivir para siempre con él", "Juan 11:25", "Se lo dijo Jesús a Marta, con su hermano recién enterrado: el que cree en Él, aunque esté muerto, vivirá. 1 Corintios 15:20 llama a Jesús “primicias”: el primero de muchos. La semana 50 sigue con este tema."]], "cita": "Juan 11:25", "vers": "Le dijo Jesús: Yo soy la resurrección y la vida; el que cree en mí, aunque esté muerto, vivirá.", "or": "Jesús, porque vives, no tengo que tenerle miedo a nada. Amén.", "rq": [["Si venció a la muerte, ¿por qué la gente se sigue muriendo?", "La victoria está ganada, y falta ver el final. 1 Corintios 15:26 dice que la muerte es el último enemigo que será destruido. Mientras tanto, duele, y podemos llorar."], ["¿Y si alguien que quiero murió sin creer?", "Decile que no sabemos qué pasó en su corazón, y que lo dejamos en manos de Dios, que es justo (Génesis 18:25). No nos toca juzgar. Abrazalo y dejá que te cuente."], ["Entonces, ¿por qué sigo teniendo miedo?", "Tener miedo no quiere decir que le falte fe. El salmista dice: “En el día que temo, yo en ti confío” (Salmo 56:3). Enseñale a contarle ese miedo a Jesús."]], "seg": "Si Jesús está vivo ahora, ¿qué te gustaría contarle hoy?", "det": "Después de varias semanas de datos, puede aparecer esta pregunta: ¿y a mí qué? Es muy sana. Tu hijo quiere saber si esto le sirve el lunes en la escuela, o cuando tiene miedo a la noche. Mostrale que la resurrección toca su vida.", "evi": "“No llores, ya está con Jesús.” La esperanza es real, pero tu hijo siente que su dolor no vale. Jesús lloró. Dejá que llore.", "xt": "Si se pone triste", "x": "Si hay un duelo cerca, no apures el consuelo. Jesús lloró camino a la tumba de Lázaro aunque sabía que iba a resucitarlo (Juan 11:35). Pueden llorar juntos, orar, y leer Juan 11:25 cuando tu hijo esté listo.", "leer": "Juan 11:17-44 · 1 Corintios 15:50-58 · Hebreos 7:23-25"}, {"n": 35, "e": 3, "q": "¿Me salvo portándome bien?", "rep": false, "ch": "¿Vos pagás por un regalo de cumpleaños? No, ¿no? Lo recibís y decís gracias. Con Dios es igual. El cielo no se gana portándose bien. Jesús ya hizo todo. Nosotros confiamos en Él, y nos portamos bien porque lo queremos.", "gr": "Si dependiera de portarte bien, nunca sabrías si hiciste suficiente. Dios la hizo regalo: Jesús pagó, y vos la recibís confiando en Él. Igual, no da lo mismo cómo vivís. Cuando alguien te ama así, querés vivir distinto. Lo bueno que hacés es la respuesta, nunca el pago.", "pi": [["La salvación es por gracia, no por lo que hago", "Efesios 2:8-9", "Pablo es clarísimo: “no por obras, para que nadie se gloríe”. Si pudiéramos ganárnosla, alguno se creería mejor que los demás. Gracia significa recibir lo que no merecemos."], ["Es un regalo", "Romanos 6:23", "Mirá cómo contrasta el versículo: el pecado paga un salario y Dios hace un regalo. “Dádiva” quiere decir eso. Un salario se gana. Un regalo se recibe."], ["Creo en mi corazón y lo digo con mi boca", "Romanos 10:9", "Creer en el corazón es confiar de verdad en que Jesús es el Señor y resucitó. Decirlo con la boca es reconocerlo. Las palabras exactas no funcionan como una fórmula: lo que importa es que sea de corazón."]], "cita": "Efesios 2:8", "vers": "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;", "or": "Gracias, Dios, por el regalo de la salvación. No lo gané, me lo diste. Amén.", "rq": [["Entonces, ¿puedo hacer lo que quiera?", "Romanos 6:1-2 responde: en ninguna manera. Quien recibe el regalo va cambiando. Efesios 2:10 dice que fuimos creados para buenas obras."], ["Pero Santiago dice que la fe sin obras está muerta.", "Sí, y no contradice a Pablo. Santiago habla de una fe que se nota en la vida (Santiago 2:17). Las obras no nos salvan, y la fe verdadera se ve en lo que hacemos."], ["Si me porto mal, ¿pierdo la salvación?", "Las iglesias evangélicas lo explican de formas distintas. Todas coinciden en esto: Dios no deja de amarte cuando fallás, y podés volver a Él (1 Juan 1:9). Para más, hablen con su pastor."]], "seg": "¿Qué cambiaría en tu día si supieras que Dios te ama aunque falles?", "det": "Casi todos los chicos creen esto sin decirlo: si me porto bien, Dios me quiere; si me porto mal, no. En la escuela todo se gana con nota, y los adultos a veces lo refuerzan sin querer. Esta semana le puede sacar un peso de encima.", "evi": "“Si te portás mal, Dios no te va a querer.” Es falso, y le enseña que el amor de Dios se gana. Corregí la conducta, y dejale claro que Dios lo sigue amando.", "xt": "Para hacerlo más real", "x": "Envolvé un regalo chiquito y dáselo. Cuando lo abra, preguntale: “¿Cuánto me vas a pagar?”. Seguro se ríe. Un regalo se recibe y se agradece. Después lean Efesios 2:8-10 y charlen qué hacemos por gratitud.", "leer": "Efesios 2:1-10 · Lucas 18:9-14 · Romanos 10:8-13 · Santiago 2:14-18"}, {"n": 36, "e": 3, "q": "¿Todos los caminos llevan a Dios?", "rep": false, "ch": "Muchas personas buscan a Dios de maneras distintas, y queremos tratarlas bien a todas. La Biblia dice que Jesús es el camino para llegar a Dios, porque Él murió y resucitó por nosotros. Por eso se lo contamos a los demás, con cariño.", "gr": "Entiendo que te suene duro. Si todos los caminos fueran iguales, Jesús no habría necesitado morir. Las religiones dicen cosas muy distintas sobre Dios, y no todas pueden ser ciertas a la vez. Yo creo lo que Jesús dijo, y a quien piensa distinto lo respeto y lo quiero igual.", "pi": [["Jesús dijo que él es el camino", "Juan 14:6", "Jesús no dijo que enseñaba un camino entre otros. Dijo “Yo soy el camino”. Se lo contestó a Tomás, que estaba confundido y le preguntó cómo llegar (Juan 14:5)."], ["No hay otro nombre que salve", "Hechos 4:12", "Pedro lo dijo frente a las mismas autoridades que habían condenado a Jesús, después de que un hombre fuera sanado en su nombre (Hechos 4:10). Tenía todo para callarse, y dijo esto."], ["Hay un solo mediador entre Dios y las personas", "1 Timoteo 2:5", "Un mediador une a dos partes. El pecado nos separó de Dios, y hacía falta alguien que nos uniera. El pasaje muestra el corazón de Dios: quiere que todos los hombres sean salvos (1 Timoteo 2:4)."]], "cita": "Juan 14:6", "vers": "Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí.", "or": "Jesús, gracias por ser el camino. Ayúdame a mostrarlo con amor. Amén.", "rq": [["¿Y la gente que nunca escuchó de Jesús?", "No tenemos todos los detalles. Sabemos que Dios es justo (Génesis 18:25) y que mira el corazón (1 Samuel 16:7). Esa pregunta la dejamos en sus manos, y a nosotros nos toca contar lo que sabemos."], ["Mi amigo es bueno. ¿Se va a ir al infierno?", "No juzgamos destinos: eso le toca a Dios. Decile que nadie llega por ser bueno, ni siquiera nosotros (semana 35). Lo que sí pueden hacer es orar por él y ser buenos amigos."], ["¿No es soberbia decir que tenemos razón?", "Sería soberbia si dijéramos que somos mejores. Decimos que todos necesitamos a Jesús, empezando por nosotros (Romanos 3:23). Y lo decimos como pide 1 Pedro 3:15: con mansedumbre."]], "seg": "¿Cómo podés tratar a tu amigo para que vea el amor de Jesús?", "det": "Tiene compañeros de otras religiones o de ninguna, y los quiere. En la escuela le enseñan a respetar, y está muy bien. Por eso le suena feo decir que Jesús es el único camino. No está perdiendo la fe: está pensando en personas concretas.", "evi": "“Los que no creen están perdidos y punto.” Dicho así, le enseña a mirar a los demás desde arriba. Jesús es el único camino, y eso se dice con amor.", "xt": "Si su amigo cree distinto", "x": "Recordale lo que ese amigo vale: Dios lo ama, y tu hijo puede ser un buen amigo. Que no discuta ni trate de convencerlo a la fuerza. Oren juntos por él, y si le pregunta, que le cuente lo que cree, con respeto.", "leer": "Juan 14:1-7 · Hechos 4:5-12 · Hechos 17:22-31 · 1 Pedro 3:15"}, {"n": 37, "e": 3, "q": "¿Qué es nacer de nuevo?", "rep": false, "ch": "Cuando naciste, empezó tu vida en este mundo. Cuando alguien confía en Jesús, empieza otra vida por dentro. Dios le da un corazón nuevo que quiere amarlo. No nacés otra vez de la panza de mamá: lo hace el Espíritu Santo adentro tuyo.", "gr": "Nacer de nuevo es empezar una vida con Dios que no podés fabricar. Jesús se lo dijo a Nicodemo, que era religioso y sabía un montón, y aun así lo necesitaba. Cuando confiás en Jesús, el Espíritu te cambia por dentro. No vas a ser perfecto, y Dios va a seguir obrando en vos.", "pi": [["Jesús se lo explicó a Nicodemo", "Juan 3:3", "Nicodemo era maestro de Israel y fue a ver a Jesús de noche. Jesús le dijo que para ver el reino de Dios hay que nacer de nuevo. Nicodemo lo entendió literal (Juan 3:4). Jesús hablaba de la obra del Espíritu (Juan 3:6)."], ["Soy una nueva persona en Cristo", "2 Corintios 5:17", "El versículo dice “nueva criatura”. Dios da una vida nueva, y eso va mucho más allá de un retoque. Tu hijo va a seguir equivocándose, pero tiene otra identidad, y va cambiando de a poco."], ["Dios me da un corazón nuevo", "Ezequiel 36:26", "Dios prometió quitar el corazón de piedra y dar uno de carne. Uno de piedra no siente nada por Dios. Uno de carne empieza a quererlo. Ese cambio lo hace Él."]], "cita": "2 Corintios 5:17", "vers": "De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas.", "or": "Señor, hazme nuevo cada día. Gracias por cambiar mi corazón. Amén.", "rq": [["¿Cómo sé si nací de nuevo?", "No hay un examen. Preguntale si confía en Jesús y si quiere seguirlo. Cuando Dios obra, de a poco se nota, por ejemplo en el amor a los demás (1 Juan 3:14)."], ["¿Tengo que sentir algo especial?", "No. A algunos les pasa con mucha emoción y a otros muy tranquilos. Jesús lo comparó con el viento: no se ve, y se notan sus efectos (Juan 3:8)."], ["¿Bautizarse es nacer de nuevo?", "Las iglesias evangélicas entienden el bautismo de formas distintas, y conviene hablarlo con tu pastor. Todas coinciden en que la vida nueva viene de Dios y se recibe por la fe en Jesús."]], "seg": "¿Qué te gustaría que Dios cambie en tu corazón?", "det": "Seguro lo escuchó en la iglesia y no le dijo nada, o le dio risa: ¿cómo va a nacer otra vez? A Nicodemo, un maestro que sabía mucho, le pasó lo mismo. Tu hijo está tratando de entender algo que Dios hace por dentro.", "evi": "“Vos ya estás bien porque te criaste en la iglesia.” Crecer en una familia cristiana es un regalo, pero la fe de los papás no reemplaza la suya.", "xt": "Si no sabe cuándo pasó", "x": "Muchos chicos que crecieron en la iglesia no recuerdan un día exacto. No te preocupes por eso. Lo que importa es que hoy confíe en Jesús. Si quiere hablarlo con más calma, pueden charlar con su pastor.", "leer": "Juan 3:1-16 · 2 Corintios 5:14-17 · Ezequiel 36:25-27"}, {"n": 38, "e": 3, "q": "¿Jesús va a volver?", "rep": false, "ch": "Jesús prometió que va a volver, y Él siempre cumple. Nadie sabe cuándo, y no hace falta saberlo. Es como cuando esperás a alguien que querés mucho: no es para tener miedo. Mientras tanto, lo amamos y ayudamos a los demás.", "gr": "Jesús lo prometió, y la Biblia lo repite muchas veces. Hay cristianos que piensan distinto sobre el orden de todo, pero esperamos lo mismo: que vuelve y que va a arreglar lo que está roto. Nadie sabe la fecha, así que desconfiá de quien diga que la sabe.", "pi": [["Jesús lo prometió", "Juan 14:3", "Se lo prometió a sus discípulos la noche antes de morir, cuando estaban angustiados. Por eso esta promesa es para consolar. Lo que Jesús quiere es que estemos donde Él está."], ["Los ángeles lo dijeron", "Hechos 1:11", "Mientras los discípulos miraban al cielo, dos mensajeros vestidos de blanco (Hechos 1:10) les dijeron que “este mismo Jesús” iba a volver. Es el mismo que conocieron y que los amó."], ["Tenemos que estar listos", "Mateo 24:42", "“Velad” significa estar atentos. No hace falta vivir con miedo ni sacar cuentas de fechas, porque Jesús dice que no sabemos el día. Estar listo es confiar en Él y vivir hoy como quien lo espera con ganas."]], "cita": "Juan 14:3", "vers": "Y si me fuere y os preparare lugar, vendré otra vez, y os tomaré a mí mismo, para que donde yo estoy, vosotros también estéis.", "or": "Jesús, te espero con alegría. Ayúdame a vivir listo para tu regreso. Amén.", "rq": [["¿Cuándo va a ser?", "Nadie lo sabe. Jesús dijo que ni el día ni la hora (Mateo 24:36). Si alguien anuncia una fecha, ya sabés que no lo puede saber."], ["¿Qué es el arrebatamiento?", "Las iglesias lo explican de maneras distintas, y hay creyentes serios en cada postura. Todas esperan el regreso de Jesús. Si quiere saber más, pregúntenle a su pastor."], ["¿Y si vuelve y yo no estoy listo?", "Estar listo es confiar en Jesús, y eso se puede hacer hoy. Nadie llega perfecto: nos salva su gracia (semana 35). Si tiene miedo, oren juntos y hablen de lo que le preocupa."]], "seg": "¿Qué es lo que más te gustaría decirle a Jesús cuando lo veas?", "det": "Puede venir de una película, de un video sobre el fin del mundo o de algo que escuchó en la iglesia. A algunos chicos les da miedo y otros lo toman como una aventura. Preguntale primero qué escuchó y qué siente.", "evi": "“Portate bien porque Jesús puede volver en cualquier momento.” Convierte una esperanza en una amenaza, y le enseña a tenerle miedo a Jesús.", "xt": "Si se asusta", "x": "Algunos chicos se asustan con videos sobre el fin del mundo. Preguntale qué vio, escuchalo y sacale de adelante lo que le dé miedo. Recordale quién vuelve: el Jesús que lo ama. Lean juntos Juan 14:1.", "leer": "Juan 14:1-6 · Hechos 1:6-11 · Mateo 24:36-44 · Tito 2:11-14"}, {"n": 39, "e": 3, "q": "¿Quién es Jesús para mí?", "rep": true, "ch": "Jesús es Dios, y se hizo persona para estar cerca de nosotros. Murió en la cruz por vos porque te ama. Y resucitó, así que está vivo y te escucha. ¿Y vos? ¿Qué te gustaría decirle? Me lo podés contar a mí, o decírselo a Él.", "gr": "Ya viste lo que dice la Biblia: Jesús es Dios hecho hombre, murió en tu lugar y resucitó. Ahora la pregunta es tuya, como se la hizo a Pedro. Yo te puedo contar quién es para mí, pero no puedo contestar por vos. Tomate tu tiempo. Me podés decir lo que pensás, sin miedo.", "pi": [["Es Dios hecho hombre (semana 29)", "Juan 1:14", "De la semana 29: “aquel Verbo fue hecho carne”. Jesús es Dios que vino a estar cerca, y un hombre que nos entiende. Preguntale a tu hijo qué significa para él que Dios haya querido vivir como nosotros."], ["Murió en mi lugar (semana 31)", "Juan 3:16", "De la semana 31: Jesús tomó nuestro lugar (2 Corintios 5:21), porque Dios amó tanto al mundo que dio a su Hijo. Invitalo a poner su nombre donde dice “mundo”. Así la cruz se vuelve personal. Dejá que salga de él, sin presión."], ["Resucitó y está vivo (semana 32)", "Mateo 28:6", "Como vimos en la semana 32, la tumba estaba vacía. Mateo 28:6 lo dice así: “No está aquí, pues ha resucitado”. Jesús está vivo hoy, y tu hijo puede hablar con Él. Preguntale qué le diría si pudiera verlo ahora."]], "cita": "Mateo 16:16", "vers": "Respondiendo Simón Pedro, dijo: Tú eres el Cristo, el Hijo del Dios viviente.", "or": "Jesús, tú eres mi Señor y mi Salvador. Quiero seguirte siempre. Amén.", "rq": [["Todavía no sé qué contestar.", "Está perfecto. Decile que no hay apuro y que seguir preguntando también es buscar a Dios. Pueden orar juntos: “Creo; ayuda mi incredulidad” (Marcos 9:24)."], ["Quiero seguir a Jesús. ¿Qué hago?", "Alegrate con él y oren juntos, con palabras simples: que le diga a Jesús que cree en Él y quiere seguirlo (Romanos 10:9). Después pueden charlarlo con su pastor."], ["Y vos, ¿quién decís que es Jesús?", "Contestale con tus palabras y con sinceridad, aunque sean dos frases. No hace falta que suene perfecto. Le va a servir verte creer de verdad."]], "seg": "Si tuvieras que contarle a un amigo quién es Jesús para vos, ¿qué le dirías?", "det": "Hasta acá, tu hijo aprendió muchas cosas sobre Jesús. Esta pregunta dice “para mí”. Jesús les hizo lo mismo a sus discípulos: “Y vosotros, ¿quién decís que soy yo?” (Mateo 16:15). Escuchalo sin apurarlo, sea cual sea su respuesta.", "evi": "“Decí que Jesús es tu Salvador y quedate tranquilo.” Una respuesta por presión no es fe. Tiene que ser suya, y Dios sabe esperar.", "xt": "Para armar su respuesta", "x": "Dale una hoja y pedile que complete: “Para mí, Jesús es…”. Usen las semanas 29, 31 y 32 como ayuda. No corrijas lo que escriba, salvo que te lo pida. Guárdenla para volver a leerla dentro de un año.", "leer": "Mateo 16:13-20 · Juan 1:1-14 · Juan 3:16-17 · Mateo 28:1-10"}, {"n": 40, "e": 4, "q": "Si Dios ya sabe todo, ¿para qué orar?", "rep": false, "ch": "Cuando volvés de la escuela, a veces ya sé cómo te fue. Igual quiero que me lo cuentes, porque te quiero y me gusta charlar con vos. Con Dios pasa parecido. Él ya sabe todo, y le encanta que le hables.", "gr": "Dios no necesita que le avises nada. Orar es parte de tener una relación con Él. Jesús, que era el Hijo, oraba todo el tiempo. Además, cuando le contás lo que te pasa, soltás lo que cargás y dejás de pelearla solo. Y la Biblia nos invita a pedir de verdad.", "pi": [["Orar es hablar con mi Padre", "Mateo 6:8-9", "Un hijo le cuenta cosas a su papá aunque él ya sepa cómo le fue. Jesús dice que el Padre conoce lo que nos hace falta, y justo después enseña el Padre Nuestro. La oración es una charla de familia."], ["Jesús también oraba", "Marcos 1:35", "Una madrugada se levantó cuando todavía estaba oscuro y se fue a un lugar tranquilo a orar. Lo hacía seguido (Lucas 5:16). Era el Hijo de Dios y conocía al Padre como nadie, y aun así buscaba ese tiempo con Él."], ["La oración me da paz", "Filipenses 4:6-7", "Pablo pide que le contemos a Dios lo que nos preocupa, y promete una paz que no se puede explicar. El versículo no dice que todo va a salir como queremos. Dice que esa paz cuida el corazón."]], "cita": "Filipenses 4:6", "vers": "Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.", "or": "Padre, gracias porque puedo hablar contigo cuando quiera. Amén.", "rq": [["¿Mi oración cambia algo?", "Dios nos invita a pedir de verdad: Santiago 4:2 dice “no tenéis lo que deseáis, porque no pedís”. Cómo encaja eso con que Él ya sabe todo, no lo entendemos del todo."], ["No sé qué decir cuando oro.", "Le pasa a todos. Que le diga lo que le diría a alguien que lo quiere. Romanos 8:26 dice que no sabemos pedir como conviene y que el Espíritu nos ayuda."], ["Oro y no siento nada.", "Es normal, y no significa que Dios no esté. La oración no se mide por lo que sentimos. Si además pidió algo y no pasó, eso lo ven en la semana 44."]], "seg": "Si pudieras contarle a Dios una sola cosa de hoy, ¿cuál sería?", "det": "Aprendió que Dios lo sabe todo y sacó una conclusión lógica: entonces, ¿para qué contarle? Es un chico pensando, y está bien. A veces también esconde otra cosa: oró y no sintió nada. Preguntale cómo le resulta orar a él.", "evi": "“Orá porque hay que orar.” Le suena a tarea, y lo que buscás es que le hable a Dios porque quiere, como se le habla a un papá.", "xt": "Para hacerlo más real", "x": "Elijan una noche de esta semana y oren cinco minutos juntos, sin libreto. Uno cuenta cómo le fue y el otro le agradece a Dios por algo. Si no le sale, orá vos en voz alta, con tus palabras de todos los días.", "leer": "Mateo 6:5-13 · Marcos 1:35-39 · Filipenses 4:4-7"}, {"n": 41, "e": 4, "q": "¿Por qué ir a la iglesia si puedo creer en casa?", "rep": false, "ch": "Mirá el asado: si sacás una brasa y la dejás sola, al rato se apaga. Si está con las otras, sigue prendida. Con la fe pasa parecido. Juntos nos ayudamos a seguir. Y vos también ayudás a otros.", "gr": "Podés creer en casa, y Dios te escucha ahí también. Ir a la iglesia no te salva. Pero la Biblia no conoce un creyente aislado. Necesitás gente que ore por vos y te diga la verdad cuando te equivocás. Y ellos te necesitan a vos. La iglesia tiene fallas, igual que nosotros.", "pi": [["Dios nos pide reunirnos", "Hebreos 10:25", "El versículo dice que algunos tenían la costumbre de dejar de reunirse, y nos pide no hacer lo mismo. El motivo está ahí mismo: cuando estamos juntos nos animamos unos a otros."], ["Somos un cuerpo: cada uno tiene su lugar", "1 Corintios 12:27", "Una mano sola no sirve de mucho, y al cuerpo le falta algo sin ella. Pablo usa esa imagen para la iglesia. Tu hijo también tiene un lugar: lo que él trae, otros lo necesitan, aunque tenga diez años."], ["La primera iglesia se reunía, oraba y compartía", "Hechos 2:42", "Aprendían juntos, comían juntos y oraban juntos. Se conocían y se cuidaban. Eso es lo que una iglesia busca ser, con todas las fallas que pueda tener."]], "cita": "Hebreos 10:25", "vers": "no dejando de congregarnos, como algunos tienen por costumbre, sino exhortándonos; y tanto más, cuanto veis que aquel día se acerca.", "or": "Señor, gracias por mi iglesia. Ayúdame a ser parte y a ayudar a otros. Amén.", "rq": [["Si no voy, ¿dejo de ser cristiano?", "No. Somos salvos por gracia, y la asistencia no compra nada (semana 35). Dios nos pide reunirnos porque sabe lo que nos hace bien, y solo es más fácil enfriarse."], ["En la iglesia hay gente que no es buena.", "Es cierto, y duele. La iglesia está hecha de personas que todavía están aprendiendo. Si alguien ahí lo lastimó o lo hizo sentir mal, tomalo en serio y hablalo con él."], ["Me aburro.", "A veces pasa, y decirlo no está mal. Busquen algo para hacer: ayudar, tocar un instrumento, servir con los más chicos. Cuesta menos cuando uno tiene un lugar."]], "seg": "¿Qué podrías hacer vos para que alguien se sienta bien en la iglesia?", "det": "Muchas veces viene de otro lado: se aburre, no tiene amigos ahí o se siente distinto. Preguntale qué le pasa antes de explicarle nada. Y es cierto que puede creer en casa, así que no se lo niegues.", "evi": "“Mientras vivas en esta casa, vas a la iglesia.” Puede que vaya, pero aprende que la fe es una regla de sus papás. Escuchalo antes de decidir.", "xt": "Si no quiere ir", "x": "No arranques peleando. Preguntale qué le cuesta: la música, el horario, que no tiene amigos. Después busquen juntos un lugar donde pueda ayudar o alguien con quien sentarse. Si algo malo le pasó ahí, escuchalo primero.", "leer": "Hechos 2:42-47 · 1 Corintios 12:12-27 · Hebreos 10:23-25"}, {"n": 42, "e": 4, "q": "¿Quién es el Espíritu Santo?", "rep": false, "ch": "El Espíritu Santo es Dios. No lo vemos, pero está con los que creen en Jesús. Ayuda a entender la Biblia, consuela cuando estamos tristes y da fuerzas para hacer lo que está bien. Jesús prometió que no nos iba a dejar solos.", "gr": "No es una energía ni una fuerza. Es Dios, una persona que enseña y se entristece. Jesús lo prometió para que no quedáramos solos. Vive en los que creen y los va cambiando de a poco. Cómo es que Dios es uno y son tres no lo entendemos del todo, y ninguna comparación alcanza.", "pi": [["Es Dios, no una fuerza", "Hechos 5:3-4", "Pedro le dice a Ananías que le mintió al Espíritu Santo, y enseguida aclara que le mintió a Dios. A una fuerza no se le miente. Además, la Biblia dice que enseña y se entristece (Juan 14:26, Efesios 4:30)."], ["Jesús prometió enviarlo", "Juan 14:16", "Antes de irse, Jesús les dijo a sus amigos que el Padre les iba a dar otro Consolador, alguien que está al lado para ayudar. Esa promesa se cumplió en Pentecostés (Hechos 2)."], ["Produce cosas buenas en mí", "Gálatas 5:22-23", "Amor, gozo, paz, paciencia. Pablo los llama fruto, y un fruto crece de a poco. Cuando alguien que cree logra perdonar o frenarse antes de pegar, ahí se ve la obra del Espíritu, aunque no pase nada raro."]], "cita": "Gálatas 5:22-23", "vers": "Mas el fruto del Espíritu es amor, gozo, paz, paciencia, benignidad, bondad, fe, mansedumbre, templanza; contra tales cosas no hay ley.", "or": "Espíritu Santo, llena mi vida de tu fruto. Amén.", "rq": [["¿Es un fantasma?", "No. Es Dios, y no hay nada que temerle. Que sea espíritu significa que no tiene un cuerpo como el nuestro. Jesús lo llamó Consolador, alguien que ayuda."], ["¿Yo lo tengo?", "La Biblia dice que el Espíritu vive en los que son de Cristo (Romanos 8:9), y eso no depende de sentir algo. Si tu hijo todavía no decidió seguir a Jesús, es una linda charla para tener."], ["¿Por qué en unas iglesias hablan en lenguas y en otras no?", "Las iglesias evangélicas difieren en cómo obran hoy algunos dones. Todas comparten que el Espíritu es Dios y que su fruto se nota en el amor. Preguntá cómo lo entienden en tu iglesia."]], "seg": "¿En qué momento de esta semana necesitarías más la ayuda de Dios?", "det": "A muchos chicos esta les cuesta más que hablar del Padre o de Jesús. A Jesús lo conocen por las historias, pero el Espíritu no tiene cara. Por eso lo piensan como una energía o un fantasma. Y si a vos también te cuesta explicarlo, está bien.", "evi": "“Es como el agua, el hielo y el vapor.” Esa comparación termina enseñando algo que la Biblia no dice. Mejor decile que ninguna comparación alcanza.", "xt": "Para esta semana", "x": "Lean juntos Gálatas 5:22-23 y elijan una de esas cosas para pedirle a Dios esta semana. El domingo cuenten dónde la vieron. Si le cuesta la palabra “templanza”, explicale que significa saber frenarse.", "leer": "Juan 14:15-26 · Hechos 2:1-21 · Gálatas 5:16-25"}, {"n": 43, "e": 4, "q": "¿Qué hago cuando tengo dudas?", "rep": false, "ch": "Todos tenemos preguntas, yo también. Dios no se enoja por eso. Tomás tuvo dudas y Jesús fue a buscarlo. Cuando algo no te cierre, contámelo y lo vemos juntos. Y se lo podés decir a Dios: creo, pero ayudame a creer más.", "gr": "Dudar no te hace mal cristiano. Preguntarte cosas es parte de hacer tuya la fe. Lo que no te ayuda es guardártelas. Contámelas, aunque pienses que no me van a gustar. Buscamos juntos, y si no encontramos todo, le preguntamos a alguien que sepa. No te voy a retar por pensar.", "pi": [["Jesús recibió a Tomás con sus dudas", "Juan 20:27", "Tomás dijo que no iba a creer sin tocar las heridas. Jesús no lo echó: volvió, le mostró las manos y lo invitó a creer. Y Tomás terminó diciendo “¡Señor mío, y Dios mío!”."], ["Puedo pedirle a Dios que me ayude a creer", "Marcos 9:24", "Un papá desesperado le dijo a Jesús que creía y que necesitaba ayuda para creer. Jesús no le exigió una fe perfecta: sanó a su hijo. Esa oración corta sirve para cualquier día."], ["Buscar respuestas en la Biblia está bien", "Hechos 17:11", "Los de Berea escucharon a Pablo y después revisaron las Escrituras para ver si era así. La Biblia los elogia por eso. Tu hijo puede hacer lo mismo con lo que le dicen, incluso con lo que le decís vos."]], "cita": "Marcos 9:24", "vers": "E inmediatamente el padre del muchacho clamó y dijo: Creo; ayuda mi incredulidad.", "or": "Señor, creo en ti. Cuando dude, ayúdame a buscarte más. Amén.", "rq": [["¿Dudar es pecado?", "Judas 22 dice: “A algunos que dudan, convencedlos”. Y Jesús recibió a Tomás sin echarlo. Lo que importa es qué hacemos con la duda: llevarla a Dios en lugar de esconderla."], ["¿Y si no encontramos la respuesta?", "Puede pasar. Hay cosas que Dios no nos explicó (Deuteronomio 29:29). No saber todo no significa que la fe sea falsa. Puede confiar en lo que está claro mientras sigue buscando."], ["¿Y si ya no creo?", "Respirá y no lo retes. Preguntale qué lo llevó a pensar eso y seguí orando por él. Si te supera, pedile ayuda a tu pastor. La puerta de tu casa sigue abierta."]], "seg": "¿Qué pregunta le harías a Dios si lo tuvieras enfrente?", "det": "Si tu hijo te dice que duda, es una buena noticia: te lo está contando a vos. A esta edad empieza a pensar por su cuenta, y eso incluye lo que le enseñaste. Lo que más lo ayuda es tu cara cuando te lo dice. Si ve que no te asustás, va a volver a preguntar.", "evi": "“No digas eso, con Dios no se duda.” Calla la pregunta y deja la duda intacta. Va a seguir dudando, pero solo y sin contártelo.", "xt": "Si se traba", "x": "Armen una caja de preguntas. Cada duda va escrita en un papel, sin reto y sin apuro. Una vez por semana sacan una y la buscan juntos en la Biblia. Si ninguno de los dos sabe, se la llevan a alguien de la iglesia.", "leer": "Juan 20:24-29 · Marcos 9:14-29 · Hechos 17:10-12"}, {"n": 44, "e": 4, "q": "¿Por qué Dios no me da lo que le pido?", "rep": false, "ch": "Cuando le pedís algo, Dios te escucha siempre. A veces dice que sí, a veces que no, a veces esperá. Yo no siempre sé por qué. Lo que sé es que te ama y que no hiciste nada mal. Si te da bronca o tristeza, decíselo. Él no se va a ir.", "gr": "Dios te escuchó. Que no haya pasado lo que pediste no significa que no te ame, ni que te faltó fe, ni que hiciste algo mal. No sé por qué respondió así, y no te voy a inventar una razón. Pablo pidió tres veces. Jesús oró con angustia. Podés decirle a Dios lo que sentís.", "pi": [["A veces Dios dice que sí, a veces que no, a veces espera", "2 Corintios 12:8-9", "Pablo le pidió tres veces a Dios que le sacara algo que lo hacía sufrir, y Dios no se lo sacó. Le respondió “bástate mi gracia”. Un no de Dios puede venir acompañado de su cercanía, y no es falta de fe."], ["Sus planes son más altos que los míos", "Isaías 55:8-9", "Dios ve lo que nosotros no vemos. Este versículo no le pide a tu hijo que le guste la respuesta. Le dice que hay cosas que hoy no va a entender, y que puede confiar en quién es Dios."], ["Jesús oró: que se haga lo que tú quieres", "Mateo 26:39", "Jesús le pidió al Padre, con angustia, que pasara esa copa. Después agregó: “no sea como yo quiero, sino como tú”. El Hijo de Dios también oró con dolor. Y el Padre, después de la cruz, lo resucitó."]], "cita": "Isaías 55:9", "vers": "Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos, y mis pensamientos más que vuestros pensamientos.", "or": "Padre, confío en ti aunque no entienda tus respuestas. Amén.", "rq": [["¿No oré con suficiente fe?", "No. Pablo tenía mucha fe y Dios no le dio lo que pedía (2 Corintios 12:9). Un no de Dios no es un castigo ni una nota de fe. Sacale esa culpa de encima."], ["¿Entonces para qué pido?", "Porque Dios quiere que le contemos todo (Filipenses 4:6), y muchas veces responde que sí. Pedirle es confiar en Él, también cuando la respuesta duele. Lo vieron en la semana 40."], ["Le pedí que se curara y se murió.", "Eso duele muchísimo, y ninguna frase lo arregla. Decile que no fue su culpa y que puede contarle a Dios lo enojado que está. Jesús lloró (Juan 11:35). La semana 50 habla de la muerte."]], "seg": "¿Qué le pediste a Dios que todavía te cuesta entender?", "det": "Puede ser una bici o puede ser que el abuelo se cure. Antes de contestar, preguntale qué pidió. Si detrás hay un dolor, primero abrazalo. Muchos chicos concluyen que Dios no los quiere o que hicieron algo mal. Eso es lo primero que hay que desarmar.", "evi": "“Seguro no tuviste suficiente fe.” Es falso y le carga una culpa que la Biblia no le pone. Tampoco le prometas que Dios da todo lo que se le pide con fe.", "xt": "Si se pone triste", "x": "Si pidió por algo grande, como un abuelo enfermo, primero acompañalo. No hace falta explicar nada hoy. Oren juntos, con sus palabras, aunque esté enojado. Si la tristeza sigue, buscá a tu pastor o a un profesional.", "leer": "2 Corintios 12:7-10 · Mateo 26:36-46 · Salmo 13"}, {"n": 45, "e": 4, "q": "¿Cómo perdono a alguien que me lastimó?", "rep": false, "ch": "Perdonar significa que no le vas a devolver lo malo. Le contás a Dios cuánto te dolió y le pedís ayuda. Eso no quiere decir que estuvo bien. Y si alguien te lastima, te toca o te da miedo, contámelo siempre. Eso nunca se guarda en secreto.", "gr": "Lo que te hicieron estuvo mal, y perdonar no cambia eso. Perdonar es decidir no vivir atado a la venganza, y a veces lleva tiempo. Podés perdonar y poner distancia. Y si alguien te lastima de verdad, avisar a un adulto está bien. Nadie puede pedirte que lo guardes en secreto.", "pi": [["Perdono porque Dios me perdonó a mí", "Efesios 4:32", "Perdonar casi nunca arranca con ganas. Arranca acordándonos de cuánto nos perdonó Dios en Cristo. Por eso no hace falta sentirlo para empezar: se le puede pedir ayuda a Él, y los sentimientos llegan después."], ["No hay un límite para perdonar", "Mateo 18:21-22", "Pedro preguntó si alcanzaba con siete veces, y Jesús le dijo setenta veces siete. Quiso decir que no llevemos la cuenta. Esto no le pide a nadie que siga soportando daño: perdonar y aguantar un abuso son cosas distintas."], ["Perdonar no es decir que estuvo bien: le dejo la justicia a Dios", "Romanos 12:19", "Dejarle la justicia a Dios significa no vengarse. Nunca significa callarse. Dios también puso autoridades para frenar al que hace el mal (Romanos 13:4). Contar y denunciar un daño no contradice el perdón."]], "cita": "Efesios 4:32", "vers": "Antes sed benignos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo.", "or": "Señor, ayúdame a perdonar como tú me perdonaste. Amén.", "rq": [["¿Tengo que seguir siendo su amigo?", "No siempre. Perdonar y confiar son cosas distintas. La confianza se reconstruye si se puede, y a veces hay que tomar distancia. Si esa persona lastima, nadie debe obligarlo a estar cerca."], ["Me pidió que no le cuente a nadie.", "Decile que hizo bien en contarte y que no es su culpa. Un secreto que lastima no se guarda, aunque sea de alguien de la familia o de la iglesia. Creele y pedí ayuda profesional ya."], ["Perdoné y me sigue doliendo.", "Es normal. A veces hay que volver a decidirlo muchas veces. Que duela no significa que no perdonó. Si el dolor no afloja, tu pastor o un profesional pueden ayudarlos."]], "seg": "¿Hay algo que te hicieron y que todavía te duele?", "det": "Antes de hablar de perdón, preguntale qué pasó. No es lo mismo un amigo que le dijo algo feo que alguien que le hace daño. Perdonar nunca significa callar un abuso ni quedarse cerca de quien lastima. Primero están él y su seguridad.", "evi": "“Perdoná y no se habla más.” Si hubo daño, le enseña a callar y lo deja sin protección. Lo primero es escucharlo y cuidarlo.", "xt": "Si hay algo grave", "x": "Si en la charla aparece un abuso, un golpe o alguien que lo toca o lo amenaza, frená todo. Creele, decile que no es su culpa y protegelo. Buscá ayuda profesional y hacé la denuncia. Nada de pedirle que perdone ahora.", "leer": "Efesios 4:25-32 · Mateo 18:21-35 · Romanos 12:17-21"}, {"n": 46, "e": 4, "q": "¿Qué hago cuando se burlan de mi fe?", "rep": false, "ch": "Si alguien se ríe porque creés en Jesús, no hiciste nada mal. A Jesús también se le rieron. No hace falta pelear ni insultar. Podés decir tranquilo que creés y seguir con lo tuyo. Y si te molestan seguido o te hacen sentir mal, contámelo. Te voy a ayudar.", "gr": "Que se burlen duele, y no te voy a decir que no importa. Podés contestar tranquilo y ofrecer contar por qué creés, o podés no contestar. Las dos cosas están bien. Lo que no quiero es que te lo banques solo. Si se repite o te lastiman, avisame y lo enfrentamos juntos.", "pi": [["No tengo que avergonzarme", "Romanos 1:16", "Pablo sabía que a muchos el mensaje de la cruz les parecía una locura (1 Corintios 1:18), y aun así no se escondía. Si un día tu hijo se quedó callado, no lo retes: a Pedro le pasó, y Jesús lo levantó."], ["Jesús avisó que algunos no lo aceptarían", "Juan 15:18", "Jesús dijo que a Él lo rechazaron primero. Si se ríen de tu hijo por creer, no está raro ni solo. Eso alivia bastante, porque le saca la idea de que algo anda mal en él."], ["Respondo con amor, no con enojo", "Mateo 5:44", "Jesús manda amar y orar por quien nos trata mal, sin devolver el insulto. Esto no le pide a tu hijo que se deje pisar. Amar también incluye poner un límite y contarle a un adulto lo que pasa."]], "cita": "Romanos 1:16", "vers": "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego.", "or": "Jesús, dame valentía y un corazón amable cuando se burlen. Amén.", "rq": [["¿Y si me dicen que soy tonto por creer?", "Lo que cree tiene razones, y este año vieron varias. No necesita ganar la discusión. Una respuesta corta y tranquila alcanza, y si el otro pregunta de verdad, ahí se charla (1 Pedro 3:15)."], ["¿Tengo que dejar que me peguen?", "No. Jesús nunca le pide a un chico que soporte que lo lastimen. Si le pegan, lo amenazan o lo persiguen, tiene que avisarte, y vos hablás con la escuela. Contarlo está bien."], ["¿Y si me quedé callado?", "Le pasó a Pedro, y Jesús lo perdonó y lo volvió a llamar (Juan 21:15-17). Haberse callado una vez no borra lo que cree. La próxima puede decir algo corto, si le sale."]], "seg": "¿Qué te gustaría poder contestar la próxima vez que te digan algo?", "det": "Que se rían de lo que cree duele mucho a esta edad, cuando lo que más quieren es encajar. Primero preguntale qué le dijeron, quién fue y cómo se sintió. Puede ser un chiste de una vez o algo de todos los días. No es lo mismo.", "evi": "“Ignoralos y ya se van a cansar.” Si es bullying, eso lo deja solo. Tampoco le digas “aguantá por Jesús”: ningún chico debe soportar que lo lastimen.", "xt": "Si se repite", "x": "Una burla aislada se puede manejar. Si se repite, si lo excluyen, lo amenazan, lo empujan o lo humillan en redes, es bullying, y ahí interviene un adulto. Hablá con la escuela, guardá las capturas y no lo dejes solo.", "leer": "Romanos 1:16-17 · Juan 15:18-21 · Mateo 5:43-48 · 1 Pedro 3:13-17"}, {"n": 47, "e": 4, "q": "¿Cómo elijo bien a mis amigos?", "rep": false, "ch": "Un buen amigo te cuida, te dice la verdad y no te pide que hagas cosas feas. Con todos podés ser bueno, pero a tus amigos más cercanos elegilos bien, porque las cosas se contagian. Y vos también podés ser ese amigo bueno para alguien que está solo.", "gr": "Mirá cómo te sentís después de estar con esa persona. ¿Sos más vos, o te hacés otro para caerle bien? Un amigo de verdad no te pide que le mientas a tus papás ni que te burles de otro. Podés ser amable con todos y elegir con cuidado a quién le das tu confianza.", "pi": [["Me parezco a mis amigos", "Proverbios 13:20", "Proverbios lo dice simple: el que anda con sabios se vuelve sabio. La gente con la que pasamos tiempo nos contagia palabras, gustos y modos de tratar a otros. Vale para lo bueno y para lo malo."], ["Las malas compañías cambian mis costumbres", "1 Corintios 15:33", "Pablo avisa: “las malas conversaciones corrompen las buenas costumbres”. Si tu hijo empieza a hablar o a burlarse como un grupo, capaz sea momento de charlarlo con calma, sin retar."], ["Puedo ser amable con todos y ser luz", "Mateo 5:14", "Jesús nos llama luz del mundo, y la luz alumbra a todos. Tu hijo puede ser amable con el compañero que nadie elige o con el que no cree. Tratar bien a todos es una cosa, y hacerlo su mejor amigo es otra."]], "cita": "Proverbios 13:20", "vers": "El que anda con sabios, sabio será; Mas el que se junta con necios será quebrantado.", "or": "Señor, dame buenos amigos y ayúdame a ser un buen amigo. Amén.", "rq": [["¿No puedo ser amigo de alguien que no cree?", "Claro que puede. Jesús comía con gente que otros rechazaban (Marcos 2:16-17). Lo que importa es quién influye en quién, y que sus amigos más cercanos lo ayuden a seguir a Dios."], ["Mis amigos me dejaron afuera.", "Duele mucho, y primero hay que escucharlo. A Dios le importa el que está solo (Salmo 68:6). Busquen a alguien más, en la escuela o en la iglesia. Si es seguido, mirá la semana 46."], ["Mi amigo me pide que haga algo que está mal.", "Se puede decir que no sin pelear. Si insiste, no es tan amigo. Si le pide algo peligroso o un secreto que le da miedo, que te lo cuente enseguida. Prometele que no lo vas a retar."]], "seg": "¿Quién es un buen amigo para vos y qué lo hace bueno?", "det": "A esta edad los amigos empiezan a pesar más que la opinión de los papás, y eso es esperable. Capaz quedó afuera de un grupo, o lo ves andar con alguien que te preocupa. Preguntale a quién tiene cerca y cómo se siente con ellos. Si criticás a sus amigos, se cierra.", "evi": "“Ese chico no me gusta, no te juntes más con él.” Lo más probable es que lo defienda y lo vea a escondidas. Mejor preguntale qué le gusta de esa amistad.", "xt": "Para conocerlos mejor", "x": "Invitá a sus amigos a casa. Les das de comer, los escuchás y los vas a conocer mejor que con mil preguntas. Tu hijo ve que te importan, y vos sabés con quién anda. Sin interrogatorios.", "leer": "Proverbios 13:20 · 1 Samuel 18:1-4 · Marcos 2:13-17"}, {"n": 48, "e": 4, "q": "¿Qué dice la Biblia de las pantallas y lo que miro?", "rep": false, "ch": "Lo que mirás se te queda en la cabeza, igual que lo que comés se queda en la panza. Por eso elegimos cosas buenas. Si aparece algo feo o raro, o te escribe alguien que no conocés, venís y me contás. No te voy a retar. Estamos juntos en esto.", "gr": "No te voy a sacar el celular por las dudas, y yo también estoy aprendiendo a usar el mío. Probemos esto: después de mirar algo, ¿cómo quedás? Si viste algo que te incomodó, o alguien te pide fotos o secretos, contámelo. No vas a estar en problemas. Te voy a ayudar.", "pi": [["Pienso en lo bueno y lo puro", "Filipenses 4:8", "Pablo no arma una lista de prohibidos. Dice en qué conviene pensar: lo verdadero, lo justo, lo puro. Sirve como filtro simple para un video: ¿esto me deja mejor o peor de lo que estaba?"], ["Cuido lo que pongo delante de mis ojos", "Salmo 101:3", "David decidió qué poner delante de sus ojos, porque lo que vemos se nos queda adentro. Si tu hijo vio algo feo sin buscarlo, no hizo nada malo. Puede cerrarlo y contártelo, y vos lo recibís sin retarlo."], ["Uso bien mi tiempo", "Efesios 5:15-16", "Pablo pide
