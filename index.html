aprovechar bien el tiempo. Eso no prohíbe descansar ni jugar. Ayuda a preguntarse qué quedó afuera hoy: dormir, moverse, la familia, Dios. Un rato de pantalla no es pecado."]], "cita": "Filipenses 4:8", "vers": "Por lo demás, hermanos, todo lo que es verdadero, todo lo honesto, todo lo justo, todo lo puro, todo lo amable, todo lo que es de buen nombre; si hay virtud alguna, si algo digno de alabanza, en esto pensad.", "or": "Señor, cuida mis ojos y mi mente. Ayúdame a elegir bien. Amén.", "rq": [["¿Jugar o ver videos es pecado?", "No. El descanso y los juegos son parte de la vida. Lo que conviene mirar es qué contenido es y cuánto lugar ocupa. Si le saca el sueño o lo pone de mal humor, charlenlo."], ["Vi algo que no tenía que ver.", "Agradecele que te lo cuente y no lo retes. A esta edad es fácil cruzarse con eso sin querer. Si hizo algo mal, Dios perdona (1 Juan 1:9). Bloqueen eso juntos y seguí abierto a hablar."], ["¿Por qué vos sí podés estar con el celular?", "Buena pregunta, y tiene razón. Reconocé que a vos también te cuesta, sin culpa. Pónganse una regla que valga para los dos, como dejar los celulares fuera de la mesa."]], "seg": "¿Qué cosa de lo que mirás te deja mejor, y cuál te deja peor?", "det": "Seguro llegás a esta charla con culpa: que mira mucho, que vos también, que no das abasto. Las pantallas son parte de su vida y nadie las maneja perfecto. La idea es charlar, sin sermón y sin culpa, qué le hace bien y qué no.", "evi": "“Esa pantalla te está arruinando.” Se siente atacado, se esconde y deja de contarte qué ve. Y a vos te deja peleando, con culpa por no poder con todo.", "xt": "Para ponerse de acuerdo", "x": "Armen las reglas juntos, así las siente propias. ¿Dónde no entra el celular? ¿A qué hora se apaga? Que valgan también para vos: la mesa sin pantallas, por ejemplo. Dejalas escritas en la heladera.", "leer": "Filipenses 4:8-9 · Salmo 101 · Efesios 5:15-20"}, {"n": 49, "e": 4, "q": "¿Para qué me hizo Dios?", "rep": false, "ch": "Dios te hizo a propósito. Te pensó con tu forma de ser y con lo que te sale bien. Te hizo para que lo conozcas, lo ames y ames a los demás. Eso lo podés hacer hoy, en la escuela y en casa.", "gr": "No sé qué vas a estudiar ni de qué vas a trabajar, y vos no necesitás saberlo ahora. Lo importante ya está dicho: amar a Dios y amar a los demás. Eso vale si sos médico, mecánico o lo que sea. Tu valor no depende de lo que logres. Dios ya te ama.", "pi": [["Dios me hizo con un propósito", "Efesios 2:10", "Somos hechura suya, dice Pablo, creados para hacer cosas buenas que Dios ya preparó. Lo dice justo después de explicar que la salvación es un regalo (2:8-9). Primero nos ama, y después hacemos el bien."], ["Dios tiene planes buenos para mí", "Jeremías 29:11", "Dios se lo dijo a su pueblo desterrado en Babilonia, y el regreso tardó setenta años (29:10). Por eso no promete éxito ni una vida sin problemas. Muestra su corazón: quiere el bien de los suyos, también en lo difícil."], ["Amar a Dios y amar a los demás", "Mateo 22:37-39", "Cuando le preguntaron por el mandamiento más importante, Jesús resumió todo en dos: amar a Dios y amar al prójimo. Ese propósito vale para cualquier trabajo y cualquier edad. Se puede vivir hoy en el recreo."]], "cita": "Efesios 2:10", "vers": "Porque somos hechura suya, creados en Cristo Jesús para buenas obras, las cuales Dios preparó de antemano para que anduviésemos en ellas.", "or": "Dios, muéstrame lo que preparaste para mí. Quiero servirte. Amén.", "rq": [["¿Y si no soy bueno en nada?", "Dios no reparte valor según talentos. Contale lo que vos ves en él, con ejemplos concretos. Ser amable con el que está solo también es una de las buenas obras de Efesios 2:10."], ["¿Dios ya eligió de qué voy a trabajar?", "La Biblia no da ese detalle. Sí dice que podemos pedirle sabiduría (Santiago 1:5). Puede orar, mirar lo que le gusta, escuchar consejos y confiar en que Dios lo acompaña."], ["Si me va mal, ¿se arruinó el plan de Dios?", "No. José pasó años de esclavo y preso, y Dios sacó bien de todo eso (Génesis 50:20). Un error o un fracaso no lo deja afuera de lo que Dios quiere hacer en él."]], "seg": "¿Qué te gusta hacer por otros, y cómo podrías hacerlo esta semana?", "det": "A esta edad empiezan a preguntarse para qué son buenos y si valen algo. Se comparan, miran redes, ven a otros que destacan. Detrás de esta pregunta puede haber una inseguridad. Antes de hablar del futuro, decile lo que ves en él y lo que vale para vos y para Dios.", "evi": "“Si te lo proponés, podés lograr todo lo que quieras.” Suena lindo, pero le pone todo el peso encima y deja a Dios afuera. Si falla, va a sentir que es su culpa.", "xt": "Para hacerlo divertido", "x": "Escriban entre todos qué hace bien cada uno de la familia. Cosas chicas: hace reír, escucha, ordena, se acuerda del que está solo. Después piensen a quién podría ayudar eso esta semana.", "leer": "Efesios 2:1-10 · Jeremías 29:1-14 · Mateo 22:34-40"}, {"n": 50, "e": 4, "q": "¿Qué pasa cuando morimos?", "rep": false, "ch": "Cuando alguien muere, su cuerpo deja de funcionar y no vuelve a esta vida. Jesús prometió que los que creen en Él van a estar con Él, donde no hay dolor ni llanto. Nos da tristeza, y está bien llorar. Lo que no sabemos, se lo dejamos a Dios, que es bueno.", "gr": "La muerte es real y duele, y la Biblia no la esconde. Pero Jesús resucitó, y por eso para los que creen en Él la muerte no tiene la última palabra. Pablo dice que partir es estar con Cristo. No sé todos los detalles. Sé en quién confío, y un día Dios va a secar toda lágrima.", "pi": [["Jesús nos prepara un lugar", "Juan 14:2", "Jesús se lo dijo a sus amigos la noche antes de morir, cuando estaban asustados. No les dio un plano del lugar. Les prometió que Él mismo lo prepara y que los va a llevar con Él."], ["Los que creen van a estar con Cristo", "Filipenses 1:23", "Pablo, preso, dice que partir y estar con Cristo es “muchísimo mejor”. No conocemos todos los detalles. Lo que la Biblia afirma es que los que creen están con Él, y eso consuela mucho a una familia."], ["En el cielo no habrá más llanto", "Apocalipsis 21:4", "Juan ve el final de la historia: Dios enjuga cada lágrima y la muerte se termina. Hasta ese día lloramos, y está bien: Jesús lloró camino a la tumba de su amigo (Juan 11:35). Llorar no es falta de fe."]], "cita": "Apocalipsis 21:4", "vers": "Enjugará Dios toda lágrima de los ojos de ellos; y ya no habrá muerte, ni habrá más llanto, ni clamor, ni dolor; porque las primeras cosas pasaron.", "or": "Señor, gracias porque con Jesús la muerte no es el final. Amén.", "rq": [["El abuelo no creía. ¿Dónde está?", "No lo sabemos, y no nos toca decirlo. Nadie ve lo que pasa en un corazón hasta el final. Lo dejamos en manos de Dios, que es justo (Génesis 18:25). Puede llorarlo y agradecer por él."], ["¿Vos te vas a morir?", "Algún día sí, como todos, y nadie sabe cuándo. Decile que hoy estás acá, que lo cuidás y que siempre va a tener quien lo cuide. Puede hablar de esto todas las veces que quiera."], ["¿Cómo es el cielo?", "La Biblia cuenta poco y promete mucho: Jesús está ahí y no hay dolor. Sobre los detalles, decí “no sabemos”. Con las mascotas igual: la Biblia no lo dice, y Dios es bueno."]], "seg": "¿Qué te gustaría preguntarle a Jesús sobre el cielo?", "det": "Casi siempre viene de algo concreto: murió un abuelo, una mascota, un compañero, o vio una noticia. A veces lo que hay debajo es miedo a que te mueras vos. Preguntale qué lo hizo pensar en esto. Si hay un duelo, primero abrazalo. No hace falta responder todo.", "evi": "“Si no creía, seguro no está en el cielo.” Nadie conoce ese corazón como Dios, y a tu hijo le parte el alma. Dejalo en manos de Dios.", "xt": "Si está de duelo", "x": "Dejalo llorar, y llorá vos también. Puede volver a preguntar lo mismo muchas veces. Si no mejora, o dice que quiere morirse o irse con quien falleció, no lo dejes pasar: buscá hoy ayuda de un profesional y de tu pastor.", "leer": "Juan 11:17-44 · Juan 14:1-6 · Filipenses 1:21-24 · Apocalipsis 21:1-5"}, {"n": 51, "e": 4, "q": "¿Cómo le hablo de Jesús a un amigo?", "rep": false, "ch": "Hablar de Jesús es como contarle a un amigo algo bueno que te pasó. Podés decirle lo que Dios hizo por vos, invitarlo a la iglesia o preguntarle si quiere que ores por él. No hace falta saber todo. Y si te dice que no, seguís siendo su amigo.", "gr": "Empezá por ser buen amigo y escuchar. Cuando surja, contá lo que Jesús es para vos, con tus palabras. No necesitás ganar ninguna discusión ni convencerlo: eso lo hace Dios. Si te pregunta algo que no sabés, decile que lo vas a averiguar. Este año ya viste bastante para contar.", "pi": [["Somos testigos de Jesús", "Hechos 1:8", "Un testigo cuenta lo que vio, nada más. Jesús prometió que el Espíritu Santo nos da la fuerza para hacerlo. Por eso tu hijo no va solo, y no hace falta que sea experto en nada."], ["Puedo contar lo que Dios hizo en mi vida", "Marcos 5:19", "Jesús liberó a un hombre atormentado y lo mandó a su casa a contar lo que Dios había hecho con él. Tu hijo puede contar algo simple: una oración que lo ayudó, una paz que sintió, algo que aprendió este año."], ["Hablo con gracia y respeto", "Colosenses 4:6", "Pablo pide hablar con gracia. Sin retar a nadie y sin hacerlo sentir mal. Tu hijo puede decir que Jesús es el único camino y tratar con respeto a quien piensa distinto. Escuchar también es parte."]], "cita": "Marcos 5:19", "vers": "Mas Jesús no se lo permitió, sino que le dijo: Vete a tu casa, a los tuyos, y cuéntales cuán grandes cosas el Señor ha hecho contigo, y cómo ha tenido misericordia de ti.", "or": "Jesús, pon en mi corazón a un amigo para contarle de ti. Amén.", "rq": [["¿Y si se ríe de mí?", "Puede pasar, y duele. Lo vieron en la semana 46: se responde con amor y sin cambiar la manera de tratarlo. Si la burla sigue y lo lastima, que te avise."], ["¿Y si me pregunta algo que no sé?", "“No sé, lo voy a averiguar” es una respuesta perfecta. Después búsquenlo juntos en el cuaderno. Hasta le da una excusa para seguir la charla."], ["¿Y si es de otra religión?", "Que lo respete y le pregunte qué cree. Puede contar por qué él cree en Jesús, sin hablar mal de lo que cree el otro. La semana 36 trata esto con más calma."]], "seg": "¿En qué amigo pensás, y qué te gustaría contarle de Jesús?", "det": "Puede ser que tenga ganas y no sepa cómo, o que le dé vergüenza. También puede sentir presión, como si de él dependiera que su amigo crea. Preguntale en quién está pensando y qué le da miedo. A veces necesita oír que puede empezar de a poco.", "evi": "“Si no le hablás de Jesús, tu amigo se va a perder por tu culpa.” Es una carga que Dios no le pone a un chico. El que salva es Él.", "xt": "Para practicar", "x": "Ensayen en casa. Vos hacés de amigo y le preguntás por qué va a la iglesia. Que conteste con sus palabras, en dos o tres frases. Después cambien de lugar. Se van a reír un rato, y eso también ayuda.", "leer": "Marcos 5:1-20 · Hechos 1:6-9 · Colosenses 4:2-6"}, {"n": 52, "e": 4, "q": "¿Por qué creo?", "rep": true, "ch": "Mirá cuánto aprendiste este año. Dios hizo todo lo que ves. La Biblia nos cuenta quién es, y se puede confiar en ella. Y Jesús murió por nosotros, resucitó y está vivo. Ahora contámelo vos, con tus palabras. Me encanta escucharte.", "gr": "Creer no es apagar el cerebro. Viste que hay razones: el mundo apunta a un Creador, la Biblia se sostiene y la resurrección tiene testigos. Y detrás de esas razones hay una persona. Pablo dice “yo sé a quién he creído”. Las dudas pueden volver. Jesús no se va a ir.", "pi": [["Dios existe (semana 1)", "Hebreos 3:4", "Volvé a la casa y su constructor: el orden del mundo apunta a alguien que lo pensó. Preguntale qué se acuerda de la semana 1 y qué le sumó la semana 4. Que lo diga en una frase, como le salga."], ["Puedo confiar en la Biblia (semana 26)", "Juan 17:17", "En la semana 26 juntaron tres razones: el texto se cuidó (16), habla de hechos reales (17) y las profecías se cumplieron (24). Dejá que elija la que más lo convenció. Con una que pueda explicar alcanza."], ["Jesús resucitó y está vivo (semana 32)", "Mateo 28:6", "Es el centro de todo. Repasen los datos de la semana 32: la tumba vacía, los testigos y los amigos que pasaron del miedo al valor. Si Jesús está vivo, todo lo que dijo pesa distinto."]], "cita": "2 Timoteo 1:12", "vers": "Por lo cual asimismo padezco esto; pero no me avergüenzo, porque yo sé a quién he creído, y estoy seguro que es poderoso para guardar mi depósito para aquel día.", "or": "Señor, gracias por este año. Ya sé por qué creo, y quiero seguir conociéndote. Amén.", "rq": [["¿Y si el año que viene vuelvo a dudar?", "Puede pasar, y tiene dónde volver: el cuaderno, la Biblia y vos. La semana 43 sirve para eso. Las preguntas no lo alejan de Dios, y Él sigue ahí cuando dudamos."], ["No me acuerdo de todo.", "No hace falta. Con una o dos razones que pueda explicar alcanza. Repasen juntos lo que más le gustó. El cuaderno queda para volver cuando lo necesite."], ["¿Saber todo esto me hace cristiano?", "No. Las respuestas ayudan, pero uno se salva por gracia, confiando en Jesús (Efesios 2:8-9, semana 35). Si quiere dar ese paso, acompañalo a orar o busquen juntos a tu pastor."]], "seg": "¿Qué fue lo que más te ayudó a creer este año?", "det": "Llegaron al final del año. Olvidate del examen: aprovechá para escuchar cómo lo dice tu hijo, con sus palabras, aunque le falten datos. Puede que todavía tenga dudas, y está bien. Lo que importa es que sepa que puede hablar de esto con vos.", "evi": "“¿Viste? Ya sabés todo, ahora no vas a dudar más.” No se lo podés prometer, y si duda va a creer que falló. Decile que puede volver a preguntar.", "xt": "Para cerrar el año", "x": "Que lea en voz alta lo que escribió en el cuaderno. Escuchalo sin corregir. Después escribile una notita con algo que viste crecer en él este año y guárdenla juntos. Si pueden, festejen con algo rico.", "leer": "2 Timoteo 1:8-14 · 1 Pedro 3:15 · Juan 20:30-31"}], "refs": {"Hebreos 3:4": [[4, "Porque toda casa es hecha por alguno; pero el que hizo todas las cosas es Dios."]], "Salmo 19:1": [[1, "Los cielos cuentan la gloria de Dios, Y el firmamento anuncia la obra de sus manos."]], "Romanos 1:20": [[20, "Porque las cosas invisibles de él, su eterno poder y deidad, se hacen claramente visibles desde la creación del mundo, siendo entendidas por medio de las cosas hechas, de modo que no tienen excusa."]], "Romanos 2:15": [[15, "mostrando la obra de la ley escrita en sus corazones, dando testimonio su conciencia, y acusándoles o defendiéndoles sus razonamientos,"]], "Hechos 17:27": [[27, "para que busquen a Dios, si en alguna manera, palpando, puedan hallarle, aunque ciertamente no está lejos de cada uno de nosotros."]], "Éxodo 3:13-15": [[13, "Dijo Moisés a Dios: He aquí que llego yo a los hijos de Israel, y les digo: El Dios de vuestros padres me ha enviado a vosotros. Si ellos me preguntaren: ¿Cuál es su nombre?, ¿qué les responderé?"], [14, "Y respondió Dios a Moisés: YO SOY EL QUE SOY. Y dijo: Así dirás a los hijos de Israel: YO SOY me envió a vosotros."], [15, "Además dijo Dios a Moisés: Así dirás a los hijos de Israel: Jehová, el Dios de vuestros padres, el Dios de Abraham, Dios de Isaac y Dios de Jacob, me ha enviado a vosotros. Este es mi nombre para siempre; con él se me recordará por todos los siglos."]], "Juan 1:1-3": [[1, "En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios."], [2, "Este era en el principio con Dios."], [3, "Todas las cosas por él fueron hechas, y sin él nada de lo que ha sido hecho, fue hecho."]], "Salmo 90:2": [[2, "Antes que naciesen los montes Y formases la tierra y el mundo, Desde el siglo y hasta el siglo, tú eres Dios."]], "Éxodo 3:14": [[14, "Y respondió Dios a Moisés: YO SOY EL QUE SOY. Y dijo: Así dirás a los hijos de Israel: YO SOY me envió a vosotros."]], "Génesis 1:1": [[1, "En el principio creó Dios los cielos y la tierra."]], "Apocalipsis 1:8": [[8, "Yo soy el Alfa y la Omega, principio y fin, dice el Señor, el que es y que era y que ha de venir, el Todopoderoso."]], "Isaías 55:9": [[9, "Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos, y mis pensamientos más que vuestros pensamientos."]], "Juan 17:24": [[24, "Padre, aquellos que me has dado, quiero que donde yo estoy, también ellos estén conmigo, para que vean mi gloria que me has dado; porque me has amado desde antes de la fundación del mundo."]], "Juan 1:18": [[18, "A Dios nadie le vio jamás; el unigénito Hijo, que está en el seno del Padre, él le ha dado a conocer."]], "Juan 3:8": [[8, "El viento sopla de donde quiere, y oyes su sonido; mas ni sabes de dónde viene, ni a dónde va; así es todo aquel que es nacido del Espíritu."]], "Juan 14:9": [[9, "Jesús le dijo: ¿Tanto tiempo hace que estoy con vosotros, y no me has conocido, Felipe? El que me ha visto a mí, ha visto al Padre; ¿cómo, pues, dices tú: Muéstranos el Padre?"]], "Juan 20:29": [[29, "Jesús le dijo: Porque me has visto, Tomás, creíste; bienaventurados los que no vieron, y creyeron."]], "1 Corintios 13:12": [[12, "Ahora vemos por espejo, oscuramente; mas entonces veremos cara a cara. Ahora conozco en parte; pero entonces conoceré como fui conocido."]], "Colosenses 1:15-17": [[15, "El es la imagen del Dios invisible, el primogénito de toda creación."], [16, "Porque en él fueron creadas todas las cosas, las que hay en los cielos y las que hay en la tierra, visibles e invisibles; sean tronos, sean dominios, sean principados, sean potestades; todo fue creado por medio de él y para él."], [17, "Y él es antes de todas las cosas, y todas las cosas en él subsisten;"]], "Génesis 1:3": [[3, "Y dijo Dios: Sea la luz; y fue la luz."]], "Salmo 33:6": [[6, "Por la palabra de Jehová fueron hechos los cielos, Y todo el ejército de ellos por el aliento de su boca."]], "Colosenses 1:17": [[17, "Y él es antes de todas las cosas, y todas las cosas en él subsisten;"]], "Isaías 40:26": [[26, "Levantad en alto vuestros ojos, y mirad quién creó estas cosas; él saca y cuenta su ejército; a todas llama por sus nombres; ninguna faltará; tal es la grandeza de su fuerza, y el poder de su dominio."]], "Génesis 2:7": [[7, "Entonces Jehová Dios formó al hombre del polvo de la tierra, y sopló en su nariz aliento de vida, y fue el hombre un ser viviente."]], "Génesis 1:27": [[27, "Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó."]], "Salmo 139:14": [[14, "Te alabaré; porque formidables, maravillosas son tus obras; Estoy maravillado, Y mi alma lo sabe muy bien."]], "Salmo 8:4-5": [[4, "Digo: ¿Qué es el hombre, para que tengas de él memoria, Y el hijo del hombre, para que lo visites?"], [5, "Le has hecho poco menor que los ángeles, Y lo coronaste de gloria y de honra."]], "Proverbios 12:10": [[10, "El justo cuida de la vida de su bestia; Mas el corazón de los impíos es cruel."]], "Mateo 6:26": [[26, "Mirad las aves del cielo, que no siembran, ni siegan, ni recogen en graneros; y vuestro Padre celestial las alimenta. ¿No valéis vosotros mucho más que ellas?"]], "Santiago 3:9": [[9, "Con ella bendecimos al Dios y Padre, y con ella maldecimos a los hombres, que están hechos a la semejanza de Dios."]], "Proverbios 25:2": [[2, "Gloria de Dios es encubrir un asunto; Pero honra del rey es escudriñarlo."]], "Romanos 1:19-20": [[19, "porque lo que de Dios se conoce les es manifiesto, pues Dios se lo manifestó."], [20, "Porque las cosas invisibles de él, su eterno poder y deidad, se hacen claramente visibles desde la creación del mundo, siendo entendidas por medio de las cosas hechas, de modo que no tienen excusa."]], "Salmo 111:2": [[2, "Grandes son las obras de Jehová, Buscadas de todos los que las quieren."]], "2 Timoteo 3:15": [[15, "y que desde la niñez has sabido las Sagradas Escrituras, las cuales te pueden hacer sabio para la salvación por la fe que es en Cristo Jesús."]], "Romanos 8:28": [[28, "Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados."]], "Romanos 5:12": [[12, "Por tanto, como el pecado entró en el mundo por un hombre, y por el pecado la muerte, así la muerte pasó a todos los hombres, por cuanto todos pecaron."]], "Juan 9:3": [[3, "Respondió Jesús: No es que pecó éste, ni sus padres, sino para que las obras de Dios se manifiesten en él."]], "Santiago 1:13": [[13, "Cuando alguno es tentado, no diga que es tentado de parte de Dios; porque Dios no puede ser tentado por el mal, ni él tienta a nadie;"]], "Apocalipsis 21:4": [[4, "Enjugará Dios toda lágrima de los ojos de ellos; y ya no habrá muerte, ni habrá más llanto, ni clamor, ni dolor; porque las primeras cosas pasaron."]], "Mateo 26:39": [[39, "Yendo un poco adelante, se postró sobre su rostro, orando y diciendo: Padre mío, si es posible, pase de mí esta copa; pero no sea como yo quiero, sino como tú."]], "1 Juan 4:8": [[8, "El que no ama, no ha conocido a Dios; porque Dios es amor."]], "Isaías 6:3": [[3, "Y el uno al otro daba voces, diciendo: Santo, santo, santo, Jehová de los ejércitos; toda la tierra está llena de su gloria."]], "Lamentaciones 3:22-23": [[22, "Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias."], [23, "Nuevas son cada mañana; grande es tu fidelidad."]], "Salmo 103:8": [[8, "Misericordioso y clemente es Jehová; Lento para la ira, y grande en misericordia."]], "Juan 4:24": [[24, "Dios es Espíritu; y los que le adoran, en espíritu y en verdad es necesario que adoren."]], "Mateo 3:16-17": [[16, "Y Jesús, después que fue bautizado, subió luego del agua; y he aquí cielos le fueron abiertos, y vio al Espíritu de Dios que descendía como paloma, y venía sobre él."], [17, "Y hubo una voz de los cielos, que decía: Este es mi Hijo amado, en quien tengo complacencia."]], "2 Corintios 13:14": [[14, "La gracia del Señor Jesucristo, el amor de Dios, y la comunión del Espíritu Santo sean con todos vosotros. Amén."]], "Deuteronomio 6:4": [[4, "Oye, Israel: Jehová nuestro Dios, Jehová uno es."]], "Mateo 28:19": [[19, "Por tanto, id, y haced discípulos a todas las naciones, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo;"]], "Mateo 10:29-31": [[29, "¿No se venden dos pajarillos por un cuarto? Con todo, ni uno de ellos cae a tierra sin vuestro Padre."], [30, "Pues aun vuestros cabellos están todos contados."], [31, "Así que, no temáis; más valéis vosotros que muchos pajarillos."]], "Jeremías 23:23-24": [[23, "¿Soy yo Dios de cerca solamente, dice Jehová, y no Dios desde muy lejos?"], [24, "¿Se ocultará alguno, dice Jehová, en escondrijos que yo no lo vea? ¿No lleno yo, dice Jehová, el cielo y la tierra?"]], "Mateo 10:30": [[30, "Pues aun vuestros cabellos están todos contados."]], "Salmo 139:7-8": [[7, "¿A dónde me iré de tu Espíritu? ¿Y a dónde huiré de tu presencia?"], [8, "Si subiere a los cielos, allí estás tú; Y si en el Seol hiciere mi estrado, he aquí, allí tú estás."]], "Salmo 147:5": [[5, "Grande es el Señor nuestro, y de mucho poder; Y su entendimiento es infinito."]], "1 Juan 1:9": [[9, "Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados, y limpiarnos de toda maldad."]], "Jeremías 23:24": [[24, "¿Se ocultará alguno, dice Jehová, en escondrijos que yo no lo vea? ¿No lleno yo, dice Jehová, el cielo y la tierra?"]], "Romanos 8:26-27": [[26, "Y de igual manera el Espíritu nos ayuda en nuestra debilidad; pues qué hemos de pedir como conviene, no lo sabemos, pero el Espíritu mismo intercede por nosotros con gemidos indecibles."], [27, "Mas el que escudriña los corazones sabe cuál es la intención del Espíritu, porque conforme a la voluntad de Dios intercede por los santos."]], "1 Juan 5:14-15": [[14, "Y esta es la confianza que tenemos en él, que si pedimos alguna cosa conforme a su voluntad, él nos oye."], [15, "Y si sabemos que él nos oye en cualquiera cosa que pidamos, sabemos que tenemos las peticiones que le hayamos hecho."]], "Jeremías 33:3": [[3, "Clama a mí, y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces."]], "1 Juan 5:14": [[14, "Y esta es la confianza que tenemos en él, que si pedimos alguna cosa conforme a su voluntad, él nos oye."]], "Filipenses 4:6": [[6, "Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias."]], "Mateo 6:7": [[7, "Y orando, no uséis vanas repeticiones, como los gentiles, que piensan que por su palabrería serán oídos."]], "Romanos 8:26": [[26, "Y de igual manera el Espíritu nos ayuda en nuestra debilidad; pues qué hemos de pedir como conviene, no lo sabemos, pero el Espíritu mismo intercede por nosotros con gemidos indecibles."]], "Mateo 6:8": [[8, "No os hagáis, pues, semejantes a ellos; porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis."]], "Hechos 17:25": [[25, "ni es honrado por manos de hombres, como si necesitase de algo; pues él es quien da a todos vida y aliento y todas las cosas."]], "Apocalipsis 4:11": [[11, "Señor, digno eres de recibir la gloria y la honra y el poder; porque tú creaste todas las cosas, y por tu voluntad existen y fueron creadas."]], "Isaías 43:7": [[7, "todos los llamados de mi nombre; para gloria mía los he creado, los formé y los hice."]], "Salmo 104:24": [[24, "¡Cuán innumerables son tus obras, oh Jehová! Hiciste todas ellas con sabiduría; La tierra está llena de tus beneficios."]], "Colosenses 4:5-6": [[5, "Andad sabiamente para con los de afuera, redimiendo el tiempo."], [6, "Sea vuestra palabra siempre con gracia, sazonada con sal, para que sepáis cómo debéis responder a cada uno."]], "1 Pedro 3:15": [[15, "sino santificad a Dios el Señor en vuestros corazones, y estad siempre preparados para presentar defensa con mansedumbre y reverencia ante todo el que os demande razón de la esperanza que hay en vosotros;"]], "Juan 16:8": [[8, "Y cuando él venga, convencerá al mundo de pecado, de justicia y de juicio."]], "Mateo 4:18": [[18, "Andando Jesús junto al mar de Galilea, vio a dos hermanos, Simón, llamado Pedro, y Andrés su hermano, que echaban la red en el mar; porque eran pescadores."]], "Mateo 9:9": [[9, "Pasando Jesús de allí, vio a un hombre llamado Mateo, que estaba sentado al banco de los tributos públicos, y le dijo: Sígueme. Y se levantó y le siguió."]], "Colosenses 4:14": [[14, "Os saluda Lucas el médico amado, y Demas."]], "2 Pedro 1:19-21": [[19, "Tenemos también la palabra profética más segura, a la cual hacéis bien en estar atentos como a una antorcha que alumbra en lugar oscuro, hasta que el día esclarezca y el lucero de la mañana salga en vuestros corazones;"], [20, "entendiendo primero esto, que ninguna profecía de la Escritura es de interpretación privada,"], [21, "porque nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo."]], "2 Timoteo 3:16": [[16, "Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia,"]], "2 Pedro 1:21": [[21, "porque nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo."]], "1 Tesalonicenses 2:13": [[13, "Por lo cual también nosotros sin cesar damos gracias a Dios, de que cuando recibisteis la palabra de Dios que oísteis de nosotros, la recibisteis no como palabra de hombres, sino según es en verdad, la palabra de Dios, la cual actúa en vosotros los creyentes."]], "Hechos 4:20": [[20, "porque no podemos dejar de decir lo que hemos visto y oído."]], "2 Pedro 1:16": [[16, "Porque no os hemos dado a conocer el poder y la venida de nuestro Señor Jesucristo siguiendo fábulas artificiosas, sino como habiendo visto con nuestros propios ojos su majestad."]], "1 Juan 1:1": [[1, "Lo que era desde el principio, lo que hemos oído, lo que hemos visto con nuestros ojos, lo que hemos contemplado, y palparon nuestras manos tocante al Verbo de vida"]], "Lucas 1:2-3": [[2, "tal como nos lo enseñaron los que desde el principio lo vieron con sus ojos, y fueron ministros de la palabra,"], [3, "me ha parecido también a mí, después de haber investigado con diligencia todas las cosas desde su origen, escribírtelas por orden, oh excelentísimo Teófilo,"]], "Lucas 22:61-62": [[61, "Entonces, vuelto el Señor, miró a Pedro; y Pedro se acordó de la palabra del Señor, que le había dicho: Antes que el gallo cante, me negarás tres veces."], [62, "Y Pedro, saliendo fuera, lloró amargamente."]], "Hechos 5:40-42": [[40, "Y convinieron con él; y llamando a los apóstoles, después de azotarlos, les intimaron que no hablasen en el nombre de Jesús, y los pusieron en libertad."], [41, "Y ellos salieron de la presencia del concilio, gozosos de haber sido tenidos por dignos de padecer afrenta por causa del Nombre."], [42, "Y todos los días, en el templo y por las casas, no cesaban de enseñar y predicar a Jesucristo."]], "Hechos 12:2": [[2, "Y mató a espada a Jacobo, hermano de Juan."]], "1 Corintios 15:6": [[6, "Después apareció a más de quinientos hermanos a la vez, de los cuales muchos viven aún, y otros ya duermen."]], "Marcos 10:43-44": [[43, "Pero no será así entre vosotros, sino que el que quiera hacerse grande entre vosotros será vuestro servidor,"], [44, "y el que de vosotros quiera ser el primero, será siervo de todos."]], "Isaías 40:8": [[8, "Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre."]], "Juan 9:7": [[7, "y le dijo: Ve a lavarte en el estanque de Siloé (que traducido es, Enviado). Fue entonces, y se lavó, y regresó viendo."]], "Lucas 3:1": [[1, "En el año decimoquinto del imperio de Tiberio César, siendo gobernador de Judea Poncio Pilato, y Herodes tetrarca de Galilea, y su hermano Felipe tetrarca de Iturea y de la provincia de Traconite, y Lisanias tetrarca de Abilinia,"]], "Lucas 3:1-2": [[1, "En el año decimoquinto del imperio de Tiberio César, siendo gobernador de Judea Poncio Pilato, y Herodes tetrarca de Galilea, y su hermano Felipe tetrarca de Iturea y de la provincia de Traconite, y Lisanias tetrarca de Abilinia,"], [2, "y siendo sumos sacerdotes Anás y Caifás, vino palabra de Dios a Juan, hijo de Zacarías, en el desierto."]], "Lucas 1:4": [[4, "para que conozcas bien la verdad de las cosas en las cuales has sido instruido."]], "Lucas 24:27": [[27, "Y comenzando desde Moisés, y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían."]], "Isaías 9:6": [[6, "Porque un niño nos es nacido, hijo nos es dado, y el principado sobre su hombro; y se llamará su nombre Admirable, Consejero, Dios Fuerte, Padre Eterno, Príncipe de Paz."]], "Lucas 2:11": [[11, "que os ha nacido hoy, en la ciudad de David, un Salvador, que es CRISTO el Señor."]], "Juan 5:39": [[39, "Escudriñad las Escrituras; porque a vosotros os parece que en ellas tenéis la vida eterna; y ellas son las que dan testimonio de mí;"]], "Hebreos 1:1-2": [[1, "Dios, habiendo hablado muchas veces y de muchas maneras en otro tiempo a los padres por los profetas,"], [2, "en estos postreros días nos ha hablado por el Hijo, a quien constituyó heredero de todo, y por quien asimismo hizo el universo;"]], "Malaquías 3:6": [[6, "Porque yo Jehová no cambio; por esto, hijos de Jacob, no habéis sido consumidos."]], "Éxodo 34:6": [[6, "Y pasando Jehová por delante de él, proclamó: ¡Jehová! ¡Jehová! fuerte, misericordioso y piadoso; tardo para la ira, y grande en misericordia y verdad;"]], "Mateo 5:17": [[17, "No penséis que he venido para abrogar la ley o los profetas; no he venido para abrogar, sino para cumplir."]], "Romanos 15:4": [[4, "Porque las cosas que se escribieron antes, para nuestra enseñanza se escribieron, a fin de que por la paciencia y la consolación de las Escrituras, tengamos esperanza."]], "Hebreos 10:12": [[12, "pero Cristo, habiendo ofrecido una vez para siempre un solo sacrificio por los pecados, se ha sentado a la diestra de Dios,"]], "Hebreos 4:12-13": [[12, "Porque la palabra de Dios es viva y eficaz, y más cortante que toda espada de dos filos; y penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón."], [13, "Y no hay cosa creada que no sea manifiesta en su presencia; antes bien todas las cosas están desnudas y abiertas a los ojos de aquel a quien tenemos que dar cuenta."]], "Salmo 119:105": [[105, "Lámpara es a mis pies tu palabra, Y lumbrera a mi camino."]], "Mateo 4:4": [[4, "Él respondió y dijo: Escrito está: No sólo de pan vivirá el hombre, sino de toda palabra que sale de la boca de Dios."]], "Hebreos 4:12": [[12, "Porque la palabra de Dios es viva y eficaz, y más cortante que toda espada de dos filos; y penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón."]], "Hechos 26:8": [[8, "¡Qué! ¿Se juzga entre vosotros cosa increíble que Dios resucite a los muertos?"]], "Lucas 1:37": [[37, "porque nada hay imposible para Dios."]], "Jeremías 32:17": [[17, "¡Oh Señor Jehová! he aquí que tú hiciste el cielo y la tierra con tu gran poder, y con tu brazo extendido, ni hay nada que sea difícil para ti;"]], "Juan 20:30-31": [[30, "Hizo además Jesús muchas otras señales en presencia de sus discípulos, las cuales no están escritas en este libro."], [31, "Pero éstas se han escrito para que creáis que Jesús es el Cristo, el Hijo de Dios, y para que creyendo, tengáis vida en su nombre."]], "Mateo 12:38-39": [[38, "Entonces respondieron algunos de los escribas y de los fariseos, diciendo: Maestro, deseamos ver de ti señal."], [39, "El respondió y les dijo: La generación mala y adúltera demanda señal; pero señal no le será dada, sino la señal del profeta Jonás."]], "Mateo 14:14": [[14, "Y saliendo Jesús, vio una gran multitud, y tuvo compasión de ellos, y sanó a los que de ellos estaban enfermos."]], "Jonás 1:1-3": [[1, "Vino palabra de Jehová a Jonás hijo de Amitai, diciendo:"], [2, "Levántate y ve a Nínive, aquella gran ciudad, y pregona contra ella; porque ha subido su maldad delante de mí."], [3, "Y Jonás se levantó para huir de la presencia de Jehová a Tarsis, y descendió a Jope, y halló una nave que partía para Tarsis; y pagando su pasaje, entró en ella para irse con ellos a Tarsis, lejos de la presencia de Jehová."]], "Salmo 23:1": [[1, "Jehová es mi pastor; nada me faltará."]], "Lucas 15:11-13": [[11, "También dijo: Un hombre tenía dos hijos;"], [12, "y el menor de ellos dijo a su padre: Padre, dame la parte de los bienes que me corresponde; y les repartió los bienes."], [13, "No muchos días después, juntándolo todo el hijo menor, se fue lejos a una provincia apartada; y allí desperdició sus bienes viviendo perdidamente."]], "Romanos 15:4-6": [[4, "Porque las cosas que se escribieron antes, para nuestra enseñanza se escribieron, a fin de que por la paciencia y la consolación de las Escrituras, tengamos esperanza."], [5, "Pero el Dios de la paciencia y de la consolación os dé entre vosotros un mismo sentir según Cristo Jesús,"], [6, "para que unánimes, a una voz, glorifiquéis al Dios y Padre de nuestro Señor Jesucristo."]], "Mateo 24:37-38": [[37, "Mas como en los días de Noé, así será la venida del Hijo del Hombre."], [38, "Porque como en los días antes del diluvio estaban comiendo y bebiendo, casándose y dando en casamiento, hasta el día en que Noé entró en el arca,"]], "Mateo 12:40": [[40, "Porque como estuvo Jonás en el vientre del gran pez tres días y tres noches, así estará el Hijo del Hombre en el corazón de la tierra tres días y tres noches."]], "Mateo 12:41": [[41, "Los hombres de Nínive se levantarán en el juicio con esta generación, y la condenarán; porque ellos se arrepintieron a la predicación de Jonás, y he aquí más que Jonás en este lugar."]], "Jonás 1:17": [[17, "Pero Jehová tenía preparado un gran pez que tragase a Jonás; y estuvo Jonás en el vientre del pez tres días y tres noches."]], "Mateo 28:2": [[2, "Y hubo un gran terremoto; porque un ángel del Señor, descendiendo del cielo y llegando, removió la piedra, y se sentó sobre ella."]], "Juan 20:12": [[12, "y vio a dos ángeles con vestiduras blancas, que estaban sentados el uno a la cabecera, y el otro a los pies, donde el cuerpo de Jesús había sido puesto."]], "Números 23:19": [[19, "Dios no es hombre, para que mienta, Ni hijo de hombre para que se arrepienta. El dijo, ¿y no hará? Habló, ¿y no lo ejecutará?"]], "Lucas 1:1-3": [[1, "Puesto que ya muchos han tratado de poner en orden la historia de las cosas que entre nosotros han sido ciertísimas,"], [2, "tal como nos lo enseñaron los que desde el principio lo vieron con sus ojos, y fueron ministros de la palabra,"], [3, "me ha parecido también a mí, después de haber investigado con diligencia todas las cosas desde su origen, escribírtelas por orden, oh excelentísimo Teófilo,"]], "2 Timoteo 2:15": [[15, "Procura con diligencia presentarte a Dios aprobado, como obrero que no tiene de qué avergonzarse, que usa bien la palabra de verdad."]], "Salmo 14:1": [[1, "Dice el necio en su corazón: No hay Dios. Se han corrompido, hacen obras abominables; No hay quien haga el bien."]], "Deuteronomio 19:15": [[15, "No se tomará en cuenta a un solo testigo contra ninguno en cualquier delito ni en cualquier pecado, en relación con cualquiera ofensa cometida. Sólo por el testimonio de dos o tres testigos se mantendrá la acusación."]], "Juan 14:25-27": [[25, "Os he dicho estas cosas estando con vosotros."], [26, "Mas el Consolador, el Espíritu Santo, a quien el Padre enviará en mi nombre, él os enseñará todas las cosas, y os recordará todo lo que yo os he dicho."], [27, "La paz os dejo, mi paz os doy; yo no os la doy como el mundo la da. No se turbe vuestro corazón, ni tenga miedo."]], "2 Pedro 3:15-16": [[15, "Y tened entendido que la paciencia de nuestro Señor es para salvación; como también nuestro amado hermano Pablo, según la sabiduría que le ha sido dada, os ha escrito,"], [16, "casi en todas sus epístolas, hablando en ellas de estas cosas; entre las cuales hay algunas difíciles de entender, las cuales los indoctos e inconstantes tuercen, como también las otras Escrituras, para su propia perdición."]], "Salmo 119:18": [[18, "Abre mis ojos, y miraré Las maravillas de tu ley."]], "Juan 14:26": [[26, "Mas el Consolador, el Espíritu Santo, a quien el Padre enviará en mi nombre, él os enseñará todas las cosas, y os recordará todo lo que yo os he dicho."]], "Hechos 8:30-31": [[30, "Acudiendo Felipe, le oyó que leía al profeta Isaías, y dijo: Pero ¿entiendes lo que lees?"], [31, "El dijo: ¿Y cómo podré, si alguno no me enseñare? Y rogó a Felipe que subiese y se sentara con él."]], "2 Pedro 3:16": [[16, "casi en todas sus epístolas, hablando en ellas de estas cosas; entre las cuales hay algunas difíciles de entender, las cuales los indoctos e inconstantes tuercen, como también las otras Escrituras, para su propia perdición."]], "Miqueas 5:2": [[2, "Pero tú, Belén Efrata, pequeña para estar entre las familias de Judá, de ti me saldrá el que será Señor en Israel; y sus salidas son desde el principio, desde los días de la eternidad."]], "Salmo 22:18": [[18, "Repartieron entre sí mis vestidos, Y sobre mi ropa echaron suertes."]], "Mateo 2:1": [[1, "Cuando Jesús nació en Belén de Judea en días del rey Herodes, vinieron del oriente a Jerusalén unos magos,"]], "Juan 19:23-24": [[23, "Cuando los soldados hubieron crucificado a Jesús, tomaron sus vestidos, e hicieron cuatro partes, una para cada soldado. Tomaron también su túnica, la cual era sin costura, de un solo tejido de arriba abajo."], [24, "Entonces dijeron entre sí: No la partamos, sino echemos suertes sobre ella, a ver de quién será. Esto fue para que se cumpliese la Escritura, que dice: Repartieron entre sí mis vestidos, Y sobre mi ropa echaron suertes. Y así lo hicieron los soldados."]], "Isaías 53:5": [[5, "Mas él herido fue por nuestras rebeliones, molido por nuestros pecados; el castigo de nuestra paz fue sobre él, y por su llaga fuimos nosotros curados."]], "Mateo 2:4-6": [[4, "Y convocados todos los principales sacerdotes, y los escribas del pueblo, les preguntó dónde había de nacer el Cristo."], [5, "Ellos le dijeron: En Belén de Judea; porque así está escrito por el profeta:"], [6, "Y tú, Belén, de la tierra de Judá, No eres la más pequeña entre los príncipes de Judá; Porque de ti saldrá un guiador, Que apacentará a mi pueblo Israel."]], "Hechos 8:35": [[35, "Entonces Felipe, abriendo su boca, y comenzando desde esta escritura, le anunció el evangelio de Jesús."]], "1 Pedro 2:24": [[24, "quien llevó él mismo nuestros pecados en su cuerpo sobre el madero, para que nosotros, estando muertos a los pecados, vivamos a la justicia; y por cuya herida fuisteis sanados."]], "Deuteronomio 18:10": [[10, "No sea hallado en ti quien haga pasar a su hijo o a su hija por el fuego, ni quien practique adivinación, ni agorero, ni sortílego, ni hechicero,"]], "Zacarías 9:9": [[9, "Alégrate mucho, hija de Sion; da voces de júbilo, hija de Jerusalén; he aquí tu rey vendrá a ti, justo y salvador, humilde, y cabalgando sobre un asno, sobre un pollino hijo de asna."]], "Efesios 2:20": [[20, "edificados sobre el fundamento de los apóstoles y profetas, siendo la principal piedra del ángulo Jesucristo mismo,"]], "Lucas 24:44": [[44, "Y les dijo: Estas son las palabras que os hablé, estando aún con vosotros: que era necesario que se cumpliese todo lo que está escrito de mí en la ley de Moisés, en los profetas y en los salmos."]], "Juan 17:17": [[17, "Santifícalos en tu verdad; tu palabra es verdad."]], "Gálatas 4:4-5": [[4, "Pero cuando vino el cumplimiento del tiempo, Dios envió a su Hijo, nacido de mujer y nacido bajo la ley,"], [5, "para que redimiese a los que estaban bajo la ley, a fin de que recibiésemos la adopción de hijos."]], "Gálatas 4:4": [[4, "Pero cuando vino el cumplimiento del tiempo, Dios envió a su Hijo, nacido de mujer y nacido bajo la ley,"]], "Marcos 2:5-7": [[5, "Al ver Jesús la fe de ellos, dijo al paralítico: Hijo, tus pecados te son perdonados."], [6, "Estaban allí sentados algunos de los escribas, los cuales cavilaban en sus corazones:"], [7, "¿Por qué habla éste así? Blasfemias dice. ¿Quién puede perdonar pecados, sino sólo Dios?"]], "Juan 10:30": [[30, "Yo y el Padre uno somos."]], "Juan 10:33": [[33, "Le respondieron los judíos, diciendo: Por buena obra no te apedreamos, sino por la blasfemia; porque tú, siendo hombre, te haces Dios."]], "Juan 20:28": [[28, "Entonces Tomás respondió y le dijo: ¡Señor mío, y Dios mío!"]], "Mateo 14:33": [[33, "Entonces los que estaban en la barca vinieron y le adoraron, diciendo: Verdaderamente eres Hijo de Dios."]], "Hechos 10:25-26": [[25, "Cuando Pedro entró, salió Cornelio a recibirle, y postrándose a sus pies, adoró."], [26, "Mas Pedro le levantó, diciendo: Levántate, pues yo mismo también soy hombre."]], "Juan 8:58-59": [[58, "Jesús les dijo: De cierto, de cierto os digo: Antes que Abraham fuese, yo soy."], [59, "Tomaron entonces piedras para arrojárselas; pero Jesús se escondió y salió del templo; y atravesando por en medio de ellos, se fue."]], "Juan 1:14": [[14, "Y aquel Verbo fue hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad."]], "Juan 1:1": [[1, "En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios."]], "Juan 11:35": [[35, "Jesús lloró."]], "Mateo 4:2": [[2, "Y después de haber ayunado cuarenta días y cuarenta noches, tuvo hambre."]], "Juan 4:6": [[6, "Y estaba allí el pozo de Jacob. Entonces Jesús, cansado del camino, se sentó así junto al pozo. Era como la hora sexta."]], "Marcos 4:39": [[39, "Y levantándose, reprendió al viento, y dijo al mar: Calla, enmudece. Y cesó el viento, y se hizo grande bonanza."]], "Marcos 4:41": [[41, "Entonces temieron con gran temor, y se decían el uno al otro: ¿Quién es éste, que aun el viento y el mar le obedecen?"]], "Romanos 5:10": [[10, "Porque si siendo enemigos, fuimos reconciliados con Dios por la muerte de su Hijo, mucho más, estando reconciliados, seremos salvos por su vida."]], "Lucas 2:40": [[40, "Y el niño crecía y se fortalecía, y se llenaba de sabiduría; y la gracia de Dios era sobre él."]], "Hebreos 4:15": [[15, "Porque no tenemos un sumo sacerdote que no pueda compadecerse de nuestras debilidades, sino uno que fue tentado en todo según nuestra semejanza, pero sin pecado."]], "1 Juan 1:8-9": [[8, "Si decimos que no tenemos pecado, nos engañamos a nosotros mismos, y la verdad no está en nosotros."], [9, "Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados, y limpiarnos de toda maldad."]], "Romanos 3:23": [[23, "por cuanto todos pecaron, y están destituidos de la gloria de Dios,"]], "1 Juan 3:4": [[4, "Todo aquel que comete pecado, infringe también la ley; pues el pecado es infracción de la ley."]], "Mateo 5:21-22": [[21, "Oísteis que fue dicho a los antiguos: No matarás; y cualquiera que matare será culpable de juicio."], [22, "Pero yo os digo que cualquiera que se enoje contra su hermano, será culpable de juicio; y cualquiera que diga: Necio, a su hermano, será culpable ante el concilio; y cualquiera que le diga: Fatuo, quedará expuesto al infierno de fuego."]], "Isaías 59:2": [[2, "pero vuestras iniquidades han hecho división entre vosotros y vuestro Dios, y vuestros pecados han hecho ocultar de vosotros su rostro para no oír."]], "Romanos 5:8": [[8, "Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros."]], "Romanos 5:6-8": [[6, "Porque Cristo, cuando aún éramos débiles, a su tiempo murió por los impíos."], [7, "Ciertamente, apenas morirá alguno por un justo; con todo, pudiera ser que alguno osara morir por el bueno."], [8, "Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros."]], "Juan 15:12-13": [[12, "Este es mi mandamiento: Que os améis unos a otros, como yo os he amado."], [13, "Nadie tiene mayor amor que este, que uno ponga su vida por sus amigos."]], "Juan 3:16": [[16, "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."]], "Romanos 6:23": [[23, "Porque la paga del pecado es muerte, mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro."]], "2 Corintios 5:21": [[21, "Al que no conoció pecado, por nosotros lo hizo pecado, para que nosotros fuésemos hechos justicia de Dios en él."]], "Juan 15:13": [[13, "Nadie tiene mayor amor que este, que uno ponga su vida por sus amigos."]], "Juan 10:18": [[18, "Nadie me la quita, sino que yo de mí mismo la pongo. Tengo poder para ponerla, y tengo poder para volverla a tomar. Este mandamiento recibí de mi Padre."]], "1 Corintios 15:14": [[14, "Y si Cristo no resucitó, vana es entonces nuestra predicación, vana es también vuestra fe."]], "Lucas 1:3": [[3, "me ha parecido también a mí, después de haber investigado con diligencia todas las cosas desde su origen, escribírtelas por orden, oh excelentísimo Teófilo,"]], "Mateo 28:6": [[6, "No está aquí, pues ha resucitado, como dijo. Venid, ved el lugar donde fue puesto el Señor."]], "Lucas 24:2-3": [[2, "Y hallaron removida la piedra del sepulcro;"], [3, "y entrando, no hallaron el cuerpo del Señor Jesús."]], "Hechos 4:13": [[13, "Entonces viendo el denuedo de Pedro y de Juan, y sabiendo que eran hombres sin letras y del vulgo, se maravillaban; y les reconocían que habían estado con Jesús."]], "Mateo 26:56": [[56, "Mas todo esto sucede, para que se cumplan las Escrituras de los profetas. Entonces todos los discípulos, dejándole, huyeron."]], "Juan 20:19": [[19, "Cuando llegó la noche de aquel mismo día, el primero de la semana, estando las puertas cerradas en el lugar donde los discípulos estaban reunidos por miedo de los judíos, vino Jesús, y puesto en medio, les dijo: Paz a vosotros."]], "Mateo 27:65-66": [[65, "Y Pilato les dijo: Ahí tenéis una guardia; id, aseguradlo como sabéis."], [66, "Entonces ellos fueron y aseguraron el sepulcro, sellando la piedra y poniendo la guardia."]], "Juan 19:34": [[34, "Pero uno de los soldados le abrió el costado con una lanza, y al instante salió sangre y agua."]], "Mateo 28:15": [[15, "Y ellos, tomando el dinero, hicieron como se les había instruido. Este dicho se ha divulgado entre los judíos hasta el día de hoy."]], "Hechos 12:1-2": [[1, "En aquel mismo tiempo el rey Herodes echó mano a algunos de la iglesia para maltratarles."], [2, "Y mató a espada a Jacobo, hermano de Juan."]], "Lucas 24:39": [[39, "Mirad mis manos y mis pies, que yo mismo soy; palpad, y ved; porque un espíritu no tiene carne ni huesos, como veis que yo tengo."]], "Mateo 27:64": [[64, "Manda, pues, que se asegure el sepulcro hasta el tercer día, no sea que vengan sus discípulos de noche, y lo hurten, y digan al pueblo: Resucitó de entre los muertos. Y será el postrer error peor que el primero."]], "Lucas 24:42-43": [[42, "Entonces le dieron parte de un pez asado, y un panal de miel."], [43, "Y él lo tomó, y comió delante de ellos."]], "Lucas 24:37": [[37, "Entonces, espantados y atemorizados, pensaban que veían espíritu."]], "Mateo 28:13": [[13, "diciendo: Decid vosotros: Sus discípulos vinieron de noche, y lo hurtaron, estando nosotros dormidos."]], "Hechos 4:18": [[18, "Y llamándolos, les intimaron que en ninguna manera hablasen ni enseñasen en el nombre de Jesús."]], "Juan 11:25": [[25, "Le dijo Jesús: Yo soy la resurrección y la vida; el que cree en mí, aunque esté muerto, vivirá."]], "Hebreos 7:23-25": [[23, "Y los otros sacerdotes llegaron a ser muchos, debido a que por la muerte no podían continuar;"], [24, "mas éste, por cuanto permanece para siempre, tiene un sacerdocio inmutable;"], [25, "por lo cual puede también salvar perpetuamente a los que por él se acercan a Dios, viviendo siempre para interceder por ellos."]], "1 Corintios 15:55": [[55, "¿Dónde está, oh muerte, tu aguijón? ¿Dónde, oh sepulcro, tu victoria?"]], "Hebreos 7:25": [[25, "por lo cual puede también salvar perpetuamente a los que por él se acercan a Dios, viviendo siempre para interceder por ellos."]], "1 Corintios 15:20": [[20, "Mas ahora Cristo ha resucitado de los muertos; primicias de los que durmieron es hecho."]], "1 Corintios 15:26": [[26, "Y el postrer enemigo que será destruido es la muerte."]], "Génesis 18:25": [[25, "Lejos de ti el hacer tal, que hagas morir al justo con el impío, y que sea el justo tratado como el impío; nunca tal hagas. El Juez de toda la tierra, ¿no ha de hacer lo que es justo?"]], "Salmo 56:3": [[3, "En el día que temo, Yo en ti confío."]], "Efesios 2:8-10": [[8, "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;"], [9, "no por obras, para que nadie se gloríe."], [10, "Porque somos hechura suya, creados en Cristo Jesús para buenas obras, las cuales Dios preparó de antemano para que anduviésemos en ellas."]], "Efesios 2:8": [[8, "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;"]], "Efesios 2:8-9": [[8, "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;"], [9, "no por obras, para que nadie se gloríe."]], "Romanos 10:9": [[9, "que si confesares con tu boca que Jesús es el Señor, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo."]], "Romanos 6:1-2": [[1, "¿Qué, pues, diremos? ¿Perseveraremos en el pecado para que la gracia abunde?"], [2, "En ninguna manera. Porque los que hemos muerto al pecado, ¿cómo viviremos aún en él?"]], "Efesios 2:10": [[10, "Porque somos hechura suya, creados en Cristo Jesús para buenas obras, las cuales Dios preparó de antemano para que anduviésemos en ellas."]], "Santiago 2:17": [[17, "Así también la fe, si no tiene obras, es muerta en sí misma."]], "Juan 14:6": [[6, "Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí."]], "Juan 14:5": [[5, "Le dijo Tomás: Señor, no sabemos a dónde vas; ¿cómo, pues, podemos saber el camino?"]], "Hechos 4:12": [[12, "Y en ningún otro hay salvación; porque no hay otro nombre bajo el cielo, dado a los hombres, en que podamos ser salvos."]], "Hechos 4:10": [[10, "sea notorio a todos vosotros, y a todo el pueblo de Israel, que en el nombre de Jesucristo de Nazaret, a quien vosotros crucificasteis y a quien Dios resucitó de los muertos, por él este hombre está en vuestra presencia sano."]], "1 Timoteo 2:5": [[5, "Porque hay un solo Dios, y un solo mediador entre Dios y los hombres, Jesucristo hombre,"]], "1 Timoteo 2:4": [[4, "el cual quiere que todos los hombres sean salvos y vengan al conocimiento de la verdad."]], "1 Samuel 16:7": [[7, "Y Jehová respondió a Samuel: No mires a su parecer, ni a lo grande de su estatura, porque yo lo desecho; porque Jehová no mira lo que mira el hombre; pues el hombre mira lo que está delante de sus ojos, pero Jehová mira el corazón."]], "Ezequiel 36:25-27": [[25, "Esparciré sobre vosotros agua limpia, y seréis limpiados de todas vuestras inmundicias; y de todos vuestros ídolos os limpiaré."], [26, "Os daré corazón nuevo, y pondré espíritu nuevo dentro de vosotros; y quitaré de vuestra carne el corazón de piedra, y os daré un corazón de carne."], [27, "Y pondré dentro de vosotros mi Espíritu, y haré que andéis en mis estatutos, y guardéis mis preceptos, y los pongáis por obra."]], "2 Corintios 5:17": [[17, "De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas."]], "Juan 3:3": [[3, "Respondió Jesús y le dijo: De cierto, de cierto te digo, que el que no naciere de nuevo, no puede ver el reino de Dios."]], "Juan 3:4": [[4, "Nicodemo le dijo: ¿Cómo puede un hombre nacer siendo viejo? ¿Puede acaso entrar por segunda vez en el vientre de su madre, y nacer?"]], "Juan 3:6": [[6, "Lo que es nacido de la carne, carne es; y lo que es nacido del Espíritu, espíritu es."]], "Ezequiel 36:26": [[26, "Os daré corazón nuevo, y pondré espíritu nuevo dentro de vosotros; y quitaré de vuestra carne el corazón de piedra, y os daré un corazón de carne."]], "1 Juan 3:14": [[14, "Nosotros sabemos que hemos pasado de muerte a vida, en que amamos a los hermanos. El que no ama a su hermano, permanece en muerte."]], "Juan 14:1": [[1, "No se turbe vuestro corazón; creéis en Dios, creed también en mí."]], "Juan 14:3": [[3, "Y si me fuere y os preparare lugar, vendré otra vez, y os tomaré a mí mismo, para que donde yo estoy, vosotros también estéis."]], "Hechos 1:11": [[11, "los cuales también les dijeron: Varones galileos, ¿por qué estáis mirando al cielo? Este mismo Jesús, que ha sido tomado de vosotros al cielo, así vendrá como le habéis visto ir al cielo."]], "Hechos 1:10": [[10, "Y estando ellos con los ojos puestos en el cielo, entre tanto que él se iba, he aquí se pusieron junto a ellos dos varones con vestiduras blancas,"]], "Mateo 24:42": [[42, "Velad, pues, porque no sabéis a qué hora ha de venir vuestro Señor."]], "Mateo 24:36": [[36, "Pero del día y la hora nadie sabe, ni aun los ángeles de los cielos, sino sólo mi Padre."]], "Mateo 16:15": [[15, "El les dijo: Y vosotros, ¿quién decís que soy yo?"]], "Juan 3:16-17": [[16, "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."], [17, "Porque no envió Dios a su Hijo al mundo para condenar al mundo, sino para que el mundo sea salvo por él."]], "Mateo 16:16": [[16, "Respondiendo Simón Pedro, dijo: Tú eres el Cristo, el Hijo del Dios viviente."]], "Marcos 9:24": [[24, "E inmediatamente el padre del muchacho clamó y dijo: Creo; ayuda mi incredulidad."]], "Mateo 6:8-9": [[8, "No os hagáis, pues, semejantes a ellos; porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis."], [9, "Vosotros, pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre."]], "Marcos 1:35": [[35, "Levantándose muy de mañana, siendo aún muy oscuro, salió y se fue a un lugar desierto, y allí oraba."]], "Lucas 5:16": [[16, "Mas él se apartaba a lugares desiertos, y oraba."]], "Filipenses 4:6-7": [[6, "Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias."], [7, "Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús."]], "Santiago 4:2": [[2, "Codiciáis, y no tenéis; matáis y ardéis de envidia, y no podéis alcanzar; combatís y lucháis, pero no tenéis lo que deseáis, porque no pedís."]], "Hebreos 10:23-25": [[23, "Mantengamos firme, sin fluctuar, la profesión de nuestra esperanza, porque fiel es el que prometió."], [24, "Y considerémonos unos a otros para estimularnos al amor y a las buenas obras;"], [25, "no dejando de congregarnos, como algunos tienen por costumbre, sino exhortándonos; y tanto más, cuanto veis que aquel día se acerca."]], "Hebreos 10:25": [[25, "no dejando de congregarnos, como algunos tienen por costumbre, sino exhortándonos; y tanto más, cuanto veis que aquel día se acerca."]], "1 Corintios 12:27": [[27, "Vosotros, pues, sois el cuerpo de Cristo, y miembros cada uno en particular."]], "Hechos 2:42": [[42, "Y perseveraban en la doctrina de los apóstoles, en la comunión unos con otros, en el partimiento del pan y en las oraciones."]], "Gálatas 5:22-23": [[22, "Mas el fruto del Espíritu es amor, gozo, paz, paciencia, benignidad, bondad, fe,"], [23, "mansedumbre, templanza; contra tales cosas no hay ley."]], "Hechos 5:3-4": [[3, "Y dijo Pedro: Ananías, ¿por qué llenó Satanás tu corazón para que mintieses al Espíritu Santo, y sustrajeses del precio de la heredad?"], [4, "Reteniéndola, ¿no se te quedaba a ti? y vendida, ¿no estaba en tu poder? ¿Por qué pusiste esto en tu corazón? No has mentido a los hombres, sino a Dios."]], "Efesios 4:30": [[30, "Y no contristéis al Espíritu Santo de Dios, con el cual fuisteis sellados para el día de la redención."]], "Juan 14:16": [[16, "Y yo rogaré al Padre, y os dará otro Consolador, para que esté con vosotros para siempre:"]], "Romanos 8:9": [[9, "Mas vosotros no vivís según la carne, sino según el Espíritu, si es que el Espíritu de Dios mora en vosotros. Y si alguno no tiene el Espíritu de Cristo, no es de él."]], "Hechos 17:10-12": [[10, "Inmediatamente, los hermanos enviaron de noche a Pablo y a Silas hasta Berea. Y ellos, habiendo llegado, entraron en la sinagoga de los judíos."], [11, "Y éstos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así."], [12, "Así que creyeron muchos de ellos, y mujeres griegas de distinción, y no pocos hombres."]], "Juan 20:27": [[27, "Luego dijo a Tomás: Pon aquí tu dedo, y mira mis manos; y acerca tu mano, y métela en mi costado; y no seas incrédulo, sino creyente."]], "Hechos 17:11": [[11, "Y éstos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así."]], "Judas 22": [[22, "A algunos que dudan, convencedlos."]], "Deuteronomio 29:29": [[29, "Las cosas secretas pertenecen a Jehová nuestro Dios; mas las reveladas son para nosotros y para nuestros hijos para siempre, para que cumplamos todas las palabras de esta ley."]], "2 Corintios 12:8-9": [[8, "respecto a lo cual tres veces he rogado al Señor, que lo quite de mí."], [9, "Y me ha dicho: Bástate mi gracia; porque mi poder se perfecciona en la debilidad. Por tanto, de buena gana me gloriaré más bien en mis debilidades, para que repose sobre mí el poder de Cristo."]], "Isaías 55:8-9": [[8, "Porque mis pensamientos no son vuestros pensamientos, ni vuestros caminos mis caminos, dijo Jehová."], [9, "Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos, y mis pensamientos más que vuestros pensamientos."]], "2 Corintios 12:9": [[9, "Y me ha dicho: Bástate mi gracia; porque mi poder se perfecciona en la debilidad. Por tanto, de buena gana me gloriaré más bien en mis debilidades, para que repose sobre mí el poder de Cristo."]], "Efesios 4:32": [[32, "Antes sed benignos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo."]], "Mateo 18:21-22": [[21, "Entonces se le acercó Pedro y le dijo: Señor, ¿cuántas veces perdonaré a mi hermano que peque contra mí? ¿Hasta siete?"], [22, "Jesús le dijo: No te digo hasta siete, sino aun hasta setenta veces siete."]], "Romanos 12:19": [[19, "No os venguéis vosotros mismos, amados míos, sino dejad lugar a la ira de Dios; porque escrito está: Mía es la venganza, yo pagaré, dice el Señor."]], "Romanos 13:4": [[4, "porque es servidor de Dios para tu bien. Pero si haces lo malo, teme; porque no en vano lleva la espada, pues es servidor de Dios, vengador para castigar al que hace lo malo."]], "Romanos 1:16-17": [[16, "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego."], [17, "Porque en el evangelio la justicia de Dios se revela por fe y para fe, como está escrito: Mas el justo por la fe vivirá."]], "Romanos 1:16": [[16, "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego."]], "1 Corintios 1:18": [[18, "Porque la palabra de la cruz es locura a los que se pierden; pero a los que se salvan, esto es, a nosotros, es poder de Dios."]], "Juan 15:18": [[18, "Si el mundo os aborrece, sabed que a mí me ha aborrecido antes que a vosotros."]], "Mateo 5:44": [[44, "Pero yo os digo: Amad a vuestros enemigos, bendecid a los que os maldicen, haced bien a los que os aborrecen, y orad por los function toast(t){

/* ---------- Citas tocables ---------- */
const refKeys = Object.keys(REFS).sort((a, b) => b.length - a.length);
const refRx = refKeys.length ? new RegExp("(" + refKeys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![\\d\\-])", "g") : null;

}
function verCita(ref){

  v.innerHTML = `<div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(ref)}"><div class="asa"></div><div class="r">${esc(ref)}</div><div class="ver">Reina-Valera 1960</div><div class="texto">${vs.map(([n, t]) => (vs.length > 1 ? `<sup>${n}</sup>` : "") + esc(t)).join(" ")}</div><button class="btn suave" onclick="cerrarHoja()">Cerrar</button><div class="pie" style="margin-top:14px">${esc(RVR)}</div></div>`;

function cerrarHoja(){ const v = document.getElementById("velo"); if (v) v.remove(); }

function edad(v){ estado.edad = v; guardar(); const m = location.hash.match(/^#p\/(\d+)/); if (m) { const y = window.scrollY; pregunta(+m[1]); window.scrollTo(0, y); } }
function marcarYQuedar(n){ marcar(n); const y = window.scrollY; pregunta(n); window.scrollTo(0, y); }

/* ---------- Memorizar el versículo ---------- */
let juego = null;
const NIVELES = [0.3, 0.6, 1];
function armarJuego(n, nivel){
  const p = P.find(x => x.n === n);
  const palabras = p.vers.split(/\s+/);
  const candidatas = palabras.map((w, i) => ({ w, i })).filter(o => o.w.replace(/[^\p{L}]/gu, "").length >= 3);
  const cuantas = Math.max(1, Math.round(candidatas.length * NIVELES[nivel]));
  const elegidas = nivel === 2 ? candidatas : candidatas.slice().sort(() => Math.random() - .5).slice(0, cuantas);
  const huecos = elegidas.map(o => o.i).sort((a, b) => a - b);
  const fichas = huecos.map(i => ({ i, w: palabras[i].replace(/[^\p{L}\p{N}]/gu, "") })).sort(() => Math.random() - .5);
  juego = { n, nivel, palabras, huecos, fichas, pos: 0, errores: 0 };
}
function memoria(n){
  const p = P.find(x => x.n === n); if (!p) { location.hash = ""; return; }
  if (!juego || juego.n !== n) armarJuego(n, 0);
  const j = juego, terminado = j.pos >= j.huecos.length;
  const texto = j.palabras.map((w, i) => {
    const k = j.huecos.indexOf(i);
    if (k === -1) return esc(w);
    const limpia = w.replace(/[^\p{L}\p{N}]/gu, ""), resto = esc(w.replace(limpia, "\u0000")).split("\u0000");
    if (k < j.pos) return `${resto[0] || ""}<span class="hueco ok">${esc(limpia)}</span>${resto[1] || ""}`;
    return `${resto[0] || ""}<span class="hueco ${k === j.pos ? "act" : ""}">${esc(limpia)}</span>${resto[1] || ""}`;
  }).join(" ");
  $app.innerHTML = cabecera("Memorizá el versículo", `p/${n}`, `Nivel ${j.nivel + 1}/3`) + `
  <div class="mem-card pop"><div class="r">${esc(p.cita)} · RVR1960</div><div class="mem-texto">${texto}</div></div>
  <div class="niveles" aria-hidden="true">${NIVELES.map((_, k) => `<i class="${k < j.nivel || (k === j.nivel && terminado) ? "si" : ""}"></i>`).join("")}</div>
  ${terminado ? (j.nivel < 2
    ? `<div class="fiesta" style="padding:14px 0 0"><h2>¡Bien ahí! 🙌</h2><p>Ahora con más palabras escondidas.</p><button class="btn amar" onclick="armarJuego(${n}, ${j.nivel + 1}); memoria(${n})">Siguiente nivel</button></div>`
    : `<div class="fiesta" style="padding:14px 0 0"><div class="big">🧠</div><h2>¡Lo tenés guardado!</h2><p>«${esc(REFS["Salmo 119:11"].map(v => v[1]).join(" "))}» <button class="ref" onclick="verCita('Salmo 119:11')">Salmo 119:11</button></p><button class="btn prim" onclick="location.hash='p/${n}'">Volver a la pregunta</button><button class="btn suave" onclick="armarJuego(${n}, 0); memoria(${n})">Jugar de nuevo</button></div>`)
    : `<p class="ayuda" style="text-align:center;margin-top:10px">Tocá las palabras en orden para completar el versículo.</p>
       <div class="fichas">${j.fichas.map((f, k) => `<button class="ficha ${j.huecos.indexOf(f.i) < j.pos ? "usada" : ""}" onclick="tocarFicha(${k}, this)">${esc(f.w)}</button>`).join("")}</div>
       <button class="btn suave" onclick="pista()">Una ayudita</button>`}
  `;
}
function tocarFicha(k, el){
  const j = juego, f = j.fichas[k], esperado = j.palabras[j.huecos[j.pos]].replace(/[^\p{L}\p{N}]/gu, "");
  if (norm(f.w) === norm(esperado)) {
    const otra = j.fichas.findIndex(x => x.i === j.huecos[j.pos]);
    if (otra !== k) { const tmp = j.fichas[otra].i; j.fichas[otra].i = f.i; f.i = tmp; }
    j.pos++;
    if (j.pos >= j.huecos.length && j.nivel === 2) conMedallas(() => { if (!memorizado(j.n)) estado.memo.push(j.n); });
    memoria(j.n);
  } else { j.errores++; el.classList.remove("mal"); void el.offsetWidth; el.classList.add("mal"); }
}
function pista(){ const j = juego; const k = j.fichas.findIndex(x => x.i === j.huecos[j.pos]); const b = document.querySelectorAll(".ficha")[k]; if (b) { b.style.borderColor = "var(--verde)"; b.style.boxShadow = "0 0 0 3px #8FD3B0"; } }

/* ---------- Desafío ---------- */
function nuevaDes(){
  const pend = P.filter(p => !hecha(p.n));
  const pool = pend.length ? pend : P;
  let p; do { p = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && des && des.p && p.n === des.p.n);
  des = { p, ver: false, racha: des ? des.racha : 0 };
}
function desafio(){
  if (!des) nuevaDes();
  const p = des.p;
  $app.innerHTML = cabecera("Modo desafío", "", `🔥 ${des.racha}`) + `
  <div class="des-card pop">
    <span class="etq">${esc(E[p.e])}</span>
    <h2>${esc(p.q)}</h2>
    ${des.ver ? `<div class="globo" style="text-align:left">${conCitas(estado.edad === "ch" ? p.ch : p.gr)}</div><div class="vers" style="text-align:left;margin-top:24px"><q>${esc(p.vers)}</q><small>${esc(p.cita)} · RVR1960</small></div>` : `<div class="mano">Pensá tu respuesta o decila en voz alta. Después mirá si se parece.</div>`}
  </div>
  ${des.ver ? `<div class="fila2"><button class="btn suave" onclick="desNo()">Todavía no</button><button class="btn amar" onclick="desSi()">¡La sabía!</button></div><button class="btn prim" onclick="location.hash='p/${p.n}'">Ver las pistas completas</button>` : `<button class="btn prim" onclick="des.ver=true;desafio()">Ver la respuesta</button><button class="btn suave" onclick="nuevaDes();desafio()">Pasar a otra</button>`}
  <div class="racha">${estado.hechas.length} de 52 aprendidas · mejor racha: ${estado.mejorRacha || 0}</div>`;
  window.scrollTo(0, 0);
}
function desSi(){ des.racha++; conMedallas(() => { if (!hecha(des.p.n)) estado.hechas.push(des.p.n); estado.mejorRacha = Math.max(estado.mejorRacha || 0, des.racha); }); nuevaDes(); desafio(); }
function desNo(){ des.racha = 0; nuevaDes(); desafio(); }

/* ---------- Medallas y certificado ---------- */
function logros(){
  const gan = medallasGanadas();
  $app.innerHTML = cabecera("Mis medallas", "", `${gan.length}/${MEDALLAS.length}`) + `
  <div class="medallas pop">${MEDALLAS.map(m => `<div class="medalla ${gan.includes(m.id) ? "si" : ""}"><div class="m">${m.ico}</div><b>${esc(m.t)}</b><small>${gan.includes(m.id) ? "¡Ganada!" : esc(m.d)}</small></div>`).join("")}</div>
  <button class="cert-link" onclick="location.hash='certificado'"><span class="ico">📜</span><span><b>Mi certificado</b><span>${estado.hechas.length === 52 ? "¡Ya lo podés imprimir!" : `Se desbloquea con las 52 preguntas (vas ${estado.hechas.length})`}</span></span></button>`;
}
function certificado(){
  const listo = estado.hechas.length === 52;
  const p13 = P.find(x => x.n === 13);
  const fecha = estado.fin ? new Date(estado.fin + "T12:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" }) : "";
  const tarjeta = `<div class="cert">
    <div class="marca">Por Qué Creo</div>
    <h2>Certificado de fe</h2>
    <div class="otorga">Este certificado es para</div>
    <div class="nombre" id="cnom">${esc(estado.nombre || "")}</div>
    <p>que recorrió las 52 preguntas de <b>Demostrame</b> y ya puede explicar con sus palabras, y con la Palabra, por qué cree en Dios.</p>
    <div class="v">«${esc(p13.vers)}»<small>${esc(p13.cita)} · RVR1960</small></div>
    <div class="fecha">${fecha}</div>
  </div>`;
  $app.innerHTML = cabecera("Mi certificado", "logros") + (listo ? `
    <div class="campo no-print"><label for="nom">Nombre para el certificado</label><input id="nom" value="${esc(estado.nombre || "")}" maxlength="40" placeholder="Escribí tu nombre"></div>
    ${tarjeta}
    <button class="btn amar no-print" onclick="window.print()">🖨️ Imprimir o guardar en PDF</button>` : `
    <div class="bloqueado">${tarjeta}<div class="candado"><div><div style="font-size:34px">🔒</div><b>Te faltan ${52 - estado.hechas.length} preguntas</b><span>Cuando marques las 52 como aprendidas, tu certificado se desbloquea.</span></div></div></div>
    <button class="btn prim" onclick="location.hash='desafio'">Seguir con el desafío</button>`);
  const inp = document.getElementById("nom");
  if (inp) inp.addEventListener("input", e => { estado.nombre = e.target.value; guardar(); document.getElementById("cnom").textContent = estado.nombre; });
}

function ruta(){
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  cerrarHoja();
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^e\/([1-4])$/))) etapa(+m[1]);
  else if ((m = h.match(/^p\/(\d+)$/))) pregunta(+m[1]);
  else if ((m = h.match(/^m\/(\d+)$/))) { juego = null; memoria(+m[1]); window.scrollTo(0, 0); }
  else if (h === "desafio") desafio();
  else if (h === "logros") logros();
  else if (h === "certificado") certificado();
  else inicio();
  if (!/^p\//.test(h)) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", ruta);
ruta();
</script>
</body>
</html>
