<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="52 preguntas difíciles sobre Dios, con respuestas simples, versículos y juegos para memorizar.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2A4A; --navy2:#2A3550; --gris:#5B6478;
  --crema:#FFF8EC; --crema2:#F4ECDD; --borde:#E7DCC8;
  --amarillo:#F6CF6A; --oro:#E0A526; --terra:#C8694A; --verde:#3F8F6B;
  --blanco:#FFFFFF;
  --radio:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--crema);color:var(--navy);font-family:Nunito,Arial,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--crema);display:flex;align-items:center;gap:8px;padding:12px 0 10px;min-height:56px}
.top .volver{width:40px;height:40px;border-radius:50%;background:var(--crema2);display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.top .tit{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cont{font-size:14px;font-weight:700;color:var(--gris)}

/* Inicio */
.hero{background:var(--navy);color:var(--crema);border-radius:24px;padding:26px 20px 22px;margin-top:12px;position:relative;overflow:hidden}
.hero:after{content:"?";position:absolute;right:-6px;top:-34px;font-family:Fraunces,serif;font-size:170px;font-weight:800;color:var(--amarillo);opacity:.16}
.marca{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--amarillo)}
.hero h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:44px;line-height:1;margin:6px 0 4px}
.hero .mano{font-family:Caveat,cursive;font-size:25px;color:var(--amarillo);line-height:1.1}
.hero p{margin-top:12px;font-size:16px;opacity:.92;max-width:34ch}
.progreso{margin-top:18px;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px}
.progreso .fila{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.progreso .fila + .fila{margin-top:10px}
.barra{height:10px;background:rgba(255,255,255,.18);border-radius:10px;margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--amarillo);border-radius:10px;transition:width .4s}
.barra.v i{background:#8FD3B0}
.accesos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.acceso{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--amarillo);border-radius:var(--radio);padding:14px 14px 13px;text-align:left;box-shadow:0 3px 0 var(--oro);min-height:104px}
.acceso.b{background:var(--blanco);border:2px solid var(--borde);box-shadow:none}
.acceso .ico{font-size:26px;line-height:1}
.acceso b{font-size:16px;font-weight:800;margin-top:6px;line-height:1.2}
.acceso span{font-size:13px;color:var(--navy2);line-height:1.3}
.medallero{display:flex;gap:6px;margin-top:12px;justify-content:space-between}
.med-mini{flex:none;width:36px;height:36px;font-size:17px!important;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--crema2);filter:grayscale(1);opacity:.45}
.med-mini.si{filter:none;opacity:1;background:var(--amarillo);box-shadow:0 2px 0 var(--oro)}
.buscar{margin-top:18px;position:relative}
.buscar input{width:100%;font-size:16px;padding:14px 16px 14px 44px;border-radius:14px;border:2px solid var(--borde);background:var(--blanco);color:var(--navy)}
.buscar input:focus{outline:none;border-color:var(--navy)}
.buscar .lupa{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
.seccion{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:20px;margin:24px 0 10px}
.etapas{display:grid;gap:12px}
.etapa{display:flex;align-items:center;gap:14px;background:var(--blanco);border:2px solid var(--borde);border-radius:var(--radio);padding:14px 16px;text-align:left;width:100%}
.etapa .num{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:800;font-size:22px;color:var(--blanco)}
.etapa b{display:block;font-size:17px;line-height:1.25}
.etapa small{color:var(--gris);font-size:14px;font-weight:600}
.c1{background:var(--terra)}.c2{background:var(--navy2)}.c3{background:var(--oro)}.c4{background:var(--verde)}

/* Lista */
.lista{display:grid;gap:10px;margin-top:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--blanco);border:2px solid var(--borde);border-radius:16px;padding:13px 14px;text-align:left;width:100%}
.item .n{flex:none;font-size:13px;font-weight:800;color:var(--gris);width:26px}
.item .q{flex:1;font-weight:700;line-height:1.3}
.item .ok{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--borde);display:grid;place-items:center;font-size:15px;color:var(--blanco)}
.item.hecho .ok{background:var(--verde);border-color:var(--verde)}
.item .mem{flex:none;font-size:15px}
.etq{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--amarillo);color:var(--navy);padding:2px 8px;border-radius:20px;margin-bottom:4px}
.vacio{text-align:center;color:var(--gris);padding:30px 10px}

/* Pregunta */
.preg h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:28px;line-height:1.15;margin:4px 0 16px}
.edad{display:grid;grid-template-columns:1fr 1fr;background:var(--crema2);border-radius:14px;padding:4px;gap:4px}
.edad button{padding:10px 6px;border-radius:11px;font-weight:800;font-size:15px;color:var(--gris)}
.edad button[aria-pressed="true"]{background:var(--blanco);color:var(--navy);box-shadow:0 1px 3px rgba(30,42,74,.12)}
.globo{position:relative;background:var(--navy);color:var(--crema);border-radius:22px;padding:20px 20px 18px;margin-top:14px;font-size:18px;line-height:1.55}
.globo:before{content:"Decilo así";display:block;font-family:Caveat,cursive;font-size:24px;color:var(--amarillo);line-height:1;margin-bottom:8px}
.globo:after{content:"";position:absolute;left:30px;bottom:-12px;border:12px solid transparent;border-top-color:var(--navy);border-bottom:0}
.globo .ref{color:var(--amarillo);border-bottom-color:var(--amarillo)}
.oir{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-weight:800;font-size:15px;background:var(--blanco);border:2px solid var(--borde);border-radius:30px;padding:8px 14px}
.bloque{margin-top:26px}
.bloque h3{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:20px;margin-bottom:10px}
.ayuda{font-size:14px;color:var(--gris);margin:-4px 0 10px}
.pista{background:var(--blanco);border:2px solid var(--borde);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.pista .cab{display:flex;gap:10px;align-items:flex-start}
.pista .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--amarillo);display:grid;place-items:center;font-weight:800}
.pista b{display:block;line-height:1.3}
.cita{display:inline-block;font-size:13px;font-weight:800;color:var(--terra);margin-top:2px}
.hist{display:inline-block;font-size:12px;font-weight:800;color:var(--navy2);background:var(--crema2);border-radius:20px;padding:2px 9px;margin-top:4px}
.pista p{margin-top:8px;font-size:16px;color:var(--navy2)}
.ref{display:inline;font:inherit;font-weight:800;color:var(--terra);border-bottom:2px dotted var(--terra);padding:0;line-height:inherit;text-align:inherit}
.pista .cab .ref{font-size:13px}
.vers{background:var(--amarillo);border-radius:20px;padding:34px 20px 20px;position:relative}
.vers:before{content:"“";position:absolute;left:16px;top:-14px;font-family:Fraunces,serif;font-size:72px;font-weight:800;opacity:.25}
.vers q{display:block;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;line-height:1.4;quotes:none}
.vers small{display:block;margin-top:10px;font-weight:800;font-size:14px}
.vers .memo{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--navy);color:var(--crema);font-weight:800;font-size:15px;padding:9px 14px;border-radius:30px}
.acord{background:var(--blanco);border:2px solid var(--borde);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acord summary{list-style:none;padding:14px 44px 14px 16px;font-weight:800;position:relative;cursor:pointer;line-height:1.3}
.acord summary::-webkit-details-marker{display:none}
.acord summary:after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--terra)}
.acord[open] summary:after{content:"−"}
.acord .cuerpo{padding:0 16px 16px;font-size:16px;color:var(--navy2)}
.pensa{background:var(--crema2);border-radius:18px;padding:16px 18px}
.pensa .mano{font-family:Caveat,cursive;font-size:26px;color:var(--terra);line-height:1}
.pensa p{font-weight:700;margin-top:6px}
.oracion{border:2px dashed var(--oro);border-radius:18px;padding:16px 18px;font-style:italic;color:var(--navy2)}
.oracion b{font-style:normal;display:block;margin-bottom:4px;color:var(--navy)}
.lo-se{width:100%;margin-top:26px;padding:17px;border-radius:var(--radio);background:var(--verde);color:var(--blanco);font-weight:800;font-size:18px;box-shadow:0 3px 0 #2D6B4F}
.lo-se.hecho{background:var(--blanco);color:var(--verde);border:2px solid var(--verde);box-shadow:none}
.adultos{margin-top:26px}
.adultos .acord{border-color:var(--navy2)}
.adultos .acord summary{background:var(--navy2);color:var(--crema)}
.adultos .acord summary:after{color:var(--amarillo)}
.adultos .cuerpo p{margin-top:12px}
.adultos .cuerpo b{color:var(--navy)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.nav button{padding:13px;border-radius:14px;background:var(--crema2);font-weight:800;font-size:15px}
.nav button:disabled{opacity:.35}

/* Hoja con el versículo */
.velo{position:fixed;inset:0;background:rgba(30,42,74,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.hoja{background:var(--crema);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:sube .25s ease}
.hoja .asa{width:44px;height:5px;border-radius:5px;background:var(--borde);margin:0 auto 14px}
.hoja .r{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px}
.hoja .ver{font-size:13px;font-weight:800;color:var(--terra);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.hoja .texto{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;line-height:1.5;margin-top:14px}
.hoja .texto sup{font-family:Nunito,sans-serif;font-size:12px;font-weight:800;color:var(--terra);margin-right:3px}
.hoja .btn{margin-top:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sube{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

/* Memoria */
.mem-card{background:var(--amarillo);border-radius:22px;padding:20px;margin-top:8px}
.mem-card .r{font-weight:800;font-size:14px;margin-bottom:10px}
.mem-texto{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;line-height:1.7}
.hueco{display:inline-block;min-width:54px;border-bottom:3px solid var(--navy);margin:0 2px;color:transparent;line-height:1.2}
.hueco.act{border-bottom-color:var(--terra);background:rgba(255,255,255,.45);border-radius:4px 4px 0 0}
.hueco.ok{color:var(--verde);border-bottom-color:var(--verde);min-width:0;margin:0}
.niveles{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.niveles i{width:34px;height:8px;border-radius:8px;background:var(--crema2)}
.niveles i.si{background:var(--verde)}
.fichas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.ficha{background:var(--blanco);border:2px solid var(--borde);border-radius:12px;padding:9px 13px;font-weight:800;font-size:16px;box-shadow:0 2px 0 var(--borde)}
.ficha.mal{animation:sacude .35s;border-color:var(--terra)}
.ficha.usada{visibility:hidden}
@keyframes sacude{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Desafío y logros */
.des-card{background:var(--blanco);border:2px solid var(--borde);border-radius:24px;padding:24px 20px;margin-top:10px;text-align:center}
.des-card .etq{margin-bottom:12px}
.des-card h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:27px;line-height:1.2}
.des-card .mano{font-family:Caveat,cursive;font-size:25px;color:var(--terra);margin-top:16px;line-height:1.1}
.btn{display:block;width:100%;padding:16px;border-radius:var(--radio);font-weight:800;font-size:17px;margin-top:12px;text-align:center}
.btn.prim{background:var(--navy);color:var(--crema)}
.btn.amar{background:var(--amarillo);box-shadow:0 3px 0 var(--oro)}
.btn.suave{background:var(--crema2)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.racha{text-align:center;font-weight:800;color:var(--gris);font-size:14px;margin-top:10px}
.fiesta{text-align:center;padding:30px 10px}
.fiesta .big{font-size:60px}
.fiesta h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:28px;margin:10px 0}
.medallas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.medalla{background:var(--blanco);border:2px solid var(--borde);border-radius:18px;padding:16px 12px;text-align:center}
.medalla .m{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--crema2);filter:grayscale(1);opacity:.5}
.medalla.si .m{filter:none;opacity:1;background:var(--amarillo);box-shadow:0 3px 0 var(--oro)}
.medalla b{display:block;margin-top:10px;line-height:1.25;font-size:15px}
.medalla small{display:block;color:var(--gris);font-size:13px;font-weight:600;margin-top:2px}
.cert-link{display:flex;align-items:center;gap:12px;background:var(--navy);color:var(--crema);border-radius:var(--radio);padding:16px;margin-top:18px;text-align:left;width:100%}
.cert-link .ico{font-size:30px}
.cert-link b{display:block}
.cert-link span{font-size:14px;opacity:.85}

/* Certificado */
.cert{background:var(--blanco);border:3px solid var(--oro);outline:8px solid var(--amarillo);outline-offset:-16px;border-radius:12px;padding:34px 26px;margin-top:12px;text-align:center}
.cert .marca{color:var(--terra)}
.cert h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:30px;line-height:1.1;margin:8px 0 16px}
.cert .otorga{font-size:15px;color:var(--gris)}
.cert .nombre{font-family:Caveat,cursive;font-size:44px;line-height:1.1;margin:6px 0;color:var(--navy);border-bottom:2px solid var(--borde);padding-bottom:4px;min-height:52px}
.cert p{font-size:16px;margin-top:12px}
.cert .v{font-family:Fraunces,Georgia,serif;font-weight:600;font-style:italic;font-size:15px;color:var(--navy2);margin-top:18px}
.cert .v small{display:block;font-style:normal;font-weight:800;font-family:Nunito,sans-serif;font-size:13px;margin-top:4px}
.cert .fecha{margin-top:18px;font-size:14px;font-weight:700;color:var(--gris)}
.bloqueado{position:relative}
.bloqueado .cert{filter:blur(1.5px);opacity:.55}
.bloqueado .candado{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.candado div{background:var(--navy);color:var(--crema);border-radius:18px;padding:18px 20px;max-width:300px}
.candado b{display:block;font-size:18px;margin-top:6px}
.campo{margin-top:16px}
.campo label{font-weight:800;font-size:15px;display:block;margin-bottom:6px}
.campo input{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:2px solid var(--borde);background:var(--blanco);color:var(--navy)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:var(--crema);border-radius:16px;padding:12px 18px;font-weight:800;z-index:30;box-shadow:0 8px 24px rgba(30,42,74,.3);animation:sube .3s ease;max-width:92vw;text-align:center}
.pie{text-align:center;color:var(--gris);font-size:12px;margin-top:34px;line-height:1.5}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.hoja,.velo,.toast,.ficha.mal{animation:none}.barra i{transition:none}}
@media print{
  body{background:#fff}
  .no-print,.top,.toast{display:none!important}
  .app{max-width:none;padding:0}
  .cert{margin:0 auto;max-width:640px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.gate{position:fixed;inset:0;z-index:100;background:var(--crema);display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden]{display:none}
.gate-box{width:100%;max-width:380px;text-align:center}
.gate-ico{width:88px;height:88px;border-radius:22px;margin:0 auto 18px;display:block}
.gate h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:28px;line-height:1.15;margin-bottom:8px}
.gate p{color:var(--gris);font-size:16px;margin-bottom:20px}
.gate input{width:100%;font-size:20px;text-align:center;letter-spacing:.08em;text-transform:uppercase;padding:14px;border:2px solid var(--borde);border-radius:14px;background:#fff;color:var(--navy)}
.gate input:focus{outline:none;border-color:var(--navy)}
.gate button{width:100%;margin-top:12px;background:var(--navy);color:#fff;font-weight:800;font-size:18px;padding:15px;border-radius:14px}
.gate .err{color:var(--terra);font-size:14px;min-height:20px;margin:10px 0 0}
.gate small{display:block;color:var(--gris);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gate-form" autocomplete="off">
    <img class="gate-ico" src="icon-192.png" alt="">
    <h1>Demostrame</h1>
    <p>Escribí el código de acceso que te llegó en el mail de tu compra.</p>
    <input id="gate-input" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="CÓDIGO" aria-label="Código de acceso">
    <button type="submit">Entrar</button>
    <p class="err" id="gate-err" role="alert"></p>
    <small>¿No lo encontrás? Buscá el mail de Por Qué Creo en tu correo, también en spam.</small>
  </form>
</div>
<script>
(function(){
  var CODIGO = "BIBLIA52", K = "pqc-demostrame-acceso";
  var ok = false; try { ok = localStorage.getItem(K) === "1"; } catch(e) {}
  if (ok) return;
  var g = document.getElementById("gate"); g.hidden = false;
  document.documentElement.style.overflow = "hidden";
  document.getElementById("gate-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var v = document.getElementById("gate-input").value.replace(/\s+/g, "").toUpperCase();
    if (v === CODIGO) {
      try { localStorage.setItem(K, "1"); } catch(e) {}
      g.remove(); document.documentElement.style.overflow = "";
    } else {
      document.getElementById("gate-err").textContent = "Ese código no es. Revisá el mail de tu compra.";
    }
  });
})();
</script>

<script>
const DATOS = {"etapas": {"1": "Dios y la creación", "2": "¿Podemos confiar en la Biblia?", "3": "Jesús, la cruz y la resurrección", "4": "Vivir la fe"}, "preguntas": [{"n": 1, "e": 1, "q": "¿Cómo sé que Dios existe?", "rep": false, "ch": "Mirá esta casa. Alguien la pensó y alguien la hizo, ¿no? Nadie dejó unos ladrillos tirados y apareció sola. Con el mundo pasa lo mismo: tiene tanto orden que alguien lo tuvo que pensar. Ese alguien es Dios.", "gr": "No te puedo mostrar a Dios como te muestro una foto. Tampoco viste nunca el amor, y sabés que existe. Mirá el orden del universo y eso que sentís cuando algo es injusto. Todo apunta a alguien que está detrás. Y la Biblia dice que ese alguien se dio a conocer en Jesús.", "pi": [["Toda casa tiene un constructor", "Hebreos 3:4", "Nadie ve una casa y piensa que se armó sola. Donde hay orden y un propósito, hubo alguien que lo pensó. El mundo tiene muchísimo más orden que cualquier casa."], ["El cielo habla de Dios", "Salmo 19:1", "El cielo no usa palabras, pero muestra una grandeza que nos deja chiquitos. Pablo dice lo mismo en Romanos 1:20: lo invisible de Dios se ve en lo que hizo."], ["Sé lo que está bien y lo que está mal", "Romanos 2:15", "Cualquier persona, crea o no, sabe que lastimar a un chico está mal. Esa ley escrita en el corazón no aparece de la nada. Apunta a un Dios bueno que la puso ahí."]], "cita": "Hebreos 3:4", "vers": "Porque toda casa es hecha por alguno; pero el que hizo todas las cosas es Dios.", "or": "Gracias, Dios, porque te veo en todo lo que hiciste. Ayúdame a explicarlo con mis palabras. Amén.", "rq": [["¿Y si el universo se hizo solo?", "Todo lo que conocemos que empieza tiene una causa. Decir “se hizo solo” no explica de dónde salió. Lo van a ver con más calma en la semana 4."], ["¿Por qué Dios no aparece y listo?", "Apareció: vino en Jesús, y mucha gente lo vio y lo escuchó. Además Dios quiere que lo busquemos de corazón (Hechos 17:27). No nos obliga a creer."], ["Mi compañero dice que Dios no existe. ¿Qué le digo?", "No hace falta ganarle. Escuchalo y contale lo que vos creés, con respeto. Primera de Pedro 3:15 pide responder con mansedumbre y reverencia."]], "seg": "¿Qué cosa de la naturaleza te hace pensar que alguien la diseñó?", "det": "A esta edad empiezan a pedir pruebas de todo. En la escuela les enseñan a mostrar el procedimiento y a no creer algo solo porque un adulto lo dijo. Si tu hijo te pregunta esto, no está perdiendo la fe. Está empezando a hacerla suya.", "evi": "“Porque lo dice la Biblia y punto.” Es verdad para vos, pero a él le cierra la charla, y aprende que preguntar está mal.", "xt": "Si se traba", "x": "Preguntale: “¿Quién hizo tu mochila? ¿Se hizo sola?”. Dejá que llegue solo a la idea. Si encuentra los versículos pero no los entiende, léanlos juntos en voz alta y pedile que te los cuente con sus palabras.", "leer": "Génesis 1 · Salmo 19 · Romanos 1:18-23"}, {"n": 2, "e": 1, "q": "¿Quién creó a Dios?", "rep": false, "ch": "Vos tuviste un primer día, y tu bici también, y esta casa. Todo eso empezó, por eso alguien lo hizo. Dios nunca empezó. Siempre estuvo. Nadie lo hizo porque nunca hubo un momento sin Él. Cuesta imaginarlo, a mí también me cuesta.", "gr": "Preguntar quién creó a Dios es como preguntar con quién está casado un soltero: la pregunta ya supone algo que no es así. Solo necesita una causa lo que empieza, y Dios no empezó. Alguien tiene que ser el origen de todo sin venir de otro. La Biblia dice que ese es Dios.", "pi": [["Dios no tuvo principio: siempre existió", "Salmo 90:2", "Antes de las montañas y del mundo, Dios ya era Dios. No hubo un día en que no estuviera. Cuando Moisés le preguntó su nombre, respondió “YO SOY” (Éxodo 3:14)."], ["Todo lo que empieza necesita a alguien que lo empiece; Dios no empezó", "Génesis 1:1", "La Biblia arranca con Dios ya presente. Todo empezó “en el principio”, y Él ya estaba. Lo que tiene comienzo necesita una causa, y esa regla no le cabe a quien nunca comenzó."], ["Dios es el primero y el último", "Apocalipsis 1:8", "Alfa y Omega son la primera y la última letra del alfabeto griego. Es como decir “de la A a la Z”. Dios está antes de todo y después de todo: “el que es y que era y que ha de venir”."]], "cita": "Salmo 90:2", "vers": "Antes que naciesen los montes Y formases la tierra y el mundo, Desde el siglo y hasta el siglo, tú eres Dios.", "or": "Señor, tú siempre estuviste y siempre vas a estar. Gracias porque nunca cambias. Amén.", "rq": [["¿Cómo puede ser que no tenga principio?", "No lo podemos imaginar del todo, y es esperable: Dios es más grande que nuestra cabeza (Isaías 55:9). Que algo no nos entre en la imaginación no significa que sea falso."], ["¿Y qué hacía Dios antes de crear?", "La Biblia cuenta poco y conviene no inventar. Hay una pista: el Padre amaba al Hijo desde antes de la fundación del mundo (Juan 17:24). El amor ya estaba ahí."], ["¿Y a Jesús quién lo creó?", "Nadie. Jesús nació como hombre en Belén, pero como Hijo de Dios ya existía, y todas las cosas fueron hechas por Él (Juan 1:1-3). Lo retoman en la semana 29."]], "seg": "¿Qué te da más curiosidad de un Dios que no tiene principio ni fin?", "det": "Es de las preguntas más lindas que puede hacer. Suele aparecer cuando entendió que todo viene de algo: el pan de la panadería, él de vos. Aplica la misma lógica a Dios, y eso muestra que está pensando en serio. Festejale la pregunta.", "evi": "“Eso no se pregunta.” Le enseña que la fe se rompe con las preguntas. Mejor decile que es una buena pregunta y piénsenla juntos.", "xt": "Para hacerlo más real", "x": "Dibujen una línea corta con principio y fin: es la vida de una persona. Después hagan una que se salga de la hoja por los dos lados. Así es Dios, y hasta ese dibujo le queda chico.", "leer": "Salmo 90 · Éxodo 3:13-15 · Juan 1:1-3 · Apocalipsis 1:4-8"}, {"n": 3, "e": 1, "q": "Si no lo veo, ¿cómo sé que está ahí?", "rep": false, "ch": "¿Podés ver el viento? No, pero ves cómo se mueven los árboles. Con Dios pasa algo parecido: no lo vemos, pero vemos lo que hizo y lo que hace en la gente. Y para que lo conociéramos mejor, mandó a Jesús.", "gr": "Creés en muchas cosas que no viste: tus pensamientos, el amor de tu familia, la gravedad. Las conocés por lo que producen. Con Dios es parecido, con una diferencia enorme: en Jesús se hizo visible. Mucha gente lo vio, lo escuchó y dejó escrito lo que vivió.", "pi": [["No veo el viento, pero veo lo que mueve", "Juan 3:8", "Jesús usa esta imagen para hablar del Espíritu. El viento no se ve, pero se oye. Algo parecido pasa cuando Dios obra en una persona: se nota en lo que cambia en su vida."], ["Lo invisible de Dios se ve en lo que hizo", "Romanos 1:20", "Pablo dice que lo que no se ve de Dios se entiende mirando lo creado. Cuando mirás un dibujo no ves a quien lo hizo, y aun así sabés bastante de esa persona."], ["Jesús vino a mostrarnos cómo es Dios", "Juan 1:18", "Nadie vio a Dios, dice Juan, y el Hijo lo dio a conocer. Por eso Jesús le dice a Felipe: “El que me ha visto a mí, ha visto al Padre” (Juan 14:9). Para saber cómo es Dios, mirá a Jesús."]], "cita": "Juan 1:18", "vers": "A Dios nadie le vio jamás; el unigénito Hijo, que está en el seno del Padre, él le ha dado a conocer.", "or": "Dios, gracias por mandar a Jesús para que te conozca. Ayúdame a verte en lo que hiciste. Amén.", "rq": [["¿Por qué Dios no se deja ver ahora?", "La Biblia no lo explica todo. Jesús le dijo a Tomás que son bienaventurados los que creen sin haber visto (Juan 20:29). Y Pablo dice que un día veremos cara a cara (1 Corintios 13:12)."], ["¿Vos lo viste alguna vez?", "Con los ojos, no, y decilo tal cual. Contale dónde notás a Dios en tu vida: algo que oraste, una paz, un cambio. Eso vale más que una respuesta perfecta."], ["¿Y si me lo estoy imaginando?", "Es una duda honesta. Por eso la fe se apoya en hechos: Jesús vivió, murió y resucitó, y hubo testigos. La semana 32 lo mira de cerca."]], "seg": "¿Qué cosas reales conocés que no se pueden ver?", "det": "Para un chico, lo real es lo que ve y toca. Si no puede ver a Dios, es lógico que desconfíe. Detrás también puede haber otra cosa: quiere sentirlo cerca. Preguntale cuándo se le ocurrió y qué estaba pasando en ese momento.", "evi": "“Tenés que creer y listo.” Le suena a que no hay razones, y en esta pregunta las hay. Mostrale las pistas y dejalo pensar.", "xt": "Para hacerlo divertido", "x": "Prendan un ventilador frente a una cinta o una hoja, y pedile que te muestre el aire. No puede, pero ve lo que mueve. Después busquen juntos otras cosas que existen y no se ven.", "leer": "Juan 1:1-18 · Juan 3:1-8 · Juan 14:8-11 · Juan 20:24-29"}, {"n": 4, "e": 1, "q": "¿El universo apareció por casualidad?", "rep": false, "ch": "Si tirás una caja de legos al aire, ¿cae armado un castillo? No. Las estrellas, el sol y tu cuerpo están mucho mejor armados que un castillo de legos. Dios habló y todo empezó. Conoce cada estrella por su nombre, y a vos también.", "gr": "El universo tuvo un comienzo y tiene leyes tan precisas que las podemos estudiar con matemática. La casualidad no explica por qué hay algo en vez de nada, ni por qué hay orden. La Biblia dice quién está detrás: Dios, que lo creó y lo sigue sosteniendo.", "pi": [["Dios habló y todo empezó a existir", "Génesis 1:3", "Dios dijo “Sea la luz”, y fue la luz. La creación aparece como algo pensado y hecho a propósito. El Salmo 33:6 lo repite: por la palabra de Jehová fueron hechos los cielos."], ["Dios sostiene todo lo que existe", "Colosenses 1:17", "Pablo habla de Cristo: todas las cosas en Él subsisten, es decir, se mantienen. Dios no armó el universo y se fue. Hoy sigue en pie porque Él lo sostiene."], ["Dios conoce cada estrella por su nombre", "Isaías 40:26", "Isaías invita a levantar los ojos y mirar el cielo: Dios llama a todas las estrellas por su nombre. Nosotros ni podemos contarlas. Y ese mismo Dios se ocupa de tu hijo."]], "cita": "Génesis 1:1", "vers": "En el principio creó Dios los cielos y la tierra.", "or": "Creador, gracias por el cielo, las estrellas y todo lo que hiciste con tanto orden. Amén.", "rq": [["¿Y si se hizo solo?", "Todo lo que conocemos que empieza tiene una causa. Algo que todavía no existe no puede hacerse a sí mismo. Decir “se hizo solo” deja la pregunta sin contestar."], ["¿Y el Big Bang?", "Es una teoría científica sobre los comienzos del universo, y entre los cristianos hay distintas opiniones sobre ella. Todos coinciden en lo central: en el principio creó Dios (Génesis 1:1)."], ["¿Cuántos años tiene el universo?", "Las iglesias evangélicas no están de acuerdo en esto, y hay creyentes serios en distintas posturas. Si quieren saber más, pregúntenle a su pastor. Lo que todas comparten es quién lo creó."]], "seg": "Cuando mirás el cielo de noche, ¿qué pensás de quien lo hizo?", "det": "En la escuela escucha hablar del Big Bang y del espacio, y a veces alguien le dice que todo fue casualidad. Capaz te lo trae como un desafío. Aprovechalo: no hace falta ser científico para charlarlo, y su curiosidad es un regalo.", "evi": "“Eso que te enseñan en la escuela es mentira.” Lo obliga a elegir entre vos y su maestra, y mucho de lo que aprende está bien.", "xt": "Para hacerlo divertido", "x": "Escriban letras en papelitos, tírenlos al aire varias veces y vean si se arma una frase. Después miren el cielo de noche y charlen qué tiene más sentido: que eso haya salido solo o que alguien lo haya pensado.", "leer": "Génesis 1 · Salmo 33:6-9 · Isaías 40:21-26 · Colosenses 1:15-17"}, {"n": 5, "e": 1, "q": "¿Soy solo un animal más?", "rep": false, "ch": "Tu perro es hermoso, y lo hizo Dios. Vos tenés algo distinto: podés hablar con Dios, pedir perdón, amar y pensar para qué estás acá. La Biblia dice que te hizo a su imagen, como un reflejo de Él. Por eso sos muy valioso.", "gr": "Tenemos mucho en común con los animales, y eso no contradice la Biblia. Pero ningún animal se pregunta para qué vive ni le habla a Dios. Vos fuiste hecho a su imagen. Tu valor no depende de tus notas, de tu cuerpo ni de cuántos seguidores tengas.", "pi": [["Dios me hizo a su imagen", "Génesis 1:27", "De ninguna otra criatura se dice esto. Entre otras cosas, significa que podemos conocer a Dios, amar y elegir lo bueno. Vale para todas las personas, varones y mujeres, sin importar la edad."], ["Fui hecho de forma maravillosa", "Salmo 139:14", "David alaba a Dios porque lo formó en el vientre de su madre (versículo 13). Dios conoce a tu hijo desde antes de que naciera, y cada detalle de su vida le importa."], ["Dios se acuerda de mí y me cuida", "Salmo 8:4-5", "David mira el cielo y se pregunta por qué Dios se acuerda de alguien tan chiquito. La respuesta lo asombra: Dios coronó al hombre de gloria y de honra."]], "cita": "Génesis 1:27", "vers": "Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó.", "or": "Gracias, Dios, por hacerme a tu imagen. Ayúdame a tratar a otros como personas valiosas. Amén.", "rq": [["En la escuela dicen que venimos de los monos.", "Los creyentes ven la evolución de distintas maneras, y no hace falta resolverlo hoy. Todos afirman que Dios nos creó a su imagen. Si quieren profundizar, hablen con su pastor."], ["¿Entonces los animales no importan?", "Importan: los hizo Dios y nos los confió. Proverbios 12:10 dice que el justo cuida la vida de su bestia, y Jesús enseña que Dios alimenta a las aves (Mateo 6:26)."], ["¿También vale el que me cae mal?", "Sí. Todos están hechos a la semejanza de Dios, y Santiago 3:9 lo usa para frenar la boca. Eso no obliga a soportar que lo lastimen: si pasa, que te lo cuente."]], "seg": "¿Qué creés que significa estar hecho a imagen de Dios?", "det": "Seguro vio en Ciencias que tenemos un cuerpo parecido al de los animales, o escuchó que somos monos con celular. A veces la pregunta es teórica. Otras veces esconde algo más hondo: ¿valgo algo? Si notás que se siente poca cosa, empezá por ahí y mirá cómo está.", "evi": "“Qué vas a ser un animal, no digas pavadas.” Le cierra la charla justo cuando quizás te estaba contando cómo se siente.", "xt": "Para hacerlo más real", "x": "Hagan juntos una lista de lo que hacemos las personas y un animal no: orar, pedir perdón, inventar una canción, preguntarnos para qué vivimos. Después denle gracias a Dios por eso.", "leer": "Génesis 1:26-31 · Génesis 2:7 · Salmo 8 · Salmo 139:13-18"}, {"n": 6, "e": 1, "q": "¿La ciencia y la Biblia se pelean?", "rep": false, "ch": "Dios hizo el mundo, y la ciencia estudia cómo funciona. Es como desarmar un reloj para ver cómo anda: cuanto más lo mirás, más te asombra quien lo hizo. Seguí preguntando y aprendiendo, que a Dios no le molesta.", "gr": "La ciencia responde cómo funcionan las cosas. No puede decirte para qué existimos o por qué está mal mentir. Kepler, Newton y Pascal hicieron ciencia creyendo en Dios. Si algo de la escuela choca con lo que leés en la Biblia, traelo a casa y lo miramos juntos, sin miedo.", "pi": [["Estudiar la creación es estudiar las obras de Dios", "Salmo 111:2", "“Buscadas” quiere decir estudiadas con ganas. Cuando tu hijo investiga cómo vuela un pájaro o cómo late el corazón, está mirando de cerca lo que Dios hizo."], ["Muchos científicos que descubrieron cómo funciona el mundo creían en Dios: Kepler, Newton, Pascal", "Historia", "Kepler estudió cómo se mueven los planetas, Newton la gravedad y Pascal la presión del aire. Los tres creían en Dios y siguieron investigando."], ["Dios nos invita a investigar", "Proverbios 25:2", "El proverbio habla de reyes, y la idea nos sirve: Dios no puso todo a la vista. Buscar, preguntar y estudiar honra a quien lo hace, y no es falta de fe."]], "cita": "Salmo 111:2", "vers": "Grandes son las obras de Jehová, Buscadas de todos los que las quieren.", "or": "Señor, gracias por darme curiosidad. Que todo lo que aprenda me acerque más a ti. Amén.", "rq": [["Mi profe dice que la ciencia prueba que Dios no existe.", "La ciencia estudia lo que se puede medir y observar. A Dios no se lo puede poner en un laboratorio, así que esa conclusión no sale de la ciencia. Hoy también hay científicos creyentes."], ["¿Y si la Biblia dice una cosa y la ciencia otra?", "Miren bien qué dice el texto y qué dice de verdad la ciencia. A veces el choque viene de cómo se entendió una de las dos. Si no se resuelve, vale decir “todavía no lo sé”."], ["¿La Biblia es un libro de ciencia?", "Se escribió para mostrarnos a Dios y la salvación (2 Timoteo 3:15), y lo que dice es verdad. Usa el lenguaje de la gente de su tiempo: por ejemplo, habla del sol que sale."]], "seg": "¿Qué cosa del mundo te gustaría investigar para ver cómo la hizo Dios?", "det": "Muchos chicos escuchan que hay que elegir: o creés en Dios o creés en la ciencia. Tu hijo necesita saber que no tiene que esconder lo que aprende cuando va a la iglesia, ni esconder su fe cuando va a la escuela.", "evi": "“La ciencia está equivocada, no le hagas caso.” Le plantea una pelea entre su fe y lo que le gusta estudiar, y la Biblia no le pide esa pelea.", "xt": "Para investigar juntos", "x": "Pongan una semilla en un frasco con algodón húmedo y anoten qué pasa cada día. Mientras la miran, charlen: Dios la hizo crecer así, y nosotros podemos aprender cómo funciona.", "leer": "Salmo 19:1-6 · Salmo 104 · Proverbios 25:2 · Romanos 1:19-20"}, {"n": 7, "e": 1, "q": "Si Dios es bueno, ¿por qué hay cosas malas?", "rep": false, "ch": "Dios hizo un mundo lindo, pero las personas le dieron la espalda y el mundo se rompió. Por eso hay cosas feas. A Dios no le gustan, a Él también le duelen. Jesús lloró cuando murió su amigo. Y un día Dios va a arreglar todo.", "gr": "No tengo una explicación para cada cosa mala, y no te voy a inventar una. Lo que sé es esto: el mal no viene de Dios, entró por el pecado. Dios no se quedó mirando de lejos: vino y sufrió en la cruz. Y prometió que un día no va a haber más llanto.", "pi": [["El mal entró al mundo por el pecado", "Romanos 5:12", "El mundo que Dios hizo era bueno. El pecado lo rompió, y esa rotura nos alcanza a todos. Ojo: esto no significa que cada dolor sea el castigo por algo que hizo esa persona. Jesús lo aclara en Juan 9:3."], ["Dios no hace el mal", "Santiago 1:13", "Santiago dice que Dios no tienta a nadie, y el versículo 17 agrega que todo lo bueno viene de Él. Por eso conviene no decir que Dios “mandó” una enfermedad o una tragedia para enseñarnos algo."], ["Dios puede sacar algo bueno incluso de lo malo", "Romanos 8:28", "El versículo no dice que todo lo que pasa sea bueno. Dice que a los que aman a Dios todas las cosas les ayudan a bien. La cruz es el ejemplo más grande."]], "cita": "Romanos 8:28", "vers": "Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados.", "or": "Dios, cuando pasan cosas feas, ayúdame a confiar en que tú sigues siendo bueno. Amén.", "rq": [["¿Por qué Dios no lo frena?", "No lo sabemos todo. Lo que sí sabemos es que Dios no está quieto: en la cruz enfrentó el mal, y va a terminar con él (Apocalipsis 21:4). Decir “no lo sé” acá también es una buena respuesta."], ["¿Le pasó eso porque hizo algo malo?", "No. Jesús lo dijo sobre el ciego de nacimiento: no le pasó por un pecado suyo ni de sus padres (Juan 9:3). Nunca le echamos la culpa de su dolor a quien está sufriendo."], ["Le pedí a Dios que no pasara y pasó.", "Eso duele, y se lo podés decir a Dios tal cual. Jesús mismo oró con angustia (Mateo 26:39). Esto lo retoman en la semana 44."]], "seg": "¿Hay algo feo que viste o que te pasó y te gustaría contarle a Dios?", "det": "Casi nunca es una pregunta teórica. Puede venir de una noticia, de un abuelo enfermo, de los papás que se separaron, de un compañero que la pasa mal. Antes de contestar, preguntale qué le hizo pensar en esto. Si detrás hay un dolor, primero abrazalo. La explicación puede esperar.", "evi": "“Todo pasa por algo” o “Dios se la llevó porque la necesitaba”. Lo decimos con amor, pero a un chico le deja la idea de un Dios que le quita lo que quiere.", "xt": "Si se pone triste", "x": "Parar acá también es hacer bien la semana. Pueden dejar el cuaderno, orar juntos y seguir otro día. Si lo que lo angustia es algo grave, buscá ayuda de tu pastor o de un profesional.", "leer": "Job 1 y 2 · Salmo 13 · Juan 11:1-44 · Apocalipsis 21:1-5"}, {"n": 8, "e": 1, "q": "¿Cómo es Dios?", "rep": false, "ch": "Dios nos ama más que nadie. También es santo: en Él no hay nada malo, nunca miente. Y siempre cumple lo que dice. Cuando te portás mal, te sigue amando. Cada mañana, cuando te levantás, su amor está ahí como nuevo.", "gr": "Si querés saber cómo es Dios, mirá a Jesús. Ahí ves su amor, porque dio la vida por nosotros, y su santidad, porque el pecado no le da lo mismo. Y es fiel: no te ama según cómo te fue en la semana. Nada de lo que digamos lo describe del todo.", "pi": [["Dios es amor", "1 Juan 4:8", "Juan dice que Dios es amor: amar le sale de quién es. El versículo siguiente muestra cómo lo vimos: Dios envió a su Hijo al mundo. Ese amor se conoce mirando a Jesús."], ["Dios es santo: no hay nadie como él", "Isaías 6:3", "Santo quiere decir apartado, distinto de todo lo demás: en Dios no hay maldad. Isaías lo ve y se asusta de su propio pecado, y Dios lo limpia por medio de un serafín (versículos 5 al 7)."], ["Dios es fiel: cada mañana su amor es nuevo", "Lamentaciones 3:22-23", "Lamentaciones se escribió con Jerusalén destruida, y en medio de ese dolor dice “grande es tu fidelidad”. Cuando tu hijo falla, las misericordias de Dios no se agotan."]], "cita": "1 Juan 4:8", "vers": "El que no ama, no ha conocido a Dios; porque Dios es amor.", "or": "Gracias, Dios, porque eres amor, eres santo y nunca me fallas. Amén.", "rq": [["¿Dios se enoja?", "Sí, contra el mal y la injusticia, como te enojarías si lastiman a alguien que querés. Y el Salmo 103:8 dice que es lento para la ira y grande en misericordia."], ["¿Dios es varón o mujer?", "Dios es Espíritu (Juan 4:24), no tiene un cuerpo como el nuestro. Jesús nos enseñó a llamarlo Padre, y así le hablamos. Esa palabra nos habla de su cuidado."], ["Si me ama, ¿por qué me pasan cosas feas?", "El amor de Dios no significa que nada duela, y la semana 7 habla de esto. Si te lo pregunta por algo que le pasó, primero escuchalo y abrazalo."]], "seg": "Si tuvieras que contarle a un amigo cómo es Dios, ¿qué le dirías primero?", "det": "Tu hijo ya tiene una imagen de Dios armada, aunque no la diga. Puede ser un abuelo bueno, un juez enojado o un señor lejano. Buena parte la saca de cómo le hablamos de Dios en casa. Antes de contestar, pedile que te cuente cómo se lo imagina.", "evi": "“Dios te va a castigar si hacés eso.” Usar a Dios para poner orden en casa le deja una imagen de Él que da miedo y aleja.", "xt": "Para hacerlo más real", "x": "Lean juntos una historia de Jesús, como Lucas 15 o Juan 11, y pregúntense qué muestra de cómo es Dios. Jesús dijo que quien lo ve a Él ve al Padre (Juan 14:9), así que sus historias son el mejor retrato.", "leer": "Isaías 6:1-8 · Lamentaciones 3:21-26 · 1 Juan 4:7-12 · Salmo 103"}, {"n": 9, "e": 1, "q": "¿Dios es uno o son tres?", "rep": false, "ch": "Hay un solo Dios. Y ese único Dios es Padre, Hijo y Espíritu Santo. Son tres, y no son tres dioses. ¿Es difícil? Sí, a mí también me cuesta. Dios es tan grande que no entra del todo en nuestra cabeza. Igual podemos conocerlo y hablar con Él.", "gr": "La Biblia dice que hay un solo Dios. También muestra que el Padre es Dios, que Jesús es Dios y que el Espíritu es Dios, y que no son la misma persona: Jesús le ora al Padre. Eso es la Trinidad. Ninguna comparación alcanza, y no hace falta que te entre entera en la cabeza.", "pi": [["Hay un solo Dios", "Deuteronomio 6:4", "Es la gran confesión de Israel. La Biblia es clarísima: no hay varios dioses. Todo lo que digamos del Padre, del Hijo y del Espíritu parte de acá. Adoramos a un solo Dios."], ["Padre, Hijo y Espíritu Santo aparecen juntos en el bautismo de Jesús", "Mateo 3:16-17", "En la misma escena, Jesús sale del agua, el Espíritu desciende como paloma y el Padre habla desde el cielo. Se los ve distintos y juntos."], ["Jesús nos mandó bautizar en el nombre de los tres", "Mateo 28:19", "Mirá el detalle: Jesús dice “en el nombre”, en singular, y nombra a los tres. Se pone a sí mismo y al Espíritu junto al Padre, con el mismo nombre."]], "cita": "2 Corintios 13:14", "vers": "La gracia del Señor Jesucristo, el amor de Dios, y la comunión del Espíritu Santo sean con todos vosotros. Amén.", "or": "Padre, Hijo y Espíritu Santo: aunque no lo entiendo todo, te adoro. Amén.", "rq": [["¿Entonces son tres dioses?", "No. La Biblia insiste en que Dios es uno (Deuteronomio 6:4). Son tres personas y un solo Dios. Si te trabás, decile: “No lo entiendo del todo, pero eso es lo que enseña la Biblia”."], ["¿Es como el agua, el hielo y el vapor?", "No, y tampoco como un huevo. Esas comparaciones confunden: el agua cambia de forma, y una cáscara no es un huevo entero. El Padre, el Hijo y el Espíritu son Dios al mismo tiempo."], ["¿La palabra Trinidad está en la Biblia?", "No, y conviene decirlo. Es la palabra que usaron los cristianos para resumir lo que la Biblia enseña. Lean 2 Corintios 13:14, donde aparecen los tres juntos."]], "seg": "¿Qué te gustaría preguntarle a Dios sobre esto cuando lo veas?", "det": "Quizás lo escuchó en la iglesia o se lo preguntó un amigo. Notó algo raro: decimos que hay un solo Dios y hablamos del Padre, de Jesús y del Espíritu. Tiene razón en que es difícil. Le hace bien ver que vos tampoco lo entendés del todo.", "evi": "“Cada uno es una parte de Dios.” Dios no se divide en pedazos: cada uno es Dios por completo. La frase suena fácil y enseña algo que la Biblia no dice.", "xt": "Si se traba", "x": "Decile la verdad: a vos también te cuesta. Lean Mateo 3:16-17 y que marque quién se bautiza, quién desciende y quién habla. Por ahora alcanza con eso. El resto lo va a ir entendiendo con los años.", "leer": "Deuteronomio 6:4-9 · Mateo 3:13-17 · Juan 14:15-26 · 2 Corintios 13:14"}, {"n": 10, "e": 1, "q": "¿Dios sabe todo y está en todas partes?", "rep": false, "ch": "Dios está con vos en la escuela, en casa y cuando te vas a dormir. Sabe todo de vos, hasta cuántos pelos tenés. Y te ama sabiendo todo. Aunque yo no esté, Él está. Cuando tengas miedo, le podés hablar bajito.", "gr": "Dios no tiene los límites que tenemos nosotros. Está en todo lugar y sabe todo, incluso lo que pensás y no le contás a nadie. Eso puede asustar un poco, hasta que ves lo mejor: te conoce entero, con lo bueno y lo malo, y te ama igual. Con Él no hace falta fingir.", "pi": [["No hay lugar donde Dios no esté", "Salmo 139:7-8", "David se pregunta adónde podría ir lejos de Dios y no encuentra lugar. Por eso tu hijo no está solo ni en la escuela ni de noche en su pieza, aunque no lo sienta."], ["Su entendimiento no tiene límite", "Salmo 147:5", "El mismo salmo dice que Dios cuenta las estrellas y sana a los quebrantados de corazón (versículos 3 y 4). Su saber se acerca a lo que nos duele."], ["Hasta mis cabellos están contados", "Mateo 10:30", "Nadie sabe cuántos pelos tiene. Dios, sí. Jesús lo dice para sacarnos el miedo: el versículo siguiente dice “no temáis”. Dios conoce los detalles más chicos de tu hijo."]], "cita": "Mateo 10:30", "vers": "Pues aun vuestros cabellos están todos contados.", "or": "Señor, gracias porque me conoces de verdad y aun así me amas. Amén.", "rq": [["¿Entonces me vigila todo el tiempo?", "Te mira como un papá que te cuida, con amor. Una cámara de seguridad no te quiere, Él sí. Si hiciste algo malo, se lo podés contar: 1 Juan 1:9 promete perdón a quien confiesa."], ["¿Cómo puede estar en todos lados a la vez?", "No lo sabemos explicar, y ninguna imagen alcanza. Nosotros tenemos cuerpo y ocupamos un lugar. Dios es Espíritu (Juan 4:24) y llena el cielo y la tierra (Jeremías 23:24)."], ["Si sabe lo que voy a hacer, ¿puedo elegir?", "Las iglesias lo explican de distintas maneras. Todas comparten dos cosas: Dios lo sabe todo, y cada uno responde por lo que elige. Si quieren más, hablen con su pastor."]], "seg": "¿En qué momento te gustaría acordarte de que Dios está con vos?", "det": "Puede venir de la curiosidad: ¿cómo hace para estar acá y en China? O de algo más íntimo: ¿me ve cuando hago algo malo? Según cómo se lo plantee, será consuelo o será miedo. Preguntale qué piensa cuando se lo imagina.", "evi": "“Portate bien, que Dios te está mirando.” Lo convierte en un policía, y tu hijo aprende a esconderse de Él en vez de acercarse.", "xt": "Para hacerlo divertido", "x": "Traten de contar los pelos de un pedacito chiquito de cabeza. Es imposible, y ahí está el versículo: Dios los tiene contados. Terminen leyendo Mateo 10:29-31, que habla de su cuidado hasta por un pajarito.", "leer": "Salmo 139:1-18 · Salmo 147:1-5 · Jeremías 23:23-24 · Mateo 10:29-31"}, {"n": 11, "e": 1, "q": "¿Dios me escucha cuando oro?", "rep": false, "ch": "Sí, Dios te escucha, aunque no lo oigas con las orejas. Podés hablarle como me hablás a mí, con tus palabras, y contarle lo que te pasa. A veces dice que sí, a veces que no y a veces que esperes. Como yo, pero Él nunca se equivoca.", "gr": "Orar no es pedir algo por una app. Es hablar con tu Padre. Él escucha y responde según lo que sabe que es mejor, aunque no siempre lo entendamos. Jesús pidió no pasar por la cruz y aun así confió. Contale lo que te pasa, incluso si estás enojado con Él.", "pi": [["Dios nos escucha cuando pedimos según su voluntad", "1 Juan 5:14", "“Conforme a su voluntad” quiere decir que pedimos confiando en que Él sabe más. Jesús oró así: “no sea como yo quiero, sino como tú” (Mateo 26:39)."], ["Dios promete responder", "Jeremías 33:3", "Dios se lo dice a Jeremías cuando estaba preso (versículo 1). No aclara cuándo ni cómo va a responder. Nos muestra a un Dios que quiere que lo llamemos."], ["Puedo contarle todo", "Filipenses 4:6", "Todo es todo: la prueba de mañana, el amigo enojado, un miedo que da vergüenza. Pablo pide orar con acción de gracias, y el versículo 7 habla de la paz de Dios."]], "cita": "Jeremías 33:3", "vers": "Clama a mí, y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces.", "or": "Gracias, Dios, porque siempre me escuchas. Enséñame a hablar contigo cada día. Amén.", "rq": [["Oré y no pasó nada.", "Eso duele, y vale decirlo. Que no haya pasado no significa que Dios no escuchó. A veces la respuesta tarda o es distinta. La semana 44 trata justo de esto."], ["No sé qué decirle.", "No hacen falta palabras lindas. Jesús pide evitar las vanas repeticiones (Mateo 6:7), y el Espíritu nos ayuda cuando no sabemos qué pedir (Romanos 8:26). Alcanza con “ayudame”."], ["Si Dios ya sabe, ¿para qué le cuento?", "Jesús dice que el Padre sabe lo que necesitamos antes de pedirlo (Mateo 6:8), y justo después nos enseña a orar. Lo ven con calma en la semana 40."]], "seg": "¿Qué te gustaría contarle hoy a Dios, aunque parezca algo chiquito?", "det": "Probablemente oró por algo y no pasó, o ve a los grandes con los ojos cerrados y no oye nada. A esta edad, orar puede parecer hablarle al techo. Si a vos también te pasó alguna vez, contáselo. Eso lo alivia más que un discurso.", "evi": "“Si no te respondió, es porque no oraste con suficiente fe.” Le carga la culpa a él y convierte la oración en una prueba que puede reprobar.", "xt": "Para hacerlo más real", "x": "Armen un cuaderno de oración: anoten qué le pidieron a Dios, con la fecha, y qué agradecen. Vuelvan a mirarlo en unas semanas. Las respuestas que no fueron “sí” también se charlan.", "leer": "Mateo 6:5-13 · Filipenses 4:4-7 · Romanos 8:26-27 · 1 Juan 5:14-15"}, {"n": 12, "e": 1, "q": "¿Para qué creó Dios el mundo?", "rep": false, "ch": "Dios hizo el mundo porque quiso, y para mostrar lo grande y lindo que es. Mirá el mar, los animales, las estrellas: todo eso habla de Él. Y te hizo a vos para que lo conozcas y seas su amigo. Sos parte de lo que Él quiso hacer.", "gr": "Dios no necesitaba nada: Hechos 17:25 lo dice claro. Creó porque quiso, para que se viera lo grande y bueno que es, y para que lo conociéramos. Por eso la pregunta por el sentido de tu vida tiene respuesta. No estás acá de casualidad. Estás acá para Él.", "pi": [["Para mostrar su gloria", "Apocalipsis 4:11", "En esta visión del cielo, adoran a Dios porque creó todas las cosas. Un atardecer muestra su gloria sin decir una palabra, y nuestra vida también la puede mostrar."], ["Para que lo busquemos y lo encontremos", "Hechos 17:27", "Pablo se lo dice en Atenas a gente que no conocía a Dios, y aclara que Él no está lejos de ninguno de nosotros. Dios nos puso en este mundo para que lo busquemos."], ["Me creó para él", "Isaías 43:7", "Dios lo dice de su pueblo: “para gloria mía los he creado”. Unos versículos antes le dice “yo te amé” (versículo 4). En Dios, su gloria y su amor van juntos."]], "cita": "Apocalipsis 4:11", "vers": "Señor, digno eres de recibir la gloria y la honra y el poder; porque tú creaste todas las cosas, y por tu voluntad existen y fueron creadas.", "or": "Señor, todo lo que hiciste es para tu gloria. Que mi vida también lo sea. Amén.", "rq": [["¿Dios estaba solo o aburrido?", "No. Antes del mundo, el Padre ya amaba al Hijo (Juan 17:24). Hechos 17:25 dice que Dios no necesita nada de nosotros. Nos creó sin ninguna falta que llenar."], ["¿No es medio egoísta querer gloria?", "En nosotros lo sería, porque buscamos lucirnos. Dios es lo mejor que existe, y que lo conozcamos nos hace bien a nosotros. Es como el sol: que brille nos da vida."], ["¿Para qué hizo los mosquitos?", "Buena pregunta, y no tenemos todas las respuestas. El Salmo 104:24 dice que Dios hizo todo con sabiduría, aunque no le veamos la vuelta a cada cosa. Pueden reírse juntos con esta."]], "seg": "¿Para qué creés que Dios te puso a vos en este mundo?", "det": "Detrás de esta pregunta suele haber otra: ¿para qué estoy acá? A esta edad empiezan a pensar en el sentido de las cosas, aunque lo digan en broma. Si lo notás pensativo o apagado, charlalo con calma. Esa segunda pregunta se retoma en la semana 49.", "evi": "“Dios te creó para que te portes bien.” Le deja la idea de un Dios que busca empleados. Nos creó para conocerlo, y de ahí nace lo demás.", "xt": "Para hacerlo más real", "x": "Salgan a caminar y que cada uno señale algo lindo que Dios hizo. En casa, hagan una oración corta de gracias por eso. Así entiende qué es darle gloria: ver algo lindo y agradecerle a quien lo hizo.", "leer": "Apocalipsis 4 · Hechos 17:22-31 · Isaías 43:1-7 · Salmo 104:24-31"}, {"n": 13, "e": 1, "q": "¿Cómo le explico a un amigo que Dios existe?", "rep": true, "ch": "Si tu amigo te pregunta, podés decirle: nadie hizo esta escuela por casualidad, alguien la pensó. Con el mundo pasa igual. Yo creo que lo hizo Dios, y que también nos hizo a vos y a mí. Si no te cree, no pasa nada. Seguís siendo su amigo.", "gr": "Podés decirle: mirá el orden del universo, y mirá lo que sabés sobre lo justo y lo injusto. Yo creo que todo eso apunta a un Dios que nos hizo a su imagen. Después preguntale qué piensa él y escuchalo. El respeto con el que hablás también dice algo de Dios.", "pi": [["Toda casa tiene constructor (semana 1)", "Hebreos 3:4", "Es lo más fácil de contar: nadie ve una casa y piensa que se hizo sola. Pedile que lo explique con un ejemplo propio, como su bici o su celular."], ["El universo no es casualidad (semana 4)", "Génesis 1:1", "De la semana 4 se lleva esto: Dios creó los cielos y la tierra, y el orden del universo apunta a Él. No necesita saber de física para decirlo."], ["Fui hecho a su imagen (semana 5)", "Génesis 1:27", "La semana 5 suma algo que toca al amigo de cerca: vos también valés. Si Dios nos hizo a su imagen, cada persona importa. Eso le puede llegar más que un argumento."]], "cita": "1 Pedro 3:15", "vers": "sino santificad a Dios el Señor en vuestros corazones, y estad siempre preparados para presentar defensa con mansedumbre y reverencia ante todo el que os demande razón de la esperanza que hay en vosotros;", "or": "Señor, dame valentía y amabilidad para hablar de ti cuando me pregunten. Amén.", "rq": [["¿Y si se burla de mí?", "Duele, y no hace falta pelear. Puede decir “yo lo creo así” y seguir. La semana 46 trata de esto. Si las burlas se repiten y lo lastiman, hablá con la escuela."], ["¿Y si me pregunta algo que no sé?", "Puede decir “no lo sé, lo voy a averiguar”. Es honesto y no lo hace quedar mal. Después lo buscan juntos en casa."], ["¿Y si no me cree?", "Convencerlo no es su trabajo: esa obra es del Espíritu Santo (Juan 16:8). Él puede contar, ser buen amigo y orar. La semana 51 sigue con esto."]], "seg": "Si un amigo te pregunta hoy, ¿qué le dirías con tus propias palabras?", "det": "Esta semana no hay tema nuevo: tu hijo junta lo que vio hasta acá. Puede que le dé vergüenza hablar de Dios con un amigo, o miedo a que se burlen. Decile que alcanza con contar lo que cree.", "evi": "“Tenés que convencerlo.” Le carga un peso que no le toca y convierte a su amigo en un proyecto. Alcanza con contar lo que cree y ser buen amigo.", "xt": "Para practicar", "x": "Actúen la escena: vos hacés de amigo que pregunta y él responde con sus palabras, usando una de las tres pistas. Después cambien de lugar. Una frase dicha por él vale más que un párrafo aprendido.", "leer": "Hechos 17:22-31 · Colosenses 4:5-6 · 1 Pedro 3:13-17"}, {"n": 14, "e": 2, "q": "¿Quién escribió la Biblia?", "rep": false, "ch": "La Biblia la escribieron muchas personas, como un pescador y un rey. Pero Dios los guiaba con su Espíritu para que pusieran lo que Él quería decirnos. Es como una carta de Dios escrita con distintas letras. Por eso la leemos distinto a cualquier otro libro.", "gr": "La escribieron unas 40 personas durante unos 1.500 años, y a cada una se le nota el estilo. Pero Pedro dice que hablaron guiadas por el Espíritu Santo. No se la inventaron. Dios usó lo que cada uno era para decir lo que Él quería decir.", "pi": [["Dios inspiró cada parte", "2 Timoteo 3:16", "“Inspirada” viene de una palabra griega que quiere decir “soplada por Dios”. Pablo dice “toda”, así que incluye también las partes difíciles. Por eso la Biblia tiene una autoridad que otros libros buenos no tienen."], ["Personas escribieron guiadas por el Espíritu Santo", "2 Pedro 1:21", "Dios no los usó como máquinas de escribir. Pedro escribe a su manera y Lucas a la suya, y el Espíritu Santo los guió para que dijeran lo que Él quería. Se nota la persona y se nota Dios."], ["Unos 40 autores, en unos 1.500 años, con un solo mensaje", "Historia", "Reyes, pastores, pescadores, un médico. Escribieron en hebreo, arameo y griego, en siglos distintos, muchos sin conocerse. Y todo apunta a la misma historia: Dios rescatando a las personas por medio de Jesús."]], "cita": "2 Timoteo 3:16", "vers": "Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia,", "or": "Gracias, Dios, por hablarnos en tu Palabra. Ayúdame a amarla y leerla. Amén.", "rq": [["¿Dios les dictaba palabra por palabra?", "La Biblia no explica el cómo con detalle. Sí muestra que cada autor conserva su forma de escribir, y que el Espíritu Santo los guió (2 Pedro 1:21)."], ["¿Se sabe quién escribió cada libro?", "De muchos sí, de otros no. Hebreos, por ejemplo, no dice quién lo escribió. Podés decirle “no lo sabemos” sin problema: eso no le quita nada a lo que enseña."], ["¿Cómo sabemos que es de Dios y no de ellos?", "Pablo cuenta que sus oyentes recibieron su mensaje como palabra de Dios (1 Tesalonicenses 2:13). Y vienen más razones en las semanas 15, 17 y 24. La confianza se arma de a poco."]], "seg": "¿Qué te gustaría preguntarle a alguno de los que escribieron la Biblia?", "det": "Tu hijo ya sabe que a los libros los escribe alguien. Por eso la frase “la Biblia es Palabra de Dios” le genera una duda lógica: si la escribieron personas, ¿cómo puede ser de Dios? Que lo pregunte significa que está pensando lo que lee. Es buena señal.", "evi": "“La escribió Dios directamente.” Tu hijo va a ver nombres como Pablo o Pedro y va a pensar que le contaste mal. Decile que la escribieron personas guiadas por Dios.", "xt": "Para hacerlo divertido", "x": "Busquen juntos a tres autores: el pescador Pedro (Mateo 4:18), el cobrador de impuestos Mateo (Mateo 9:9) y el médico Lucas (Colosenses 4:14). Preguntale con cuál se sentaría a charlar y por qué.", "leer": "2 Timoteo 3:14-17 · 2 Pedro 1:19-21 · Lucas 1:1-4"}, {"n": 15, "e": 2, "q": "¿La Biblia la inventaron personas?", "rep": false, "ch": "Si vos inventaras una historia de tus amigos, ¿contarías que tuvieron miedo y salieron corriendo? Seguro que no. Pero la Biblia cuenta que Pedro mintió y lloró. Y que lo castigaron por hablar de Jesús y siguió. Eso hace el que cuenta la verdad.", "gr": "La pregunta es qué ganaban. Se pintaron a sí mismos cobardes y lentos para entender. Por contarlo los metieron presos y los azotaron, y a algunos los mataron. La gente puede equivocarse en lo que cree, pero nadie se juega la vida por algo que sabe que inventó.", "pi": [["Los que escribieron fueron testigos, no inventores", "2 Pedro 1:16", "Pedro lo aclara: no siguieron fábulas, vieron con sus propios ojos. Juan dice lo mismo en 1 Juan 1:1. No todos estuvieron ahí: Lucas averiguó con los que sí estuvieron (Lucas 1:2-3)."], ["La Biblia cuenta hasta los errores de sus héroes, como Pedro", "Lucas 22:61-62", "Después de negar a Jesús tres veces, Pedro salió y lloró. La Biblia lo cuenta igual, como cuenta el pecado de David (2 Samuel 11). Quien inventa una historia para quedar bien borra esas partes."], ["Prefirieron sufrir antes que callar lo que vieron", "Hechos 4:20", "Les prohibieron hablar de Jesús y contestaron que no podían callar. Los azotaron y siguieron (Hechos 5:40-42). A Jacobo lo mataron a espada (Hechos 12:2). Nadie paga ese precio por algo que sabe que armó."]], "cita": "Hechos 4:20", "vers": "porque no podemos dejar de decir lo que hemos visto y oído.", "or": "Señor, gracias por los que contaron la verdad aunque les costara. Hazme valiente como ellos. Amén.", "rq": [["¿Y si se equivocaron o exageraron?", "Escribieron cuando todavía vivían testigos que podían desmentirlos. Pablo lo dice de frente en 1 Corintios 15:6. Y la semana 17 muestra lugares y personas que se pueden comprobar."], ["¿Y si la inventaron para mandar sobre la gente?", "Mirá lo que les pasó: cárcel, azotes, persecución. Y Jesús les enseñó a servir (Marcos 10:43-44). Un invento para tener poder habría terminado mejor para ellos."], ["Otras religiones también tienen libros. ¿Qué diferencia hay?", "Sin burlarte de lo que otros creen, decile que la fe cristiana se apoya en hechos con testigos, sobre todo la resurrección de Jesús, que van a ver en la semana 32."]], "seg": "¿Contarías algo que te hace quedar mal si no fuera cierto? ¿Por qué?", "det": "Puede que lo haya escuchado en la escuela, en un video o de un amigo: “la Biblia la inventaron para controlar a la gente”. Suena inteligente, y por eso se queda pegada. Antes de contestar, preguntale dónde la escuchó y qué piensa él.", "evi": "“Eso lo dicen los que no conocen a Dios.” Le enseña a desconfiar de quien piensa distinto en vez de responder. Mejor miren juntos qué dijeron los testigos.", "xt": "Para hacerlo más real", "x": "Lean Lucas 22:54-62 juntos. Preguntale: “Si vos inventaras un héroe, ¿lo harías quedar así?”. Después busquen Hechos 4:13-20 y miren en qué se convirtió ese mismo Pedro.", "leer": "2 Pedro 1:16-21 · Lucas 22:54-62 · Hechos 4:13-20 · 1 Juan 1:1-4"}, {"n": 16, "e": 2, "q": "¿La Biblia cambió con el tiempo?", "rep": false, "ch": "¿Viste el teléfono descompuesto? Ahí nadie puede volver a escuchar la primera frase. Con la Biblia es distinto: encontraron copias viejísimas y las compararon con las de ahora, y dicen lo mismo. Es como si encontraras la primera frase escrita en un papel.", "gr": "Si la Biblia hubiera cambiado, se notaría. Hay miles de copias antiguas de distintos lugares y se pueden comparar. En 1947 aparecieron rollos de Isaías mil años más viejos que los que se conocían, y el texto era prácticamente el mismo. Es de los textos antiguos mejor conservados que tenemos.", "pi": [["Hay más de 5.000 copias antiguas del Nuevo Testamento en griego", "Historia", "Ningún otro libro de la antigüedad tiene tantas copias. Las de las grandes obras griegas y romanas son muchas menos. Con tantas copias en distintos lugares, si alguien cambiaba algo en una, se nota al comparar con las otras."], ["Los Rollos del Mar Muerto mostraron que Isaías casi no cambió en 1.000 años", "Arqueología", "En 1947 aparecieron en unas cuevas de Qumrán. Uno trae Isaías completo, copiado cerca de mil años antes que las copias más antiguas que se conocían. Las diferencias son mínimas: letras, ortografía, alguna palabra."], ["Dios promete cuidar su Palabra", "Isaías 40:8", "Los copistas eran personas y cometían errores chicos. Pero ninguna de esas diferencias cambia lo que creemos. La hierba se seca, y la Palabra de Dios permanece."]], "cita": "Isaías 40:8", "vers": "Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre.", "or": "Dios, gracias por cuidar tu Palabra durante miles de años para que llegue a mí. Amén.", "rq": [["¿Y las diferencias entre las copias?", "Existen, y casi todas son de ortografía o de orden de palabras. Se conocen y se estudian, y ninguna toca lo central de la fe."], ["¿Por qué hay tantas versiones de la Biblia?", "Son traducciones a distintas épocas e idiomas, hechas desde esas mismas copias. Cambian las palabras en castellano, y el mensaje es el mismo."], ["¿Quién dice que las copias son reales?", "Las estudian especialistas de todo el mundo, creyentes y no creyentes. Los Rollos del Mar Muerto se pueden ver hoy en internet: el Museo de Israel tiene fotos del rollo de Isaías."]], "seg": "Si algo es importante para vos, ¿cómo harías para cuidarlo durante mil años?", "det": "Seguro escuchó que la Biblia es como el juego del teléfono descompuesto: uno la copia, otro la copia, y al final dice cualquier cosa. Suena lógico, y por eso engancha. Es una buena oportunidad para enseñarle a pedir datos antes de creerse una frase.", "evi": "“No hay ninguna diferencia entre las copias.” No es cierto, y si un día se entera, va a sentir que le mentiste. Decile la verdad: hay diferencias chicas y no cambian el mensaje.", "xt": "Para hacerlo divertido", "x": "Jueguen al teléfono descompuesto en familia. Después escriban la primera frase en un papel y hagan que cada uno la copie. Comparen: la copia escrita se mantiene, y eso es lo que hicieron los copistas.", "leer": "Isaías 40 · Lucas 1:1-4 · 2 Pedro 1:16-21"}, {"n": 17, "e": 2, "q": "¿Lo que cuenta la Biblia pasó de verdad?", "rep": false, "ch": "Los cuentos arrancan con había una vez. La Biblia nombra reyes y ciudades de verdad. Encontraron una piedra muy vieja con el nombre de Pilato, el que juzgó a Jesús, y el estanque donde un ciego volvió a ver. Mirá, hay fotos.", "gr": "La arqueología no prueba cada detalle. Lo que muestra es que la Biblia habla del mundo real: David aparece en una piedra del siglo IX antes de Cristo, Pilato en otra, y el estanque de Siloé está en Jerusalén. Los que la escribieron no contaban fantasías.", "pi": [["Una piedra antigua menciona la \"casa de David\" (Tel Dan)", "Arqueología", "Es una piedra del siglo IX antes de Cristo, hallada en 1993 en el norte de Israel. Un rey enemigo se agranda de sus victorias y nombra a la “casa de David”. Antes, algunos estudiosos dudaban de que David existiera."], ["Encontraron el estanque de Siloé donde Jesús sanó a un ciego", "Juan 9:7", "Juan nombra el lugar donde el ciego se lavó y volvió viendo. En 2004, unos obreros que arreglaban un caño en Jerusalén dieron con un estanque de la época de Jesús. Juan habla de un sitio real."], ["Una inscripción con el nombre de Poncio Pilato", "Arqueología", "Apareció en 1961 en Cesarea, en la costa de Israel. Es una piedra de su época con su nombre y su cargo. Lucas 3:1 lo nombra como gobernador de Judea, y Tácito y Josefo, que no eran cristianos, también hablan de él."]], "cita": "Lucas 1:4", "vers": "para que conozcas bien la verdad de las cosas en las cuales has sido instruido.", "or": "Señor, gracias porque tu Palabra habla de cosas que pasaron de verdad. Amén.", "rq": [["¿Todo lo de la Biblia ya se encontró?", "No. Mucho del pasado se perdió y se sigue excavando. Que algo no se haya encontrado no prueba que no pasó, y conviene decírselo así, sin exagerar."], ["¿Eso prueba que la Biblia es verdad?", "Muestra que habla de lugares y personas reales, y eso da confianza. Creerle a Dios es otro paso. La semana 32 mira lo más importante: la resurrección."], ["¿Y si las piedras son falsas?", "Las estudian especialistas de todo el mundo, creyentes y no creyentes. La estela de Tel Dan y la piedra de Pilato están en el Museo de Israel, en Jerusalén."]], "seg": "¿Qué lugar de la Biblia te gustaría visitar para verlo con tus ojos?", "det": "Escuchó que la Biblia es un libro de cuentos, y quiere saber si hablamos de cosas que pasaron o de historias lindas. Está bien que lo pregunte. La fe cristiana habla de hechos con nombres, lugares y fechas, y eso se puede mirar.", "evi": "“La arqueología ya demostró toda la Biblia.” No es cierto, y si un día lo averigua, va a desconfiar. Decile lo que sí muestra: personas y lugares reales.", "xt": "Para hacerlo más real", "x": "Busquen juntos en internet fotos de la estela de Tel Dan, la piedra de Pilato y el estanque de Siloé. Después abran Juan 9:7 y Lucas 3:1, y que tu hijo marque en su Biblia lo que vio en las fotos.", "leer": "Lucas 1:1-4 · Lucas 3:1-2 · Juan 9:1-11"}, {"n": 18, "e": 2, "q": "¿Por qué la Biblia tiene dos partes?", "rep": false, "ch": "Es como una película en dos partes. En la primera, Dios promete que va a mandar a alguien a salvarnos, y todos esperan. En la segunda llega: es Jesús. Si mirás una sola parte, te perdés la mitad. Por eso las leemos juntas.", "gr": "Son dos partes de una misma historia. El Antiguo Testamento muestra cómo Dios eligió un pueblo, le hizo promesas y anunció a un Salvador. El Nuevo cuenta que ese Salvador llegó. Jesús mismo les mostró a sus amigos que todo apuntaba a Él (Lucas 24:27).", "pi": [["El Antiguo Testamento promete, el Nuevo cumple", "Hebreos 1:1-2", "Hebreos dice que Dios habló de muchas maneras por los profetas, y al final nos habló por su Hijo. El Antiguo va abriendo la promesa. En el Nuevo llega Aquel de quien hablaban."], ["Jesús explicó que todo el Antiguo Testamento hablaba de él", "Lucas 24:27", "Después de resucitar, Jesús caminó con dos discípulos y les explicó lo que decían de Él Moisés y los profetas. Imaginate escuchar esa clase. Él mismo enseñó a leer el Antiguo Testamento de esa manera."], ["Las dos partes cuentan una sola historia: la de Jesús", "Juan 5:39", "Jesús les dice a los que estudiaban la Biblia que esas Escrituras daban testimonio de Él. Las primeras páginas preparan el camino, y el Nuevo Testamento muestra a quién esperaban. Una parte explica a la otra."]], "cita": "Juan 5:39", "vers": "Escudriñad las Escrituras; porque a vosotros os parece que en ellas tenéis la vida eterna; y ellas son las que dan testimonio de mí;", "or": "Jesús, gracias porque toda la Biblia me habla de ti. Amén.", "rq": [["¿Dios cambió de una parte a la otra?", "No. Malaquías 3:6 dice que Él no cambia. Ya en el Antiguo se presenta misericordioso (Éxodo 34:6), y en el Nuevo se sigue viendo su justicia en la cruz. Es el mismo Dios."], ["¿Entonces ya no sirve el Antiguo Testamento?", "Sirve, y mucho. Jesús dijo que no vino a abrogar la ley sino a cumplirla (Mateo 5:17), y Romanos 15:4 dice que se escribió para enseñarnos."], ["¿Por qué ya no se sacrifican animales?", "Porque esos sacrificios señalaban a Jesús. Él se ofreció una vez y para siempre (Hebreos 10:12). Lo van a ver con más calma en la semana 31."]], "seg": "¿Qué promesa te gustaría que te cumplieran, aunque tardara mucho?", "det": "Para tu hijo, la Biblia puede parecer dos libros distintos: uno con guerras y leyes, otro con Jesús. Tal vez quiera saber por qué hay un antes y un después, o para qué leer la parte vieja. Es una buena puerta para mostrarle cómo se une todo.", "evi": "“Quedate con el Nuevo, el Antiguo es viejo.” Le quita media Biblia, justo la que Jesús leía, y después no va a entender de qué hablaba Él.", "xt": "Para hacerlo divertido", "x": "Abran el índice de la Biblia y cuenten: 39 libros en el Antiguo y 27 en el Nuevo. Después busquen Isaías 9:6 y Lucas 2:11. Preguntale: “¿Qué se prometió acá y qué se cumplió allá?”.", "leer": "Lucas 24:13-27 · Jeremías 31:31-34 · Hebreos 1:1-4"}, {"n": 19, "e": 2, "q": "¿Para qué sirve leer la Biblia hoy?", "rep": false, "ch": "Cuando está oscuro y tenés una linterna, ves por dónde pisar. La Biblia es así. Te ayuda cuando no sabés qué hacer, cuando estás triste o tenés miedo. Ahí Dios te dice cosas que te hacen bien, como una comida rica cuando tenés hambre.", "gr": "La gente sigue siendo la misma: tiene miedo, envidia, amigos que fallan, ganas de pertenecer. La Biblia habla de todo eso. Te ayuda a ver qué está bien cuando todos hacen otra cosa, y te recuerda a quién le pertenecés. Dios te sigue hablando por ahí.", "pi": [["Me guía como una linterna", "Salmo 119:105", "La lámpara de esa época alumbraba unos pasos adelante, y no todo el camino. Así ayuda la Biblia: no le va a decir a tu hijo qué va a pasar en diez años, pero le da luz para la decisión de hoy."], ["Me alimenta por dentro", "Mateo 4:4", "Cuando el diablo tentó a Jesús, Él respondió con la Escritura. Igual que el cuerpo pide comida, por dentro necesitamos lo que Dios dice. Y como la comida, hace efecto de a poco, día tras día."], ["Es viva y me habla hoy", "Hebreos 4:12", "Hebreos dice que la Palabra es viva y eficaz. Un pasaje que leíste mil veces te puede tocar distinto en un día de angustia. A tu hijo le hace bien saber que leer la Biblia es escuchar a Alguien."]], "cita": "Salmo 119:105", "vers": "Lámpara es a mis pies tu palabra, Y lumbrera a mi camino.", "or": "Señor, que tu Palabra me guíe cada día, en casa, en la escuela y con mis amigos. Amén.", "rq": [["¿Y si me aburre?", "Decile que le creés y que a mucha gente le pasa. Busquen partes con historia, como Marcos o Lucas, o un Salmo corto. No hace falta leer mucho de una."], ["¿Tengo que leerla todos los días?", "Es una linda costumbre y ayuda, pero Dios ya lo ama, y leer no es la forma de ganarse ese amor. Mejor cinco minutos con ganas que una hora peleada."], ["Leo y no entiendo nada.", "Le pasa a mucha gente. La semana 23 trata justo de esto. Por ahora, que te pregunte a vos, o busquen juntos una parte más simple."]], "seg": "¿En qué momento de esta semana te hubiera servido una linterna de Dios?", "det": "A esta edad casi todo lo que le importa es nuevo: el celular, los juegos, las series. Un libro de hace miles de años le puede parecer de museo. Si te lo pregunta, quiere saber qué tiene que ver con su vida. Es una muy buena pregunta.", "evi": "“Si no leés la Biblia, Dios se pone triste.” Convierte un regalo en culpa, y va a leer por miedo o va a dejar. Mejor mostrale cómo la leés vos.", "xt": "Si se aburre", "x": "Empiecen con poco: un Salmo corto o un pedacito de Marcos, cinco minutos después de cenar. Que él elija dónde leer. Un versículo en la heladera también cuenta, y saltearse un día no arruina nada.", "leer": "Salmo 119:105-112 · Mateo 4:1-11 · Hebreos 4:12-13"}, {"n": 20, "e": 2, "q": "¿Los milagros de la Biblia son reales?", "rep": false, "ch": "Si vos armás un juego, podés cambiar las reglas, ¿no? Dios hizo todo lo que existe, y las reglas de la naturaleza también son de Él. Por eso Jesús pudo calmar una tormenta y sanar a un ciego. A Él nada le queda difícil.", "gr": "La ciencia estudia lo que pasa siempre, y eso está buenísimo. Un milagro es justo lo que no pasa siempre. La pregunta es si existe un Dios que hizo todo. Si existe, abrir un mar no es un problema para Él. Y la resurrección de Jesús tuvo testigos.", "pi": [["El que hizo las reglas de la naturaleza puede actuar sobre ellas", "Jeremías 32:17", "La ciencia describe cómo funcionan las cosas normalmente. Un milagro pasa cuando el que las creó hace algo distinto. Jeremías lo dice: Él hizo el cielo y la tierra, y no hay nada difícil para Él."], ["Muchos testigos vieron a Jesús resucitado", "1 Corintios 15:6", "La resurrección es el milagro central, y Pablo habla de más de 500 testigos. Si Jesús salió de la tumba, los otros milagros se vuelven creíbles. Lo van a mirar en detalle en la semana 32."], ["Los milagros muestran quién es Jesús", "Juan 20:30-31", "Juan dice para qué contó sus milagros: para que creamos que Jesús es el Hijo de Dios y tengamos vida. Jesús no hacía show: a los que le exigían una señal no les dio más que la señal de Jonás (Mateo 12:38-39). Cada milagro señala a quién es Él."]], "cita": "Lucas 1:37", "vers": "porque nada hay imposible para Dios.", "or": "Dios, gracias porque eres poderoso. Ayúdame a confiar en ti cuando algo parece imposible. Amén.", "rq": [["¿Por qué hoy no veo milagros como esos?", "Las iglesias evangélicas lo explican de distintas maneras. Todas coinciden en que Dios puede hacer lo que quiera y en que le podemos pedir. Ya en la Biblia no pasaban todos los días."], ["Le pedí un milagro y no pasó.", "Primero escuchalo, porque duele. No siempre entendemos por qué Dios responde como responde, y podés decírselo así. La semana 44 habla justo de esto."], ["¿No es como la magia?", "La magia es un truco o busca impresionar. Jesús sanaba por compasión (Mateo 14:14) y para mostrar quién era. Y nunca cobró entrada."]], "seg": "Si hubieras visto un milagro de Jesús, ¿a quién se lo contarías primero?", "det": "En la escuela aprende cómo funciona el mundo, y es lógico que eso le choque con un mar que se abre. Capaz escuchó que los milagros son cosas de gente de antes. Aprovechá: tu hijo está razonando, y la Biblia le da con qué pensar.", "evi": "“Si tuvieras más fe, lo creerías.” Lo deja solo con su duda y le hace sentir culpa. Mejor preguntale qué le cuesta creer y piensen juntos.", "xt": "Si se traba", "x": "Preguntale qué milagro le cuesta más creer y léanlo juntos. Después busquen Hechos 26:8, donde Pablo pregunta por qué parece increíble que Dios resucite muertos. Si Dios hizo todo, ¿qué le queda difícil?", "leer": "Jeremías 32:17-27 · Juan 2:1-11 · Juan 20:24-31 · Hechos 26:8"}, {"n": 21, "e": 2, "q": "¿Las historias del Antiguo Testamento son cuentos?", "rep": false, "ch": "En los dibujitos parecen cuentos, pero Jesús hablaba de Noé y de Jonás como personas de verdad. Y Él sabe más que nadie. Algunas cosas nos sorprenden porque Dios hizo algo que nosotros no podemos hacer. Para Él no es difícil.", "gr": "La Biblia tiene poesía y parábolas, y se nota cuando algo es una parábola. Pero a Noé y a Jonás Jesús los nombra como personas reales, y hasta compara su muerte con lo que le pasó a Jonás. Si confío en Jesús, me importa cómo leía Él esas historias.", "pi": [["Jesús habló de Noé como alguien real", "Mateo 24:37-38", "Jesús dice que su regreso va a ser como los días de Noé: la gente comía y se casaba sin darse cuenta de nada (versículo 39). Compara algo que va a pasar con algo que pasó. Así lo leía Él."], ["Jesús habló de Jonás como alguien real", "Mateo 12:40", "Jesús compara los tres días de Jonás dentro del gran pez con sus tres días en la tumba. Y en Mateo 12:41 dice que los hombres de Nínive se levantarán en el juicio. Eso no se dice de personajes de cuento."], ["Se escribieron para enseñarnos", "Romanos 15:4", "Pablo dice que lo escrito antes se escribió para enseñarnos. Por eso no las leemos como relatos simpáticos. En cada historia aparece el mismo Dios, que cuida, perdona y cumple lo que dice."]], "cita": "Romanos 15:4", "vers": "Porque las cosas que se escribieron antes, para nuestra enseñanza se escribieron, a fin de que por la paciencia y la consolación de las Escrituras, tengamos esperanza.", "or": "Jesús, quiero creer
